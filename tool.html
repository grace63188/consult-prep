<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 3.3.2 安全標頭：CSP（tool.html 的工具 iframe 為 srcdoc，會沿用本頁 CSP，故只封鎖 object 外不限制來源）、防被嵌入 -->
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; object-src 'none'">
<script>/* 3.3.2 防被嵌入：非同源頁面嵌入時隱藏並嘗試跳出 */(function(){if(window.top===window.self)return;var s=false;try{s=window.top.location.origin===location.origin}catch(e){}if(!s){document.documentElement.style.display='none';try{window.top.location.replace(location.href)}catch(e){}}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>專屬工具｜G.R.A.C.E Academy</title>
<script>window.CONSULT_CONFIG = {"GAS_URL": "https://script.google.com/macros/s/AKfycbyi0Ft0XQtzcJUNyGWd4SF-isIKl5gW8ANhwBm7iWQossIuOGyXiC_inruOXF_M4MaV/exec", "MODE": "gas", "BUILD": "2026.11.05_1446"};</script>
<style>
:root{color-scheme:dark;--ink:#110E0F;--t1:#F6EFEA;--t3:#A0948F;--rose:#FF2E8B;--gold:#C9A27A}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink)}
body{color:var(--t1);font:16px/1.7 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
#st{min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center}
#st main{max-width:380px}
.sp{width:36px;height:36px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(255,46,139,.25);border-top-color:var(--rose);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
h1{font-size:20px;margin:0 0 6px;font-family:'Noto Serif TC',serif}
.code{font-size:40px;letter-spacing:.08em;color:var(--gold);margin-bottom:6px;font-weight:700}
p{margin:0;color:var(--t3);font-size:14px}
a.btn{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;background:linear-gradient(180deg,#FF3D93,#E8247E);color:#fff;font-weight:700;text-decoration:none}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
</style>
</head>
<body>
<div id="st"><main><div class="sp" id="sp" aria-hidden="true"></div><div class="code" id="code" hidden>404</div><h1 id="ttl">正在開啟工具</h1><p id="msg" role="status">請稍候…</p><a class="btn" id="dl" href="#" hidden>下載工具</a></main></div>
<iframe id="fr" title="專屬工具" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
<script>
/*
 * 3.3.0 開啟工具：tool.html#<學姐鍵 16 碼>.<token 40 碼>[.<版本>]
 *   向資料中心 POST tool_open 取回 HTML（工具內容不放在本網站；token 只在 # 之後，不會送到伺服器記錄）
 *   以 iframe（srcdoc）執行；sandbox 不含 allow-same-origin（3.3.1 安全修正）：工具為獨立來源，讀不到本網站的瀏覽器儲存（後台登入 token）與父頁；
 *   工具內的 localStorage／sessionStorage 以記憶體版本代替（SHIM），登入、展示入口等在單次開啟期間可用，重新整理後不保留
 *   工具不需要父頁資料，不提供 postMessage 通道
 *   3.3.2 只開最新版：舊版網址（帶版本）一律失效；不再讀取後台登入 token
 *   3.3.2 交付連結：tool.html#dl.<flowId>.<簽章>（領取教材 dl.html 轉入；下載期限內可操作，期限後顯示已失效）
 */
window.addEventListener('hashchange', function () { location.reload(); });   // 換工具連結時重新載入
(function () {
  var C = window.CONSULT_CONFIG || {}, m = /^#([0-9a-f]{16})\.([0-9a-f]{40})(?:\.(\d{1,4}))?$/.exec(location.hash || ''), dl = /^#dl\.(mf[0-9A-Za-z-]{4,40}\.[0-9a-f]{12})$/.exec(location.hash || '');
  var sp = document.getElementById('sp'), msg = document.getElementById('msg'), ttl = document.getElementById('ttl');
  function fail(t, m2, code) { sp.style.display = 'none'; if (code) document.getElementById('code').hidden = false; ttl.textContent = t; msg.textContent = m2; }
  var SHIM = '<script>(function(){function S(){var d={};return{getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[String(k)]=String(v)},removeItem:function(k){delete d[String(k)]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}' +
    '["localStorage","sessionStorage"].forEach(function(n){var ok=false;try{ok=!!window[n]&&(window[n].setItem("__t","1"),window[n].removeItem("__t"),true)}catch(e){ok=false}if(!ok){try{Object.defineProperty(window,n,{value:S(),configurable:true})}catch(e){}}});})();<\/script>';
  function mount(html) {   // 注入 SHIM 後載入 sandbox iframe
    var i = html.search(/<head[^>]*>/i);
    html = i >= 0 ? html.replace(/<head[^>]*>/i, function (h) { return h + SHIM; }) : SHIM + html;
    var fr = document.getElementById('fr');
    fr.srcdoc = html;   // srcdoc（不用 blob：opaque 來源下工具內 location.reload() 會被擋）；sandbox 無 allow-same-origin，仍為獨立來源
    fr.style.display = 'block';
    document.getElementById('st').style.display = 'none';
  }
  /* 測試卡片：#demo 示範 HTML 工具（可操作）、#demo-zip 示範 ZIP 下載與說明 */
  if (location.hash === '#demo-zip') { sp.style.display = 'none'; ttl.textContent = '示範工具（ZIP・測試卡片）'; msg.textContent = '請下載後解壓縮，開啟 index.html，並使用展示模式測試。正式卡片會下載該學姐最新版的工具檔。'; var dz = document.getElementById('dl'); dz.href = 'assets/demo/demo-tool.zip'; dz.setAttribute('download', 'demo-tool.zip'); dz.hidden = false; document.title = '示範工具（ZIP）｜G.R.A.C.E Academy'; return; }
  if (location.hash === '#demo') {
    var xd = new XMLHttpRequest(); xd.open('GET', 'assets/demo/demo-index.html', true);
    xd.onload = function () { if (xd.status !== 200) { fail('示範工具讀取失敗', '請稍後再試', false); return; } mount(xd.responseText); document.title = '示範工具（測試卡片）｜G.R.A.C.E Academy'; };
    xd.onerror = function () { fail('示範工具讀取失敗', '網路連線失敗', false); }; xd.send(); return;
  }
  if (!m && !dl) { fail('找不到這個工具', '連結不完整，請回到後台或 LINE 重新開啟最新的工具連結', true); return; }
  if (!C.GAS_URL) { fail('預覽模式', '正式網站會在這裡開啟可直接操作的工具', false); return; }
  var req = dl ? { action: 'tool_open', dl: dl[1] } : { action: 'tool_open', tool: m[1], k: m[2] };
  if (m && m[3]) req.v = Number(m[3]);
  var slow = setTimeout(function () { msg.textContent = '連線中，請稍候…'; }, 3000);
  var x = new XMLHttpRequest();
  x.open('POST', C.GAS_URL, true);
  x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
  x.timeout = 60000;
  x.onload = function () {
    clearTimeout(slow);
    var j = null; try { j = JSON.parse(x.responseText); } catch (e) { j = null; }
    if (j && j.ok && j.data && /^https:\/\/[^\s"'<>]+$/.test(j.data.go || '')) {   // 最新版為 ZIP／網址
      document.title = (j.data.title || '專屬工具') + '｜G.R.A.C.E Academy';
      if (j.data.kind === 'zip') { sp.style.display = 'none'; ttl.textContent = (j.data.title || '專屬工具') + '（第 ' + j.data.version + ' 版・ZIP）'; msg.textContent = j.data.note || '請下載後解壓縮，開啟 index.html，並使用展示模式測試'; var d = document.getElementById('dl'); d.href = j.data.go; d.hidden = false; }
      else location.replace(j.data.go);
      return;
    }
    if (!j || !j.ok || !j.data || typeof j.data.html !== 'string') {
      if (j && j.code === 'ERR_DL_EXPIRED') fail('下載期限已過', '教材連結已失效。教材為一次性交付，不會補發；如有特殊狀況請聯繫官方 LINE。', false);
      else if (j && j.code === 'ERR_RATE_LIMIT') fail('開啟次數過多', '請稍候一分鐘再重新整理', false);
      else fail('找不到這個工具', (j && j.error) || '連結已失效，請回到後台重新開啟最新的工具連結', true);
      return;
    }
    document.title = (j.data.title || '專屬工具') + '｜G.R.A.C.E Academy';
    mount(j.data.html);
  };
  x.onerror = x.ontimeout = function () { clearTimeout(slow); fail('無法開啟工具', '網路連線失敗，請稍後再試', false); };
  x.send(JSON.stringify(req));
})();
</script>
</body>
</html>
