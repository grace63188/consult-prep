<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>示範工具｜測試卡片</title>
<style>body{margin:0;font:16px/1.7 -apple-system,'PingFang TC','Noto Sans TC',sans-serif;background:#F4E7DA;color:#3A1424}main{max-width:520px;margin:0 auto;padding:24px 16px}.bn{background:#3A1424;color:#F4E7DA;border-radius:12px;padding:10px 14px;font-size:14px}h1{font-size:22px;margin:18px 0 6px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid #C9A27A;background:#fff;color:#3A1424;font-weight:700;font-size:15px;cursor:pointer}button.p{background:#3A1424;color:#F4E7DA;border-color:#3A1424}input{min-height:44px;width:100%;box-sizing:border-box;border:1.5px solid #C9A27A;border-radius:10px;padding:0 12px;font-size:16px}ul{padding-left:20px}#n{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}</style></head>
<body><main><div class="bn">這是「測試卡片」的示範工具。正式卡片會開啟該學姊最新版的專屬工具。</div>
<h1>預約登記（示範）</h1><p>按鈕與輸入都可實際操作，用來確認「開啟工具」可直接使用。</p>
<div class="row"><button type="button" id="m">−</button><div id="n">0</div><button type="button" id="pl">＋</button></div>
<label for="t">預約姓名</label><input id="t" placeholder="輸入姓名後按新增"><div class="row"><button type="button" class="p" id="add">新增預約</button><button type="button" id="clr">清除</button></div>
<ul id="l"></ul></main>
<script>(function(){var n=0,N=document.getElementById('n');document.getElementById('pl').onclick=function(){N.textContent=++n};document.getElementById('m').onclick=function(){N.textContent=n=Math.max(0,n-1)};var L=document.getElementById('l'),T=document.getElementById('t');document.getElementById('add').onclick=function(){var v=T.value.trim();if(!v)return;var li=document.createElement('li');li.textContent=v+'｜'+new Date().toLocaleString('zh-TW',{hour12:false});L.appendChild(li);T.value=''};document.getElementById('clr').onclick=function(){L.innerHTML=''}})();</script></body></html>
