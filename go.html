<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 3.3.2 安全標頭：CSP 依本頁實際使用的資源列白名單；防被嵌入（meta 無法使用 frame-ancestors，改以腳本判斷） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'">
<script>/* 3.3.2 防被嵌入：非同源頁面嵌入時隱藏並嘗試跳出 */(function(){if(window.top===window.self)return;var s=false;try{s=window.top.location.origin===location.origin}catch(e){}if(!s){document.documentElement.style.display='none';try{window.top.location.replace(location.href)}catch(e){}}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>前往下單｜G.R.A.C.E Academy</title>
<script>window.CONSULT_CONFIG = {"GAS_URL": "https://script.google.com/macros/s/AKfycbyi0Ft0XQtzcJUNyGWd4SF-isIKl5gW8ANhwBm7iWQossIuOGyXiC_inruOXF_M4MaV/exec", "MODE": "gas", "BUILD": "2026.11.11_1820"};</script>
<style>
:root{color-scheme:dark;--ink:#110E0F;--t1:#F6EFEA;--t3:#A0948F;--rose:#FF2E8B}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--t1);font:16px/1.7 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;padding:24px 16px}
main{max-width:360px;text-align:center}
.sp{width:36px;height:36px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(255,46,139,.25);border-top-color:var(--rose);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
h1{font-size:20px;margin:0 0 6px;font-family:'Noto Serif TC',serif}
p{margin:0;color:var(--t3);font-size:14px}
a{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;background:linear-gradient(180deg,#FF3D93,#E8247E);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="sp" id="sp" aria-hidden="true"></div>
  <h1 id="ttl">正在前往官網下單頁</h1>
  <p id="msg" role="status">請稍候…</p>
  <a id="go" href="#" hidden>前往下單</a>
</main>
<script>
/* 3.3.0 下單通知卡片「前往下單」：先記錄點擊時間（order_click，免登入、簽章驗證）再轉到官網下單網址 */
(function () {
  var C = window.CONSULT_CONFIG || {}, q = /[?&]t=([^&#]+)/.exec(location.search), t = q ? decodeURIComponent(q[1]) : '';
  var SITE = /^https:\/\/(www\.)?graceschool\.com\.tw(\/[^\s"'<>]*)?$/, done = false;   // 3.3.2 與資料中心 schema ORDER.SITE_RE、orderUrlIssue 相同
  var msg = document.getElementById('msg'), sp = document.getElementById('sp'), a = document.getElementById('go');
  function go(u) { if (done) return; done = true; a.href = u; location.replace(u); setTimeout(function () { a.hidden = false; msg.textContent = '若沒有自動開啟，請點下方按鈕'; }, 1500); }
  function fail(m) { sp.style.display = 'none'; document.getElementById('ttl').textContent = '無法開啟下單頁'; msg.textContent = m; }
  if (t === 'test') {   // 3.3.0 測試卡片：說明後轉到官網下單頁（不記錄點擊）
    document.getElementById('ttl').textContent = '測試卡片：前往下單';
    msg.textContent = '正式卡片會先記錄點擊時間，再轉到該學姐的官網下單頁。3 秒後開啟官網下單頁（示範）…';
    var TEST_URL = 'https://www.graceschool.com.tw/product/show/805?kind=65';
    a.href = TEST_URL; a.hidden = false; a.textContent = '開啟官網下單頁'; sp.style.display = 'none';
    setTimeout(function () { location.replace(TEST_URL); }, 3000);
    return;
  }
  /* 3.4.0 學院管理後台（topgod）圖卡按鈕：參數 l（不影響原有 t）。
     v65 立即轉址：連結帶目的地 u（或為已送出卡片的對照表）→ 以 sendBeacon 記錄點擊（不等回應）並立即 location.replace；
     沒有 u 也不在對照表（確認諮詢時段 -k 等）才沿用舊流程等資料中心回覆。只允許學院官網；-c 另允許順豐與中華郵政查詢頁、學姐留言頁 */
  var ql = /[?&]l=([^&#]+)/.exec(location.search), l = ql ? decodeURIComponent(ql[1]) : '';
  if (!t && l) {
    var CARRIER = /^https:\/\/(www\.sf-express\.com|postserv\.post\.gov\.tw)(\/[^\s"'<>]*)?$/, MSGP = /^https:\/\/grace63188\.github\.io\/consult-prep\/msg\.html\?t=[A-Za-z0-9]{16,40}$/, isC = /-c\.[0-9a-f]{12}$/.test(l), isK = /-k\.[0-9a-f]{12}$/.test(l);
    var okUrl = function (u) { return SITE.test(u || '') || (isC && CARRIER.test(u || '')) || (isC && MSGP.test(u || '')); };
    if (!/^lm[0-9A-Za-z]{6,24}(-[rck])?\.[0-9a-f]{12}$/.test(l)) { fail('連結不完整，請回到 LINE 重新點一次'); return; }
    /* 已送出（v65 前）卡片的目的地：只有學院官網網址 */
    var SENT = { 'lmm0a4331fb7f3.db188f4af0dc': '/about/spec/grade', 'lmm8380e46d678.adcc3e8aacab': '/product/show/27', 'lmm49e0477b838.30b31860da94': '/product/show/28', 'lmk86e94640a7f.1d3662dcc80e': '/product/show/812', 'lmk86e94640a7f-c.bb72d750bc6e': '/member/challenge' };
    var qu = /[?&]u=([^&#]+)/.exec(location.search), u = '';
    try { u = qu ? decodeURIComponent(qu[1]) : (SENT[l] ? 'https://www.graceschool.com.tw' + SENT[l] : ''); } catch (e) { u = ''; }
    if (!isK && u && (SITE.test(u) || (isC && CARRIER.test(u)))) {
      var body = JSON.stringify({ action: 'lms_click', l: l });
      if (C.GAS_URL) { try { if (!(navigator.sendBeacon && navigator.sendBeacon(C.GAS_URL, new Blob([body], { type: 'text/plain;charset=utf-8' })))) fetch(C.GAS_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }); } catch (e) { /* 記錄失敗不擋轉址 */ } }
      go(u);
      return;
    }
    document.getElementById('ttl').textContent = isK ? '正在確認諮詢時段' : isC ? '正在開啟' : '正在前往學院官網';
    a.textContent = isC ? '繼續' : '前往學院官網';
    if (!C.GAS_URL) { fail('預覽模式：正式網站會記錄點擊後前往學院官網'); return; }
    var xl = new XMLHttpRequest();
    xl.open('POST', C.GAS_URL, true);
    xl.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    xl.timeout = 20000;
    xl.onload = function () {
      var j = null; try { j = JSON.parse(xl.responseText); } catch (e) { j = null; }
      if (j && j.ok && j.data && okUrl(j.data.url)) { if (j.data.msg) { document.getElementById('ttl').textContent = String(j.data.msg).slice(0, 40); msg.textContent = '即將前往學院官網…'; setTimeout(function () { go(j.data.url); }, 1500); } else go(j.data.url); }
      else fail(j && j.error ? j.error + '，請聯繫官方 LINE' : '連結已失效，請聯繫官方 LINE');
    };
    xl.onerror = xl.ontimeout = function () { fail('網路連線失敗，請稍後再點一次'); };
    xl.send(JSON.stringify({ action: 'lms_click', l: l }));
    a.addEventListener('click', function (ev) { if (!okUrl(a.href)) { ev.preventDefault(); } });
    return;
  }
  if (!/^mf[0-9A-Za-z-]{4,40}\.[0-9a-f]{12}$/.test(t)) { fail('連結不完整，請回到 LINE 重新點「前往下單」'); return; }
  if (!C.GAS_URL) { fail('預覽模式：正式網站會記錄點擊後前往官網下單頁'); return; }
  var slow = setTimeout(function () { msg.textContent = '連線中，請稍候…'; }, 3000);
  var x = new XMLHttpRequest();
  x.open('POST', C.GAS_URL, true);
  x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
  x.timeout = 20000;
  x.onload = function () {
    clearTimeout(slow);
    var j = null; try { j = JSON.parse(x.responseText); } catch (e) { j = null; }
    if (j && j.ok && j.data && SITE.test(j.data.url || '')) go(j.data.url);
    else fail(j && j.error ? j.error + '，請聯繫官方 LINE' : '連結已失效，請聯繫官方 LINE');
  };
  x.onerror = x.ontimeout = function () { clearTimeout(slow); fail('網路連線失敗，請稍後再點一次「前往下單」'); };
  x.send(JSON.stringify({ action: 'order_click', t: t }));
  /* 只允許學院官網網域作為手動按鈕備援 */
  a.addEventListener('click', function (ev) { if (!SITE.test(a.href)) { ev.preventDefault(); } });
})();
</script>
</body>
</html>
