<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>已移到學院學習管理</title>
<!-- 學院管理 v87.46（校長 2026.11.23）：舊後台「諮詢教材·專屬訂製」停用。每個舊路徑（含 #/…）轉到學院學習管理的對應頁面；
     #/prep/{make|test|price|order|deliver}[/學姐鍵]、#/prep/學姐鍵 → 諮詢服務 › 教材進度（f＝階段、k＝學姐鍵）；#/material/wait → 等待下單、#/material/ready → 待交付；
     #/r/回執 → 交付紀錄；#/track → 諮詢場次（前置作業未交）；#/prep → 教材進度；其他 → 今日工作台。與 src/flex.js topgodHash 同一套對應 -->
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:#110E0F;color:#F3E9E2;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
  main{max-width:420px;text-align:center}
  a{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:10px;background:#D9B877;color:#1E1A1B;font-weight:700;text-decoration:none}
  small{display:block;margin-top:10px;color:#A99A92}
</style>
<script>
(function () {
  var BASE = 'https://grace63188.github.io/topgod/';
  var ST = { make: 'make', test: 'test', price: 'price', order: 'order', deliver: 'deliver', wait: 'waiting', ready: 'deliver' };
  function key(x) { return /^[0-9a-f]{16}$/.test(String(x || '')) ? String(x) : ''; }
  function prog(f, k, rid) { var q = []; if (f) q.push('f=' + f); if (k) q.push('k=' + k); if (rid) q.push('rid=' + encodeURIComponent(rid)); return '#/custom/progress' + (q.length ? '?' + q.join('&') : ''); }
  function map(hash) {
    var h = String(hash || '').replace(/^#?\/?/, '').split('?')[0], p = h.split('/').map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    if (p[0] === 'prep') { if (!p[1]) return prog(); if (key(p[1])) return prog('', p[1]); if (ST[p[1]] && p[1] !== 'wait' && p[1] !== 'ready') return prog(ST[p[1]], key(p[2])); return prog(); }
    if (p[0] === 'material') return prog(ST[p[1]] || 'waiting', key(p[2]));
    if (p[0] === 'r' && p[1]) return prog('records', '', String(p[1]).slice(0, 60));
    if (p[0] === 'track') return '#/consult/schedule?flow=prep';
    return '#/workbench/today';
  }
  window.GRACE_ADMIN_RETIRED = { map: map, BASE: BASE };
  var to = BASE + map(location.hash);
  if (!/[?&]noredirect=1/.test(location.search)) location.replace(to);
  document.addEventListener('DOMContentLoaded', function () { var a = document.getElementById('go'); if (a) a.href = to; });
})();
</script>
</head>
<body>
<main>
  <b>「諮詢教材·專屬訂製」後台已停用</b>
  <div>工具製作、測試、確認金額、下單與交付，都移到「學院學習管理 › 諮詢服務 › 教材進度」。</div>
  <a id="go" href="https://grace63188.github.io/topgod/#/custom/progress">前往學院學習管理</a>
  <small>正在轉到對應頁面…</small>
</main>
</body>
</html>
