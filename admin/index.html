  /* 匯出工作表（xlsx）                                                   */
  /* ------------------------------------------------------------------ */
  var EXPORT_TABS = [
    { id: 'index', name: '索引', headers: ['回執編號', '送出時間', '本名', '學員帳號', '身分', '行業', '品牌名稱', '檔案數', '缺口數', '狀態', '資料夾連結', '開始時間', '填寫耗時（分）'] },
    { id: 'profile', name: '基本輪廓', headers: ['回執編號', '本名', '身分', '下線夥伴', '行業類別', '品牌名稱', '任職公司', '職稱', '主要業務', '服務形式', '營運規模', '團隊人數'] },
    { id: 'uploads', name: '資料上傳', headers: ['回執編號', '本名', '類別', '狀態', '檔案數', '連結數', '補充說明'] },
    { id: 'links', name: '雲端連結', headers: ['回執編號', '本名', '類別', '網址', '說明'] },
    { id: 'flows', name: '流程', headers: ['回執編號', '本名', '流程', '服務對象', '序號', '步驟名稱', '模板或自訂', '狀態', '處理方式', '做法', '工具', '其他工具', '截圖數'] },
    { id: 'dialog', name: '對話紀錄', headers: ['回執編號', '本名', '完成預約截圖數', '詢問後未回覆截圖數', '常見提問 1', '常見提問 2', '常見提問 3', '常見提問 4', '常見提問 5', '個資提示'] },
    { id: 'timeSavers', name: '最想省下的時間', headers: ['回執編號', '本名', '序號', '最耗時的工作'] }
  ];

  /* ------------------------------------------------------------------ */
  /* 工具函式                                                            */
  /* ------------------------------------------------------------------ */
  function getPath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function isEmpty(v) {
    if (v == null) return true;
    if (Array.isArray(v)) return !v.some(function (x) { return !isEmpty(x); });
    if (typeof v === 'object') return false;
    return String(v).trim() === '';
  }

  /** 判斷 showIf／condition 是否成立；ctx 為整份答案（或類別資料） */
  function evalCondition(cond, ctx, roleId) {
    if (!cond) return true;
    if (cond.onlyForRole && roleId !== cond.onlyForRole) return true;
    var v = getPath(ctx, cond.field);
    if (Object.prototype.hasOwnProperty.call(cond, 'equals')) return v === cond.equals;
    if (cond.in) return cond.in.indexOf(v) >= 0;
    if (cond.notIn) return cond.notIn.indexOf(v) < 0;
    if (cond.includes) return Array.isArray(v) && v.indexOf(cond.includes) >= 0;
    return true;
  }

  function roleById(id) {
    for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
    return null;
  }

  /** 身分是否帶人（經銷合作依「下線夥伴」判斷） */
  function roleLeads(roleId, answers) {
    var r = roleById(roleId);
    if (!r) return false;
    if (r.leads === 'conditional') return getPath(answers || {}, 'role.hasDownline') === 'yes';
    return !!r.leads;
  }

  function sectionById(id) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
    return null;
  }

  function categoryById(id) {
    for (var i = 0; i < UPLOAD_CATEGORIES.length; i++) if (UPLOAD_CATEGORIES[i].id === id) return UPLOAD_CATEGORIES[i];
    return null;
  }

  function visibleFor(item, roleId, answers) {
    if (item.roles && item.roles.indexOf(roleId) < 0) return false;
    if (item.condition && !evalCondition(item.condition, answers || {}, roleId)) return false;
    return true;
  }

  /** 依身分（與答案中的條件）回傳可見區塊 */
  function sectionsForRole(roleId, answers) {
    return SECTIONS.filter(function (s) { return visibleFor(s, roleId, answers); });
  }

  /** 依身分回傳資料上傳可見類別 */
  function categoriesForRole(roleId, answers) {
    return UPLOAD_CATEGORIES.filter(function (c) { return visibleFor(c, roleId, answers); });
  }

  /** 區塊內依身分與 showIf 可見的欄位（section 可傳物件或 id） */
  function fieldsForRole(section, roleId, answers) {
    var sec = typeof section === 'string' ? sectionById(section) : section;
    if (!sec || !sec.fields) return [];
    return sec.fields.filter(function (f) {
      if (f.roles && f.roles.indexOf(roleId) < 0) return false;
      if (f.showIf && !evalCondition(f.showIf, answers || {}, roleId)) return false;
      return true;
    });
  }

  /** 區塊說明文字：身分提示 → 區塊 hint（較完整的說明，例：資料上傳）→ desc */
  function sectionHint(section, roleId) {
    return (section.roleHints && section.roleHints[roleId]) || section.hint || section.desc || '';
  }

  /** 身分專屬提示（例：經銷合作的協作流程），無則空字串 */
  function sectionNotice(section, roleId) {
    return (section.roleNotices && section.roleNotices[roleId]) || '';
  }

  function categoryHint(cat, roleId) {
    return (cat.roleHints && cat.roleHints[roleId]) || '';
  }

  /* ---- 流程步驟 ------------------------------------------------------ */
  function isFlowId(id) { return FLOW_IDS.indexOf(id) >= 0; }

  function templateStage(flowId, stageId) {
    var sec = sectionById(flowId);
    if (!sec || !sec.stages) return null;
    for (var i = 0; i < sec.stages.length; i++) if (sec.stages[i].id === stageId) return sec.stages[i];
    return null;
  }

  function blankStage(t) {
    return { id: t.id, template: true, templateName: t.label, name: t.label, status: '', handling: '', steps: [], tools: [], toolsOther: '' };
  }

  /** 預設骨架：模板步驟（固定 id、template:true、name 與 templateName 為原名稱），依預設順序 */
  function defaultStages(flowId) {
    var sec = sectionById(flowId);
    if (!sec || !sec.stages) return [];
    return sec.stages.map(blankStage);
  }

  function cleanStr(v) { return String(v == null ? '' : v).trim(); }

  /** 舊格式單一步驟 { na, steps, tools, toolsOther } → 狀態：na→'na'、有內容→'doing'、無→'' */
  function legacyStatus(v) {
    if (!v || typeof v !== 'object') return '';
    if (v.na) return 'na';
    if (listOf(v.steps).length || toolsText(v)) return 'doing';
    return '';
  }

  /**
   * 流程答案正規化：舊格式 stages{id:{na,steps,tools}} 轉為有序陣列；補齊缺少的模板步驟（插在預設順序的鄰近位置）；
   * 去除重複 id；模板步驟名稱空白時還原 templateName；status 非 doing 時清除 handling；
   * template 旗標一律依 id 是否為模板步驟判定（不信任前台）。值域與格式錯誤保留給 checkFlows 判斷。
   * 回傳 { ...flow, stages:[...] }（新物件）
   */
  function normalizeFlow(flowId, flow) {
    var sec = sectionById(flowId);
    var src = flow && typeof flow === 'object' ? flow : {};
    var out = {};
    Object.keys(src).forEach(function (k) { if (k !== 'stages') out[k] = src[k]; });
    if (sec && sec.headFields) sec.headFields.forEach(function (f) { if (out[f.id] == null) out[f.id] = ''; });
    var raw = src.stages;
    var list = [];
    if (Array.isArray(raw)) {
      list = raw.filter(function (x) { return x && typeof x === 'object'; }).map(function (x) {
        var id = cleanStr(x.id);
        var t = templateStage(flowId, id);
        var tl = stageTools(x);
        var st = {
          id: id, template: !!t,
          templateName: t ? t.label : '',
          name: cleanStr(x.name),
          status: x.status == null ? '' : x.status,
          handling: x.handling == null ? '' : x.handling,
          steps: listOf(x.steps), tools: tl.tools, toolsOther: tl.toolsOther
        };
        if (t && !st.name) st.name = t.label;
        if (st.status !== 'doing') st.handling = '';
        return st;
      });
    } else if (raw && typeof raw === 'object') {
      // 舊格式：鍵為模板步驟 id
      list = (sec ? sec.stages : []).map(function (t) {
        var v = raw[t.id];
        var st = blankStage(t);
        if (v && typeof v === 'object') {
          var tl = stageTools(v);
          st.status = legacyStatus(v);
          if (st.status === 'doing') { st.steps = listOf(v.steps); st.tools = tl.tools; st.toolsOther = tl.toolsOther; }
        }
        return st;
      });
    }
    // 去除重複 id（保留第一個）
    var seen = {};
    list = list.filter(function (st) {
      if (seen['k' + st.id]) return false;
      seen['k' + st.id] = 1;
      return true;
    });
    // 補齊模板步驟：插在預設順序中前一個已存在模板步驟之後
    if (sec && sec.stages) {
      sec.stages.forEach(function (t, ti) {
        if (seen['k' + t.id]) return;
        var pos = 0;
        for (var j = ti - 1; j >= 0; j--) {
          var prevId = sec.stages[j].id;
          var at = -1;
          for (var k = 0; k < list.length; k++) if (list[k].id === prevId) { at = k; break; }
          if (at >= 0) { pos = at + 1; break; }
        }
        list.splice(pos, 0, blankStage(t));
        seen['k' + t.id] = 1;
      });
    }
    out.stages = list;
    return out;
  }

  /** 取得流程步驟陣列（相容舊格式） */
  function flowStages(flowId, answers) {
    return normalizeFlow(flowId, (answers || {})[flowId]).stages;
  }

  function stageDisplayName(st) {
    return cleanStr(st && st.name) || cleanStr(st && st.templateName) || '未命名步驟';
  }

  /** 流程計數：{ total, template, custom, status:{doing,none,na,unanswered}, handling:{manual,partial,auto,unset} } */
  function flowSummary(flowId, flow) {
    var stages = normalizeFlow(flowId, flow).stages;
    var sum = { total: stages.length, template: 0, custom: 0, status: { doing: 0, none: 0, na: 0, unanswered: 0 }, handling: { manual: 0, partial: 0, auto: 0, unset: 0 } };
    stages.forEach(function (st) {
      if (st.template) sum.template++; else sum.custom++;
      if (st.status === 'doing' || st.status === 'none' || st.status === 'na') sum.status[st.status]++;
      else sum.status.unanswered++;
      if (st.status === 'doing') {
        if (st.handling === 'manual' || st.handling === 'partial' || st.handling === 'auto') sum.handling[st.handling]++;
        else sum.handling.unset++;
      }
    });
    return sum;
  }

  /**
   * 流程圖節點資料（前後台畫圖用）：
   * { flowId, label, nodes:[{ order, id, name, templateName, renamed, template, custom, icon, status, statusLabel, handling, handlingLabel }], summary }
   */
  function flowDiagram(flowId, flow) {
    var sec = sectionById(flowId);
    var stages = normalizeFlow(flowId, flow).stages;
    return {
      flowId: flowId, label: sec ? sec.label : flowId,
      nodes: stages.map(function (st, i) {
        var t = st.template ? templateStage(flowId, st.id) : null;
        return {
          order: i + 1, id: st.id, name: stageDisplayName(st), templateName: st.templateName || '',
          renamed: !!st.template && stageDisplayName(st) !== st.templateName,
          template: !!st.template, custom: !st.template, icon: t ? t.icon : 'plus',
          status: st.status || '', statusLabel: stageStatusLabel(st.status),
          handling: st.status === 'doing' ? (st.handling || '') : '',
          handlingLabel: st.status === 'doing' ? stageHandlingLabel(st.handling) : ''
        };
      }),
      summary: flowSummary(flowId, flow)
    };
  }

  function stageStatusLabel(v) {
    if (!v) return UNANSWERED_LABEL;
    for (var i = 0; i < OPTIONS.stageStatus.length; i++) if (OPTIONS.stageStatus[i].id === v) return OPTIONS.stageStatus[i].label;
    return String(v);
  }
  function stageHandlingLabel(v) {
    for (var i = 0; i < OPTIONS.stageHandling.length; i++) if (OPTIONS.stageHandling[i].id === v) return OPTIONS.stageHandling[i].label;
    return '';
  }

  /** 前台產生自訂步驟 id（c_ + 6 碼），避開既有 id */
  function newCustomStageId(existing) {
    var used = {};
    (existing || []).forEach(function (x) { used[typeof x === 'string' ? x : (x && x.id)] = 1; });
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    for (var n = 0; n < 1000; n++) {
      var id = FLOW_RULES.customIdPrefix;
      for (var i = 0; i < 6; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
      if (!used[id]) return id;
    }
    return FLOW_RULES.customIdPrefix + Date.now().toString(36);
  }

  /** 空白自訂步驟（前台新增用） */
  function customStage(name, existing) {
    return { id: newCustomStageId(existing), template: false, templateName: '', name: cleanStr(name), status: '', handling: '', steps: [], tools: [], toolsOther: '' };
  }

  /**
   * 流程驗證（只檢查依身分可見的流程；answers 應先經 normalizeAnswers）：
   * 步驟數上限、id 格式與不重複、名稱長度、status 與 handling 值域。doing 未選 handling 不擋送出。
   * 回傳 null 或 { code:'FLOW_STAGE', errorCode, message, path }
   */
  function checkFlows(answers) {
    var roleId = getPath(answers, 'role.id');
    var secs = sectionsForRole(roleId, answers).filter(function (s) { return s.kind === 'flow'; });
    var okStatus = ['', 'doing', 'none', 'na'], okHandling = ['', 'manual', 'partial', 'auto'];
    for (var i = 0; i < secs.length; i++) {
      var sec = secs[i];
      var flow = answers[sec.id];
      if (flow == null) continue;
      var stages = flow.stages;
      if (!Array.isArray(stages)) return issue('FLOW_STAGE', sec.label + '：步驟格式不正確', { path: sec.id + '.stages' });
      if (stages.length > FLOW_RULES.maxStages) return issue('FLOW_STAGE', sec.label + '：步驟超過上限 ' + FLOW_RULES.maxStages + ' 步', { path: sec.id + '.stages' });
      var seen = {};
      for (var j = 0; j < stages.length; j++) {
        var st = stages[j];
        var path = sec.id + '.stages.' + j;
        if (!st || typeof st !== 'object') return issue('FLOW_STAGE', sec.label + '：第 ' + (j + 1) + ' 步格式不正確', { path: path });
        if (typeof st.id !== 'string' || !STAGE_ID_RE.test(st.id)) return issue('FLOW_STAGE', sec.label + '：第 ' + (j + 1) + ' 步識別碼格式不正確', { path: path });
        if (seen['k' + st.id]) return issue('FLOW_STAGE', sec.label + '：步驟識別碼重複', { path: path });
        seen['k' + st.id] = 1;
        if (String(st.name == null ? '' : st.name).length > LIMITS.maxStageNameLength) return issue('FLOW_STAGE', sec.label + '：步驟名稱超過 ' + LIMITS.maxStageNameLength + ' 字', { path: path + '.name' });
        if (okStatus.indexOf(st.status == null ? '' : st.status) < 0) return issue('FLOW_STAGE', sec.label + '：' + stageDisplayName(st) + ' 狀態值不正確', { path: path + '.status' });
        if (okHandling.indexOf(st.handling == null ? '' : st.handling) < 0) return issue('FLOW_STAGE', sec.label + '：' + stageDisplayName(st) + ' 處理方式值不正確', { path: path + '.handling' });
      }
    }
    return null;
  }

  /** 空白答案骨架 */
  function emptyAnswers() {
    var a = {
      student: { account: '', name: '' },
      role: { id: '', hasDownline: '' },
      profile: { industry: '', industryOther: '', brand: '', company: '', title: '', business: '', serviceMode: [], scale: '', headcount: '' },
      uploads: {},
      dialog: { faq: ['', '', '', '', ''], privacyAck: false },
      timeSavers: { tasks: [] }
    };
    UPLOAD_CATEGORIES.forEach(function (c) { a.uploads[c.id] = { status: '', links: [], note: '' }; });
    FLOW_IDS.forEach(function (id) {
      var sec = sectionById(id);
      a[id] = {};
      sec.headFields.forEach(function (f) { a[id][f.id] = ''; });
      a[id].stages = defaultStages(id);
    });
    return a;
  }

  /** 舊附件位置轉新位置（dialog.wonShots → dialog.bookedShots、dialog.lostShots → dialog.silentShots） */
  function canonicalFileKey(key) {
    return LEGACY_FILE_KEYS[key] || key;
  }

  /** 附件清單的位置統一為新鍵（回傳新陣列，不改動原物件） */
  function normalizeFiles(files) {
    if (!Array.isArray(files)) return files;
    return files.map(function (f) {
      if (!f || typeof f !== 'object') return f;
      var c = {};
      for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) c[k] = f[k];
      c.key = canonicalFileKey(f.key);
      return c;
    });
  }

  /**
   * 檔案上傳位置：回傳 [{key, label, section, category?, stage?, custom?}]；key 為上傳與命名用的路徑。
   * answers 有傳時，流程位置依該份答案的步驟（含自訂步驟）；未傳時為模板步驟。
   */
  function fileFields(answers) {
    var out = [];
    UPLOAD_CATEGORIES.forEach(function (c) {
      out.push({ key: 'uploads.' + c.id, label: c.label, section: 'uploads', category: c.id });
    });
    FLOW_IDS.forEach(function (fid) {
      var sec = sectionById(fid);
      var stages = answers ? flowStages(fid, answers) : defaultStages(fid);
      stages.forEach(function (st) {
        if (typeof st.id !== 'string' || !STAGE_ID_RE.test(st.id)) return;
        out.push({ key: fid + '.' + st.id, label: sec.label + '-' + stageDisplayName(st), section: fid, stage: st.id, custom: !st.template });
      });
    });
    SECTIONS.forEach(function (s) {
      if (s.kind !== 'fields') return;
      s.fields.forEach(function (f) {
        if (f.type === 'files') out.push({ key: s.id + '.' + f.id, label: s.label + '-' + f.label, section: s.id });
      });
    });
    return out;
  }

  /** 依身分可用的檔案上傳位置（流程位置依該份答案的步驟） */
  function fileFieldsForRole(roleId, answers) {
    var secIds = sectionsForRole(roleId, answers).map(function (s) { return s.id; });
    var catIds = categoriesForRole(roleId, answers).map(function (c) { return c.id; });
    return fileFields(answers || {}).filter(function (f) {
      if (secIds.indexOf(f.section) < 0) return false;
      if (f.category && catIds.indexOf(f.category) < 0) return false;
      return true;
    });
  }

  /** 位置的中文名（檔名用）；answers 有傳時自訂步驟以其名稱顯示；舊鍵相容 */
  function fileLabelForKey(key, answers) {
    key = canonicalFileKey(key);
    var list = fileFields(answers);
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i].label;
    var parts = String(key || '').split('.');
    if (parts.length === 2 && isFlowId(parts[0])) return sectionById(parts[0]).label + '-自訂步驟';
    return key;
  }

  /** 必填檢查：回傳 [{path, label}] */
  function validate(answers) {
    var errors = [];
    var roleId = getPath(answers, 'role.id');
    sectionsForRole(roleId || 'owner', answers).forEach(function (s) {
      if (s.kind !== 'fields' && s.kind !== 'role') return;
      fieldsForRole(s, roleId, answers).forEach(function (f) {
        if (!f.required) return;
        var v = getPath(answers, s.id + '.' + f.id);
        if (isEmpty(v)) errors.push({ path: s.id + '.' + f.id, label: f.label });
      });
    });
    return errors;
  }

  /* ---- 檔案 ---------------------------------------------------------- */
  /** 檔名副檔名（小寫，無則空字串） */
  function extOf(name) {
    var m = /\.([A-Za-z0-9]+)$/.exec(name || '');
    return m ? m[1].toLowerCase() : '';
  }

  function cleanMime(mime) { return String(mime || '').toLowerCase().split(';')[0].trim(); }

  /** 影片判定：副檔名為影片或 MIME 為 video/* */
  function isVideo(name, mime) {
    return VIDEO_EXT.indexOf(extOf(name)) >= 0 || cleanMime(mime).indexOf('video/') === 0;
  }

  /**
   * 判定附件的有效副檔名：副檔名或 MIME 任一在白名單即可；
   * 檔名無合法副檔名時依 MIME 補上（例 image/jpeg → jpg），供檔名規則使用。影片或不支援時回傳 ''。
   */
  function extForFile(name, mime) {
    if (isVideo(name, mime)) return '';
    var ext = extOf(name);
    if (LIMITS.acceptExt.indexOf(ext) >= 0) return ext;
    return LIMITS.mimeToExt[cleanMime(mime)] || '';
  }

  function issue(code, message, extra) {
    var out = { code: code, errorCode: ISSUE_CODES[code].errorCode, message: message };
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) out[k] = extra[k];
    return out;
  }

  function mbText(n) { return Math.round(n / 1048576) + 'MB'; }

  /**
   * 單檔檢查（選檔當下）：回傳 null 或 { code, errorCode, message }。
   * code 為 FILE_VIDEO 時前台應引導改貼雲端連結。
   */
  function fileIssue(name, mime, size) {
    if (isVideo(name, mime)) return issue('FILE_VIDEO', '影片檔請上傳至 Google 雲端硬碟後改貼雲端連結：' + name);
    var n = Number(size);
    if (size != null && isFinite(n) && n > LIMITS.maxFileBytes) return issue('FILE_SIZE', '檔案超過 ' + mbText(LIMITS.maxFileBytes) + '：' + name);
    if (!extForFile(name, mime)) return issue('FILE_TYPE', '不支援的檔案類型：' + name);
    return null;
  }

  /**
   * 附件清單檢查（前台、mock、資料中心共用）：
   *   files：[{ key, name, size, mime }]；answers 有傳時，key 須為該身分可用的上傳位置。
   * 回傳 null 或 { code, errorCode, message }。
   */
  function fileListIssue(files, answers) {
    if (!Array.isArray(files)) return issue('FILE_INFO', '檔案清單格式錯誤');
    if (files.length > LIMITS.maxFiles) return issue('FILE_COUNT_LIMIT', '附件數量超過上限 ' + LIMITS.maxFiles + ' 個');
    files = normalizeFiles(files);
    var validKeys = (answers ? fileFieldsForRole(getPath(answers, 'role.id'), answers) : fileFields()).map(function (f) { return f.key; });
    var perKey = {}, total = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f || typeof f.name !== 'string' || !f.name) return issue('FILE_INFO', '第 ' + (i + 1) + ' 個檔案資訊不完整');
      if (validKeys.indexOf(f.key) < 0) return issue('FILE_KEY', '檔案對應位置不正確：' + f.name);
      var size = Number(f.size);
      if (!isFinite(size) || size < 0) return issue('FILE_INFO', '檔案大小資訊不正確：' + f.name);
      var fi = fileIssue(f.name, f.mime, size);
      if (fi) return fi;
      perKey[f.key] = (perKey[f.key] || 0) + 1;
      if (perKey[f.key] > LIMITS.maxFilesPerField) return issue('FILE_FIELD_LIMIT', '單一類別或步驟附件超過上限 ' + LIMITS.maxFilesPerField + ' 個：' + fileLabelForKey(f.key, answers));
      total += size;
    }
    if (total > LIMITS.maxTotalBytes) return issue('FILE_TOTAL_LIMIT', '附件總量超過上限 ' + mbText(LIMITS.maxTotalBytes));
    return null;
  }

  /** 舊介面：回傳 '' 或錯誤訊息 */
  function checkFileList(files, answers) {
    var r = fileListIssue(files, answers);
    return r ? r.message : '';
  }

  /* ---- 雲端連結 ------------------------------------------------------ */
  /** 正規化網址：去空白；無通訊協定補 https://；http:// 改 https:// */
  function normalizeLink(url) {
    var s = String(url == null ? '' : url).trim();
    if (!s) return '';
    if (/^http:\/\//i.test(s)) s = 'https://' + s.slice(7);
    else if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
    return s;
  }

  function linkHost(url) {
    var m = /^https:\/\/([^\/?#@\s]+)(?:[\/?#]|$)/i.exec(String(url || ''));
    if (!m) return '';
    return m[1].toLowerCase().replace(/:443$/, '');
  }

  /** 單筆網址檢查（已正規化或原始皆可）：回傳 null 或 { code, errorCode, message } */
  function linkIssue(url) {
    var s = normalizeLink(url);
    if (!s) return issue('LINK_FORMAT', '雲端連結未填網址');
    if (s.length > LIMITS.maxLinkLength) return issue('LINK_LIMIT', '雲端連結過長');
    if (/[\s<>"']/.test(s)) return issue('LINK_FORMAT', '雲端連結格式不正確：' + s.slice(0, 80));
    var host = linkHost(s);
    if (!host) return issue('LINK_FORMAT', '雲端連結格式不正確：' + s.slice(0, 80));
    if (LINK_HOSTS.indexOf(host) < 0) return issue('LINK_HOST', '雲端連結僅接受 Google 雲端硬碟、文件、試算表、表單（' + LINK_HOSTS.join('、') + '）：' + s.slice(0, 80));
    return null;
  }

  /** 全部雲端連結檢查（只檢查狀態為「有」的類別）：回傳 null 或 { code, errorCode, message, path } */
  function checkLinks(answers) {
    var up = (answers && answers.uploads) || {};
    for (var i = 0; i < UPLOAD_CATEGORIES.length; i++) {
      var c = UPLOAD_CATEGORIES[i];
      var v = up[c.id];
      if (!v || v.status !== 'yes' || v.links == null) continue;
      if (!Array.isArray(v.links)) return issue('LINK_FORMAT', '雲端連結格式不正確：' + c.label, { path: 'uploads.' + c.id + '.links' });
      if (v.links.length > LIMITS.maxLinksPerField) return issue('LINK_LIMIT', '雲端連結超過上限 ' + LIMITS.maxLinksPerField + ' 筆：' + c.label, { path: 'uploads.' + c.id + '.links' });
      for (var j = 0; j < v.links.length; j++) {
        var l = v.links[j];
        var path = 'uploads.' + c.id + '.links.' + j;
        if (!l || typeof l !== 'object') return issue('LINK_FORMAT', '雲端連結格式不正確：' + c.label, { path: path });
        if (l.note != null && String(l.note).length > LIMITS.maxLinkNoteLength) return issue('LINK_LIMIT', '雲端連結說明過長：' + c.label, { path: path });
        var li = linkIssue(l.url);
        if (li) { li.path = path; li.message = c.label + '：' + li.message; return li; }
      }
    }
    return null;
  }

  /* ---- 使用工具 ------------------------------------------------------ */
  /** 工具文字拆成項目（頓號、逗號、分號、換行分隔） */
  function toolTokens(s) {
    if (Array.isArray(s)) return s.map(function (x) { return String(x == null ? '' : x).trim(); }).filter(function (x) { return x; });
    return String(s == null ? '' : s).split(/[、,，;；\r\n]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
  }

  /**
   * 步驟使用工具：快選標籤（tools 陣列，只含 TOOL_OPTIONS 內的值）與自填文字（toolsOther）分開保存。
   * 舊資料 tools 為字串時相容拆解：在快選清單內的歸入 tools，其餘併入 toolsOther。
   * 回傳 { tools: [], toolsOther: '' }
   */
  function stageTools(v) {
    v = v || {};
    var picked = [], other = [];
    var seen = {};
    toolTokens(v.tools).forEach(function (t) {
      if (seen[t]) return;
      seen[t] = 1;
      if (TOOL_OPTIONS.indexOf(t) >= 0) picked.push(t); else other.push(t);
    });
    toolTokens(v.toolsOther).forEach(function (t) { if (!seen[t]) { seen[t] = 1; other.push(t); } });
    picked = TOOL_OPTIONS.filter(function (t) { return picked.indexOf(t) >= 0; });
    return { tools: picked, toolsOther: other.join('、') };
  }

  /** 步驟使用工具的顯示文字（快選＋自填，以頓號相連） */
  function toolsText(v) {
    var t = stageTools(v);
    return t.tools.concat(toolTokens(t.toolsOther)).join('、');
  }

  /**
   * 答案正規化（資料中心與 mock 於驗證前呼叫）：
   * 雲端連結去除空白列、網址正規化；說明去頭尾空白；狀態非「有」的類別清空連結與補充說明；
   * 流程統一為有序步驟陣列（normalizeFlow：舊格式 stages{id:{na,steps,tools}} 轉換、使用工具 { tools:[], toolsOther:'' }）。
   * 回傳新物件，不改動原物件。
   */
  function normalizeAnswers(answers) {
    var a = JSON.parse(JSON.stringify(answers || {}));
    var up = a.uploads;
    if (up && typeof up === 'object') {
      Object.keys(up).forEach(function (k) {
        if (!categoryById(k)) { delete up[k]; return; }   // 已移除的類別（例 finance）與未知鍵：讀取忽略
        var v = up[k];
        if (!v || typeof v !== 'object') return;
        if (v.status !== 'yes') { v.links = []; v.note = ''; return; }
        if (!Array.isArray(v.links)) return;
        v.links = v.links.filter(function (l) { return l && typeof l === 'object' && (String(l.url || '').trim() || String(l.note || '').trim()); })
          .map(function (l) { return { url: normalizeLink(l.url), note: String(l.note == null ? '' : l.note).trim() }; });
      });
    }
    FLOW_IDS.forEach(function (fid) {
      var flow = a[fid];
      if (!flow || typeof flow !== 'object') return;
      a[fid] = normalizeFlow(fid, flow);
    });
    return a;
  }

  /**
   * 送出前整體檢查（必填、雲端連結、附件）：回傳 null 或 { code, errorCode, message }。
   * answers 應先經 normalizeAnswers。
   */
  function checkSubmission(answers, files) {
    if (!answers || typeof answers !== 'object' || Array.isArray(answers)) return issue('REQUIRED', '作業內容格式錯誤');
    if (!roleById(getPath(answers, 'role.id'))) return issue('REQUIRED', '身分值不正確');
    var errs = validate(answers);
    if (errs.length) return issue('REQUIRED', '必填未完成：' + errs.map(function (x) { return x.label; }).join('、'), { fields: errs });
    var li = checkLinks(answers);
    if (li) return li;
    var fl = checkFlows(answers);
    if (fl) return fl;
    return fileListIssue(files || [], answers);
  }

  /* ---- 顯示 ---------------------------------------------------------- */
  function optionLabel(options, value) {
    if (!options) return value == null ? '' : String(value);
    for (var i = 0; i < options.length; i++) {
      var o = options[i];
      if (typeof o === 'string') { if (o === value) return o; }
      else if (o.id === value || String(o.id) === String(value)) return o.label;
    }
    return value == null ? '' : String(value);
  }

  function labelsOf(options, values) {
    if (!Array.isArray(values)) return optionLabel(options, values);
    return values.map(function (v) { return optionLabel(options, v); }).join('、');
  }

  function statusLabel(id) { return optionLabel(STATUSES, id); }

  /** 條列值轉陣列（字串依換行拆開；去除空白項） */
  function listOf(v) {
    var arr = Array.isArray(v) ? v : (v == null || v === '' ? [] : String(v).split(/\r?\n/));
    return arr.map(function (x) { return String(x == null ? '' : x).trim(); }).filter(function (x) { return x; });
  }

  function displayOf(f, v) {
    if (f.type === 'boolean') return v ? '已確認' : '';
    if (f.type === 'list') return listOf(v).map(function (x, i) { return (i + 1) + '. ' + x; }).join('\n');
    if (f.options) return labelsOf(f.options, v);
    if (Array.isArray(v)) return v.join('、');
    if (v == null) return '';
    return String(v) + (f.unit && String(v) !== '' ? ' ' + f.unit : '');
  }

  function industryText(answers) {
    var ind = getPath(answers, 'profile.industry') || '';
    var other = getPath(answers, 'profile.industryOther');
    return ind === '其他' && other ? '其他：' + String(other).trim() : String(ind);
  }

  /** 名單用「品牌名稱」：受僱身分以任職公司代替 */
  function brandText(answers) {
    var roleId = getPath(answers, 'role.id');
    var p = (answers && answers.profile) || {};
    if (EMPLOYED_ROLES.indexOf(roleId) >= 0) return String(p.company || p.brand || '');
    return String(p.brand || '');
  }

  /**
   * 缺口摘要：
   *   attachments：[{ key }]（用於計算各類、各步驟檔案數；舊鍵相容）
   * 回傳 { uploadsMissing, crmKey, links, shareEmail, noneStages, manualStages, naStages, unansweredStages, incompleteStages, emptyStages(=unansweredStages，舊名相容), flows }
   * 步驟項目：{ flowId, flow, stageId, stage, order, template }
   */
  function computeGaps(answers, attachments) {
    answers = answers || {};
    var roleId = getPath(answers, 'role.id');
    var counts = {};
    (attachments || []).forEach(function (x) { var k = canonicalFileKey(x.key); counts[k] = (counts[k] || 0) + 1; });
    var up = answers.uploads || {};
    var gaps = { uploadsMissing: [], crmKey: null, links: [], shareEmail: SHARE_EMAIL, noneStages: [], manualStages: [], naStages: [], unansweredStages: [], incompleteStages: [], flows: {} };

    categoriesForRole(roleId, answers).forEach(function (c) {
      var v = up[c.id] || {};
      if (v.status === 'no') gaps.uploadsMissing.push({ id: c.id, label: c.label });
      if (v.status === 'yes') {
        (v.links || []).forEach(function (l) {
          if (l && l.url) gaps.links.push({ categoryId: c.id, category: c.label, url: l.url, note: l.note || '' });
        });
      }
    });

    var crm = up.crm || {};
    var crmFiles = crm.status === 'yes' ? (counts['uploads.crm'] || 0) : 0;
    var crmLinks = crm.status === 'yes' ? (crm.links || []).filter(function (l) { return l && l.url; }).length : 0;
    gaps.crmKey = {
      items: GAP_RULES.crmKey.items.slice(),
      status: crm.status || '',
      statusLabel: crm.status ? optionLabel(OPTIONS.uploadStatus, crm.status) : '未填寫',
      fileCount: crmFiles,
      linkCount: crmLinks,
      attached: crmFiles + crmLinks > 0
    };

    sectionsForRole(roleId, answers).forEach(function (sec) {
      if (sec.kind !== 'flow') return;
      var flow = answers[sec.id] || {};
      var stages = normalizeFlow(sec.id, flow).stages;
      gaps.flows[sec.id] = flowSummary(sec.id, flow);
      stages.forEach(function (st, i) {
        var item = { flowId: sec.id, flow: sec.label, stageId: st.id, stage: stageDisplayName(st), order: i + 1, template: !!st.template };
        if (st.status === 'none') gaps.noneStages.push(item);
        else if (st.status === 'na') gaps.naStages.push(item);
        else if (st.status === 'doing') {
          if (st.handling === 'manual') gaps.manualStages.push(item);
          else if (!st.handling) gaps.incompleteStages.push(item);
        } else gaps.unansweredStages.push(item);
      });
    });
    gaps.emptyStages = gaps.unansweredStages;   // 舊名相容（2.1 以前）
    return gaps;
  }

  /** 缺口數（名單索引列欄位）：資料狀態為「無」的類別數＋所有流程中尚無做法的步驟數 */
  function gapCount(answers) {
    var g = computeGaps(answers, []);
    return gapCountOf(g);
  }

  /** 由缺口摘要計算缺口數（相容 2.1 以前的摘要：無 noneStages 時只計類別） */
  function gapCountOf(g) {
    if (!g) return 0;
    return (g.uploadsMissing || []).length + (g.noneStages || []).length;
  }

  /**
   * 作業資料 JSON（資料中心與 mock 共用）
   *   attachments：[{ key, label, originalName, fileName, size, mime, fileId }]
   *   meta：{ receiptId, submittedAt（yyyy.mm.dd HH:mm）, timezone? }
   */
  function buildLabeledData(answers, attachments, meta) {
    answers = answers || {};
    attachments = attachments || [];
    meta = meta || {};
    var roleId = getPath(answers, 'role.id');
    var role = roleById(roleId) || { id: roleId, label: roleId, desc: '' };
    attachments = attachments.map(function (a) {
      var k = canonicalFileKey(a.key);
      if (k === a.key) return a;
      var c = {};
      for (var p in a) if (Object.prototype.hasOwnProperty.call(a, p)) c[p] = a[p];
      c.key = k;
      c.label = fileLabelForKey(k, answers);
      return c;
    });
    var filesByKey = {};
    attachments.forEach(function (a) { (filesByKey[a.key] = filesByKey[a.key] || []).push(a.fileName); });

    var out = {
      meta: {
        title: META.title, tag: META.tag, org: META.org, schemaVersion: META.version,
        receiptId: meta.receiptId || '', submittedAt: meta.submittedAt || '', timezone: meta.timezone || META.timezone,
        shareEmail: SHARE_EMAIL
      },
      student: { account: getPath(answers, 'student.account') || '', name: getPath(answers, 'student.name') || '' },
      role: { id: role.id, label: role.label, desc: role.desc || '', hasDownline: getPath(answers, 'role.hasDownline') || '', hasDownlineLabel: roleId === 'reseller' ? optionLabel(OPTIONS.yesNo, getPath(answers, 'role.hasDownline')) : '' },
      sections: [],
      links: [],
      attachments: attachments,
      gaps: computeGaps(answers, attachments),
      raw: answers
    };

    sectionsForRole(roleId, answers).forEach(function (sec) {
      if (sec.id === 'student' || sec.id === 'role') return;
      var block = { id: sec.id, label: sec.label, kind: sec.kind, icon: sec.icon, desc: sec.desc, hint: sectionHint(sec, roleId), notice: sectionNotice(sec, roleId) || sec.notice || '' };
      var data = answers[sec.id] || {};
      if (sec.kind === 'fields') {
        block.fields = fieldsForRole(sec, roleId, answers).map(function (f) {
          var v = data[f.id];
          var entry = { id: f.id, label: f.label, type: f.type, value: v === undefined ? null : v, display: displayOf(f, v) };
          if (f.type === 'files') { entry.files = filesByKey[sec.id + '.' + f.id] || []; entry.display = entry.files.join('\n'); }
          if (f.type === 'list') entry.items = listOf(v);
          return entry;
        });
      } else if (sec.kind === 'uploads') {
        block.categories = categoriesForRole(roleId, answers).map(function (c) {
          var v = data[c.id] || {};
          var yes = v.status === 'yes';
          var links = yes ? (v.links || []).filter(function (l) { return l && l.url; }).map(function (l) { return { url: l.url, note: l.note || '' }; }) : [];
          links.forEach(function (l) { out.links.push({ categoryId: c.id, category: c.label, url: l.url, note: l.note }); });
          return {
            id: c.id, label: c.label, icon: c.icon, def: c.def, desc: c.def, hint: categoryHint(c, roleId),
            refs: c.refs.map(function (r) { return { key: r.key, label: r.label, primary: !!r.primary }; }),
            status: v.status || '', statusLabel: v.status ? optionLabel(OPTIONS.uploadStatus, v.status) : '未填寫',
            files: yes ? (filesByKey['uploads.' + c.id] || []) : [],
            links: links,
            note: yes ? String(v.note || '') : ''
          };
        });
      } else if (sec.kind === 'flow') {
        block.head = sec.headFields.map(function (f) {
          var v = data[f.id];
          return { id: f.id, label: f.label, value: v || '', display: optionLabel(f.options, v) };
        });
        var flowData = normalizeFlow(sec.id, data);
        block.summary = flowSummary(sec.id, flowData);
        block.stages = flowData.stages.map(function (st, i) {
          var t = st.template ? templateStage(sec.id, st.id) : null;
          var doing = st.status === 'doing';
          var files = doing ? (filesByKey[sec.id + '.' + st.id] || []) : [];
          var steps = doing ? st.steps : [];
          var tools = doing ? toolsText(st) : '';
          return {
            order: i + 1, id: st.id, template: !!st.template, custom: !st.template,
            name: stageDisplayName(st), label: stageDisplayName(st), templateName: st.templateName || '',
            renamed: !!st.template && stageDisplayName(st) !== st.templateName,
            icon: t ? t.icon : 'plus', desc: t ? t.desc : '', hint: t ? t.desc : '',
            status: st.status || '', statusLabel: stageStatusLabel(st.status),
            handling: doing ? (st.handling || '') : '', handlingLabel: doing ? stageHandlingLabel(st.handling) : '',
            incomplete: doing && !st.handling,
            na: st.status === 'na', filled: !!st.status,
            steps: steps, tools: tools,
            toolList: doing ? st.tools : [], toolsOther: doing ? st.toolsOther : '', files: files,
            fields: [
              { id: 'status', label: '狀態', value: st.status || '', display: stageStatusLabel(st.status) },
              { id: 'handling', label: '處理方式', value: doing ? (st.handling || '') : '', display: doing ? stageHandlingLabel(st.handling) : '' },
              { id: 'steps', label: '實際做法', value: steps, display: displayOf({ type: 'list' }, steps) },
              { id: 'tools', label: '使用工具', value: doing ? st.tools : [], display: tools },
              { id: 'toolsOther', label: '其他工具', value: doing ? st.toolsOther : '', display: doing ? st.toolsOther : '' },
              { id: 'shots', label: '截圖', value: files, display: files.join('\n') }
            ]
          };
        });
        block.diagram = flowDiagram(sec.id, flowData).nodes;
      }
      out.sections.push(block);
    });
    return out;
  }

  /**
   * 匯出列（除「索引」外各工作表；索引由資料中心依名單產生）
   *   labeled：作業資料 JSON；ix：{ receiptId, name, role }
   * 回傳 { profile:[...], uploads:[...], links:[...], flows:[...], dialog:[...], timeSavers:[...] }（每列為陣列，順序同 EXPORT_TABS.headers）
   */
  function exportRows(labeled, ix) {
    var a = (labeled && labeled.raw) || {};
    var id = ix.receiptId, nm = ix.name;
    var roleId = getPath(a, 'role.id');
    var pr = a.profile || {};
    var counts = {};
    ((labeled && labeled.attachments) || []).forEach(function (x) { var k = canonicalFileKey(x.key); counts[k] = (counts[k] || 0) + 1; });
    var rows = { profile: [], uploads: [], links: [], flows: [], dialog: [], timeSavers: [] };
    var scaleOn = !!(roleById(roleId) && roleId !== 'employee');
    rows.profile.push([id, nm, ix.role || (roleById(roleId) || {}).label || '', roleId === 'reseller' ? optionLabel(OPTIONS.yesNo, getPath(a, 'role.hasDownline')) : '',
      industryText(a), pr.brand || '', pr.company || '', pr.title || '', pr.business || '', labelsOf(OPTIONS.serviceMode, pr.serviceMode || []),
      scaleOn ? (pr.scale || '') : '', scaleOn && pr.scale === '團隊' ? (pr.headcount || '') : '']);

    var up = a.uploads || {};
    categoriesForRole(roleId, a).forEach(function (c) {
      var v = up[c.id] || {};
      var yes = v.status === 'yes';
      var links = yes ? (v.links || []).filter(function (l) { return l && l.url; }) : [];
      rows.uploads.push([id, nm, c.label, v.status ? optionLabel(OPTIONS.uploadStatus, v.status) : '', yes ? (counts['uploads.' + c.id] || 0) : 0, links.length, yes ? (v.note || '') : '']);
      links.forEach(function (l) { rows.links.push([id, nm, c.label, l.url, l.note || '']); });
    });

    sectionsForRole(roleId, a).forEach(function (sec) {
      if (sec.kind !== 'flow') return;
      var flow = a[sec.id] || {};

      }
    } catch (e) { /* fall through */ }
    for (var j = 0; j < len; j++) out += chars.charAt(Math.floor(Math.random() * chars.length));
    return out;
  }

  function clientInfo() {
    try {
      return { ua: root.navigator ? root.navigator.userAgent.slice(0, 200) : '', tz: Intl.DateTimeFormat().resolvedOptions().timeZone };
    } catch (e) { return {}; }
  }

  /* ------------------------------------------------------------------ */
  /* 前台：名冊查詢與填寫計時（免 token；以 clientKey 限流）               */
  /* ------------------------------------------------------------------ */
  var CLIENT_KEY = 'consult_client_key';
  var memClientKey = '';
  /** 前台裝置識別碼：隨機 24 碼，存 localStorage（不可用時存記憶體）；只用於限流，不含個資 */
  function clientKey() {
    if (memClientKey) return memClientKey;
    var st = storageOf('localStorage');
    var k = '';
    try { k = st ? String(st.getItem(CLIENT_KEY) || '') : ''; } catch (e) { k = ''; }
    if (!/^[A-Za-z0-9]{16,64}$/.test(k)) {
      k = randomKey(24);
      try { if (st) st.setItem(CLIENT_KEY, k); } catch (e) { /* ignore */ }
    }
    memClientKey = k;
    return k;
  }

  /**
   * rosterLookup(q) → { found:true, name } ｜ { found:false } ｜ { found:false, empty:true }
   *   q 為學員帳號或 Email；只回本名。empty:true 表示名冊尚未同步，畫面改為手動輸入本名。
   *   ERR_RATE_LIMIT：同裝置連續查無 5 次鎖 15 分鐘，或全站查詢過多。
   */
  function rosterLookup(q) {
    return call('roster_lookup', { q: String(q == null ? '' : q), clientKey: clientKey() }, { retries: 1 });
  }

  /**
   * sessionStart({ account, name, role? }) → { account, name, startedAt, lastSeen, resumed, elapsedMin }
   *   學員資料頁完成帳號與本名後呼叫一次；伺服器記錄開始時間（已存在且未送出不覆蓋）。失敗不影響填寫（呼叫端可忽略錯誤）。
   */
  function sessionStart(o) {
    o = o || {};
    var params = { account: o.account, name: o.name, clientKey: clientKey() };
    if (o.role) params.role = o.role;
    return call('session_start', params, { retries: 1 });
  }

  /* ------------------------------------------------------------------ */
  /* 後台                                                                */
  /* ------------------------------------------------------------------ */
  /*
   * 登入狀態：{ token, expiresAt, remember } 以 JSON 存於
   *   勾選記住此裝置 → localStorage（30 天）；未勾選 → sessionStorage（分頁關閉即失效，最長 12 小時）
   * 儲存不可用（隱私模式、封鎖網站資料）時改存記憶體。讀取時逾期即清除並記錄 expired 旗標，供畫面提示。
   */
  var TOKEN_KEY = 'consult_admin_token';
  var REMEMBER_MAX_MS = 30 * 24 * 60 * 60 * 1000;
  var mem = null;
  var expiredFlag = '';

  function storageOf(kind) {
    try { var s = root[kind]; return s && typeof s.getItem === 'function' ? s : null; } catch (e) { return null; }
  }
  function readFrom(kind) {
    var st = storageOf(kind); if (!st) return null;
    try {
      var raw = st.getItem(TOKEN_KEY); if (!raw) return null;
      var o = raw.charAt(0) === '{' ? JSON.parse(raw) : { token: raw, expiresAt: 0, remember: false };
      return o && typeof o.token === 'string' && o.token ? o : null;
    } catch (e) { return null; }
  }
  function writeTo(kind, o) {
    var st = storageOf(kind); if (!st) return false;
    try { if (o) st.setItem(TOKEN_KEY, JSON.stringify(o)); else st.removeItem(TOKEN_KEY); return true; } catch (e) { return false; }
  }
  function clearSession() {
    mem = null;
    writeTo('localStorage', null);
    writeTo('sessionStorage', null);
  }
  /** 目前有效的登入狀態或 null；逾期者清除並記錄 expired（'remember'／'session'） */
  function session() {
    var o = readFrom('localStorage') || readFrom('sessionStorage') || mem;
    if (!o) return null;
    var now = Date.now(), exp = Number(o.expiresAt) || 0;
    // 舊版只存 token 字串（無效期）：保留至分頁關閉，由資料中心判定
    if (exp && (now >= exp || exp - now > REMEMBER_MAX_MS + 60000)) {
      expiredFlag = o.remember ? 'remember' : 'session';
      clearSession();
      return null;
    }
    return { token: o.token, expiresAt: exp, remember: !!o.remember };
  }
  function getToken() { var s = session(); return s ? s.token : ''; }
  function setSession(d, remember) {
    clearSession();
    if (!d || !d.token) return;
    var o = { token: d.token, expiresAt: Number(d.expiresAt) || 0, remember: !!remember };
    if (!writeTo(remember ? 'localStorage' : 'sessionStorage', o)) mem = o;
  }
  /** 取出並清除逾期旗標：'remember'（30 天效期已過）、'session'（12 小時效期已過）或 '' */
  function takeExpired() { var f = expiredFlag; expiredFlag = ''; return f; }

  /**
   * login(password, remember) → { token, expiresAt, remember }
   *   remember=true：資料中心簽發 30 天效期 token，存 localStorage；否則 12 小時，存 sessionStorage
   */
  function login(password, remember) {
    remember = !!remember;
    return call('login', { password: password, remember: remember }, { retries: 0 }).then(function (d) {
      setSession(d, remember);
      d.remember = remember;
      return d;
    });
  }
  /** 登出：清除兩種儲存與記憶體中的 token */
  function logout() { clearSession(); expiredFlag = ''; }

  function authed(action, params) {
    var token = getToken();
    if (!token) return Promise.reject(new ApiError('尚未登入', 'ERR_AUTH'));
    return call(action, Object.assign({ token: token }, params || {})).catch(function (err) {
      if (err.code === 'ERR_AUTH') clearSession();
      throw err;
    });
  }

  /** list({ status, q }) → { rows: [...索引列], total } */
  function list(filter) { return authed('list', filter || {}); }

  /**
   * get(receiptId) → { index, data, files:[{fileId,name,size,mime,key?,label}], gaps }
   *   data 為作業資料 JSON（meta、student、role、sections、attachments、gaps、raw）；
   *   files 含學員附件與系統產生的作業資料 JSON、作業內容 PDF（label 分別為「作業資料 JSON」「作業內容 PDF」）。
   */
  function get(receiptId) { return authed('get', { receiptId: receiptId }); }

  /** setStatus(receiptId, status) → { receiptId, status } */
  function setStatus(receiptId, status) { return authed('set_status', { receiptId: receiptId, status: status }); }

  /** downloadFile(fileId) → { name, mime, size, base64 }；save=true 時直接觸發瀏覽器下載 */
  function downloadFile(fileId, save) {
    return authed('download_file', { fileId: fileId }).then(function (d) {
      if (save) saveBlob(base64ToBlob(d.base64, d.mime || mimeForName(d.name)), d.name);
      return d;
    });
  }

  /**
   * downloadAll(receiptId) → { zipped: true, name, size, base64 } 或 { zipped: false, reason, name, files:[{fileId,name,size}] }
   * zipped 時 save=true 直接下載 zip；非 zipped 時由畫面逐檔呼叫 downloadFile（files 內無直接連結）。
   */
  function downloadAll(receiptId, save) {
    return authed('download_zip', { receiptId: receiptId }).then(function (d) {
      if (save && d.zipped) saveBlob(base64ToBlob(d.base64, 'application/zip'), d.name);
      return d;
    });
  }

  /**
   * exportAll() → { name, mime, base64, count }
   *   連線模式為 xlsx；離線模擬為 csv。mime 由資料中心回傳，缺少時依副檔名推斷。save=true 直接下載。
   */
  function exportAll(save) {
    return authed('export_xlsx', {}).then(function (d) {
      d.mime = d.mime || mimeForName(d.name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (save) saveBlob(base64ToBlob(d.base64, d.mime), d.name);
      return d;
    });
  }

  /**
   * rosterSync(rows) → { count, keys, skipped, duplicates, shards, updatedAt }
   *   rows：[{ account, email, name }]（≤ 5000；由名冊同步書籤經 postMessage 送達後台頁面）；整份取代。
   */
  function rosterSync(rows) { return authed('roster_sync', { rows: rows || [] }); }
  /** rosterStatus() → { count, keys, shards, updatedAt, empty } */
  function rosterStatus() { return authed('roster_status', {}); }
  /** progressList() → { rows:[{ account, name, role, startedAt, lastSeen, elapsedMin }], total }（已開始未送出） */
  function progressList() { return authed('progress_list', {}); }

  /** ping() → { version, time } */
  function ping() { return call('ping', {}, { retries: 0 }); }

  return {
    ApiError: ApiError,
    config: config,
    useMock: useMock,
    call: call,
    checkFile: checkFile,
    checkFileIssue: checkFileIssue,
    extOf: extOf,
    mimeForName: mimeForName,
    blobToBase64: blobToBase64,
    base64ToBlob: base64ToBlob,
    saveBlob: saveBlob,
    isIOS: isIOS,
    submit: submit,
    clientKey: clientKey,
    rosterLookup: rosterLookup,
    sessionStart: sessionStart,
    rosterSync: rosterSync,
    rosterStatus: rosterStatus,
    progressList: progressList,
    login: login,
    logout: logout,
    getToken: getToken,
    session: session,
    takeExpired: takeExpired,
    isLoggedIn: function () { return !!getToken(); },
    list: list,
    get: get,
    setStatus: setStatus,
    downloadFile: downloadFile,
    downloadAll: downloadAll,
    exportAll: exportAll,
    ping: ping
  };
});

</script>

<div id="view-login" class="login" hidden>
  <main class="login-card enter" id="main-login" aria-labelledby="login-title">
    <img class="logo" data-logo alt="G.R.A.C.E Academy">
    <div class="head">
      <h1 id="login-title">諮詢前置作業 後台</h1>
      <p class="sub">學員作業審閱、下載與狀態管理</p>
    </div>
    <div id="login-ctx" class="alert info login-ctx" hidden><svg class="i" aria-hidden="true"><use href="#i-roster"/></svg><div><b>名冊同步</b><p>登入後自動接收官網後台傳送的名冊。</p></div></div>
    <div id="login-alert" class="alert err" role="alert" hidden><svg class="i" aria-hidden="true"><use href="#i-alert"/></svg><div><b id="login-alert-t"></b></div></div>

      <div class="field">
        <label class="label" for="pw">管理密碼</label>
        <div class="pw-wrap">
          <input class="input" id="pw" name="password" type="password" autocomplete="current-password" required aria-describedby="pw-err">
          <button class="btn btn-ghost btn-icon" type="button" id="pw-toggle" aria-label="顯示密碼" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg></button>
        </div>
        <div class="field-err" id="pw-err" hidden></div>
      </div>
      <label class="remember" for="remember"><input type="checkbox" id="remember" name="remember"><span class="rt"><span>記住此裝置（30 天）</span><span class="rd">共用電腦不建議勾選</span></span></label>
      <button class="btn btn-primary btn-lg" type="submit" id="login-btn">登入後台</button>
    </form>
    <div class="known" id="login-known" hidden>
      <div class="kt"><svg class="i" aria-hidden="true"><use href="#i-device"/></svg><div><b>此裝置已記住</b><p id="known-exp"></p></div></div>
      <div class="acts">
        <button class="btn btn-primary btn-lg" type="button" data-act="enter">進入後台</button>
        <button class="btn btn-text" type="button" data-act="forget">登出此裝置並改用密碼登入</button>
      </div>
    </div>
    <p class="note" id="login-note">未勾選時登入狀態保留至分頁關閉，最長 12 小時；勾選後此裝置 30 天內免重新登入。</p>
  </main>
</div>

    state.loaded = false; state.rows = []; state.detail = null; prog.loaded = false; prog.rows = []; roster.status = null;
    // 記住此裝置且仍在效期內：顯示已記住狀態，可直接進入
    var ss = API.session ? API.session() : null;
    var known = !!(ss && ss.remember);

    $('#login-form').hidden = known;
    $('#login-note').hidden = known;
    if (known) { $('#known-exp').textContent = '登入效期至 ' + fmtStamp(ss.expiresAt, true); setTimeout(function () { $('[data-act="enter"]').focus(); }, 30); }
    else setTimeout(function () { $('#pw').focus(); }, 30);
  }

  function initLogin() {
    var form = $('#login-form'), pw = $('#pw'), err = $('#pw-err'), btn = $('#login-btn'), rem = $('#remember');
    rem.checked = store('consult_admin_remember_pref') === '1';
    rem.addEventListener('change', function () { store('consult_admin_remember_pref', rem.checked ? '1' : '0'); });
    $('#pw-toggle').addEventListener('click', function () {

      this.setAttribute('aria-pressed', on ? 'true' : 'false');
      this.setAttribute('aria-label', on ? '隱藏密碼' : '顯示密碼');
      $('use', this).setAttribute('href', on ? '#i-eye-off' : '#i-eye');
    });
    function setErr(m) { err.hidden = !m; err.innerHTML = m ? icon('alert', 'sm') + esc(m) : ''; pw.setAttribute('aria-invalid', m ? 'true' : 'false'); }
    pw.addEventListener('input', function () { if (err.hidden === false) setErr(''); });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      $('#login-alert').hidden = true;
      if (!pw.value) { setErr('管理密碼為必填。'); pw.focus(); return; }
      setErr('');
      btn.disabled = true; btn.classList.add('is-busy'); btn.textContent = '驗證中…';

      }, function (e) {
        var m = e.code === 'ERR_RATE_LIMIT' ? (e.message || '錯誤次數過多，15 分鐘後再試。') : e.code === 'ERR_AUTH' ? '密碼不符，管理密碼區分大小寫。' : (e.message || '無法連線資料中心');
        setErr(m); pw.select();
      }).then(function () { btn.disabled = false; btn.classList.remove('is-busy'); btn.textContent = '登入後台'; });
    });
  }

  function enterApp() {

    route();

  /** 頂部工具列的登入效期 */

  /** 效期檢查：分頁回到前景與每分鐘一次；逾期自動回登入並提示 */
  function checkSession() {
    if ($('#view-app').hidden) return;
    if (!API.isLoggedIn()) { goLogin(expiredMsg() || '登入已失效，需重新登入。'); return; }

  /* ---------------- 路由 ---------------- */
  function dec(s) { try { return decodeURIComponent(s); } catch (e) { return ''; } }
  function parseHash() {
    var h = location.hash.replace(/^#/, '') || '/';
    var m = /^\/r\/([^?]+)/.exec(h);
    if (m) return { view: 'detail', id: dec(m[1]) };
    if (/^\/roster-sync\/?$/.test(h)) return { view: 'sync' };
    if (/^\/roster\/?$/.test(h)) return { view: 'roster' };
    if (/^\/progress\/?$/.test(h)) return { view: 'progress' };
    var q = h.split('?')[1] || '', p = {};
    q.split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); if (i < 0) return; var k = dec(kv.slice(0, i)); if (Object.prototype.hasOwnProperty.call(state.f, k) || k === 'sort') p[k] = dec(kv.slice(i + 1)); });
    return { view: 'list', params: p };
  }
  function filtersToHash() {
    var p = [];
    Object.keys(state.f).forEach(function (k) { if (state.f[k]) p.push(k + '=' + encodeURIComponent(state.f[k])); });
    if (state.sort.key !== 'submittedAt' || state.sort.dir !== 'desc') p.push('sort=' + state.sort.key + '.' + state.sort.dir);
    var h = '#/' + (p.length ? '?' + p.join('&') : '');
    if (location.hash !== h) history.replaceState(null, '', h);
    syncBrandHref();
  }
  function route() {
    if (!API.isLoggedIn()) { goLogin(expiredMsg()); return; }
    if (/^#\/login$/.test(location.hash)) { goLogin(); return; }
    var r = parseHash();
    syncBrandHref();
    if (r.view === 'detail') openDetail(r.id);
    else if (r.view === 'sync') showSync();
    else if (r.view === 'roster') showRoster();
    else if (r.view === 'progress') showProgress();
    else {
      var p = r.params || {};
      Object.keys(state.f).forEach(function (k) { state.f[k] = p[k] || ''; });
      if (p.sort) { var s = p.sort.split('.'); if (COLS.some(function (c) { return c.key === s[0]; })) state.sort = { key: s[0], dir: s[1] === 'asc' ? 'asc' : 'desc' }; }
      showList();
    }
  }

  /* ---------------- 名單 ---------------- */
  function loadRows(force) {
    if (state.loaded && !force) return Promise.resolve();
    state.loading = true; state.error = null;
    return API.list({}).then(function (d) {
      state.rows = d.rows || []; state.loaded = true; absorbGapCounts(state.rows); setTimeout(fetchGapCounts, 0);
    }, function (e) {

  }

  /** 匯出格式說明（連線版 Excel；離線示範為 Excel 可開啟的 CSV） */
  function exportFmt() { return API.useMock() ? 'Excel 相容 CSV（離線示範）' : 'Excel 檔（.xlsx）'; }
  /** 整份下載檔名：本名_yyyy.mm.dd.zip（與資料夾內檔名前綴一致） */
  function safeFile(s) { return String(s || '未命名').replace(/[\\\/:*?"<>|\u0000-\u001f\u007f]/g, '＿').replace(/[\s　]+/g, ' ').trim().slice(0, 60) || '未命名'; }
  function rowZipName(r) { return safeFile(r.name) + '_' + fmtTime(r.submittedAt).slice(0, 10) + '.zip'; }
  function driveBtn(url, cls, compact) {
    if (!/^https:\/\/drive\.google\.com\/drive\/folders\/[\w-]+$/.test(url || '')) return '';
    return '<a class="btn btn-secondary has-icon ' + (cls || '') + '" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" data-drive' + (compact ? ' aria-label="在雲端硬碟開啟（開新分頁）" title="在雲端硬碟開啟"' : '') + '>' + icon('ext', compact ? 'sm' : '') + (compact ? '' : '<span>在雲端硬碟開啟</span><span class="sr-only">（開新分頁）</span>') + '</a>';
  }
  function rowDlBtn(r) {

  }

  function uniq(arr) { var o = []; arr.forEach(function (v) { if (v && o.indexOf(v) < 0) o.push(v); }); return o; }

        '<button class="btn btn-primary has-icon btn-export" type="button" data-act="export">' + icon('table') + '<span class="t"><span class="nm">匯出全部回答</span><span class="fmt">' + esc(exportFmt()) + '</span></span></button></div>' +
      '</header>' +
      inAppBanner() +
      '<section class="ledger" aria-label="作業統計" id="ledger"></section>' +
      '<section aria-labelledby="list-title">' +
      '<form class="filters" id="filters" role="search" aria-label="篩選名單" onsubmit="return false">' +
        '<div class="field f-q"><label class="label" for="f-q">搜尋</label><div class="search">' + icon('search') + '<input class="input" id="f-q" type="search" placeholder="本名、帳號、品牌" autocomplete="off"></div></div>' +
        '<div class="field"><label class="label" for="f-role">身分</label><select class="select" id="f-role"><option value="">全部身分</option>' + roleOpts + '</select></div>' +
        '<div class="field"><label class="label" for="f-ind">行業</label><select class="select" id="f-ind"><option value="">全部行業</option></select></div>' +

        '<fieldset class="field f-date" style="border:0;padding:0;margin:0"><legend class="sr-only">送出日期區間</legend>' +
          '<div class="field"><label class="label" for="f-from">送出日期起</label><input class="input mono" id="f-from" inputmode="numeric" placeholder="2026.10.01" maxlength="10" aria-describedby="f-date-err"></div>' +
          '<span class="to" aria-hidden="true">至</span>' +
          '<div class="field"><label class="label" for="f-to">送出日期迄</label><input class="input mono" id="f-to" inputmode="numeric" placeholder="2026.10.31" maxlength="10" aria-describedby="f-date-err"></div>' +

      '<div class="result-bar"><p id="result-count" aria-live="polite"></p><button class="btn btn-text" type="button" id="clear-filters" hidden>清除篩選條件</button></div>' +
      '<div id="list-body"></div>' +
      '</section>';

    var deb;
    $('#f-q', root).addEventListener('input', function () { clearTimeout(deb); var v = this.value; deb = setTimeout(function () { state.f.q = v.trim(); applyFilters(); }, 160); });
    [['#f-role', 'role'], ['#f-ind', 'ind'], ['#f-st', 'st']].forEach(function (p) {
      $(p[0], root).addEventListener('change', function () { state.f[p[1]] = this.value; applyFilters(); });
    });
    ['from', 'to'].forEach(function (k) {
      var el = $('#f-' + k, root);
      el.addEventListener('change', function () { commitDate(k, el); });
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') commitDate(k, el); });
    });
    $('#clear-filters', root).addEventListener('click', function () {
      state.f = { q: '', role: '', ind: '', st: '', from: '', to: '' };
      syncFilterInputs(); applyFilters(); $('#f-q').focus();

  }

  function normDate(v) {
    v = String(v || '').trim();
    if (!v) return '';
    var m = /^(\d{4})[.\-/]?(\d{1,2})[.\-/]?(\d{1,2})$/.exec(v);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return y + '.' + (mo < 10 ? '0' : '') + mo + '.' + (d < 10 ? '0' : '') + d;
  }
  function commitDate(k, el) {
    var n = normDate(el.value), err = $('#f-date-err');
    if (n === null) {
      el.setAttribute('aria-invalid', 'true');
      err.hidden = false; err.innerHTML = icon('alert', 'sm') + '日期格式為 yyyy.mm.dd，例：2026.10.01。';
      return;
    }
    el.setAttribute('aria-invalid', 'false'); el.value = n;
    if (!$$('#filters [aria-invalid="true"]').length) err.hidden = true;
    state.f[k] = n; applyFilters();
  }

  function syncFilterInputs() {
    var root = $('#view-list'); if (!root.dataset.built) return;
    $('#f-q').value = state.f.q; $('#f-role').value = state.f.role; $('#f-st').value = state.f.st;
    $('#f-from').value = state.f.from; $('#f-to').value = state.f.to;
    fillIndustry(); $('#f-ind').value = state.f.ind;
  }
  function fillIndustry() {
    var sel = $('#f-ind'); if (!sel) return;
    var base = S.OPTIONS.industry.filter(function (x) { return x !== '其他'; });
    var extra = uniq(state.rows.map(function (r) { return r.industry; })).filter(function (x) { return base.indexOf(x) < 0; });
    var all = base.concat(extra);
    var cur = state.f.ind;
    sel.innerHTML = '<option value="">全部行業</option>' + all.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');
    sel.value = cur;
  }

  function applyFilters() { filtersToHash(); renderList(); }

  function filteredRows() {
    var f = state.f, q = f.q.toLowerCase();
    var from = f.from ? dateKey(f.from) : '', to = f.to ? dateKey(f.to) : '';
    var rows = state.rows.filter(function (r) {
      if (f.role && r.role !== f.role) return false;
      if (f.ind && r.industry !== f.ind) return false;
      if (f.st && r.status !== f.st) return false;
      var dk = dateKey(r.submittedAt);
      if (from && dk < from) return false;
      if (to && dk > to) return false;
      if (q && [r.name, r.account, r.brand, r.receiptId].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var k = state.sort.key, dir = state.sort.dir === 'asc' ? 1 : -1;
    var STORDER = { '未讀': 0, '需補件': 1, '已讀': 2 };
    rows.sort(function (a, b) {
      var x = a[k], y = b[k];
      if (k === 'fileCount') { x = +x || 0; y = +y || 0; }
      else if (k === 'durationMin') { x = durMin(a); y = durMin(b); x = x == null ? -1 : x; y = y == null ? -1 : y; }
      else if (k === 'gaps') { x = state.gapN[a.receiptId]; y = state.gapN[b.receiptId]; x = x == null ? -1 : x; y = y == null ? -1 : y; }
      else if (k === 'status') { x = STORDER[x]; y = STORDER[y]; }
      else { x = String(x || ''); y = String(y || ''); }
      if (x < y) return -1 * dir; if (x > y) return 1 * dir;
      return String(a.submittedAt) < String(b.submittedAt) ? 1 : -1;
    });
    return rows;
  }

  function renderLedger() {

      '<button type="button" class="stat is-warn" data-st="需補件" aria-pressed="' + (st === '需補件') + '"><span class="k">需補件</span><span class="v num">' + supp + '<small>份</small></span></button>';

  /** 填寫耗時（分）：索引列 durationMin；缺少時由開始與送出時間推算；無開始紀錄回 null */
  function durMin(r) {
    var n = r && r.durationMin;
    if (n != null && n !== '' && isFinite(Number(n))) return Number(n);
    return r && r.startedAt && S.durationMinutes ? S.durationMinutes(r.startedAt, r.submittedAt) : null;
  }
  function durText(min) { var t = S.durationText ? S.durationText(min) : ''; return t || ''; }
  function isoAttr(s) { return esc(fmtTime(s).replace(/\./g, '-').replace(' ', 'T')); }
  function durCell(r) {
    var t = durText(durMin(r));

    return '<span class="dur">' + esc(t) + '</span>' + (r.startedAt ? '<span class="dur-s"><span class="sr-only">開始 </span><time datetime="' + isoAttr(r.startedAt) + '">' + esc(fmtTime(r.startedAt)) + '</time></span>' : '');
  }

  function isEmployedLabel(label) { return S.ROLES.some(function (x) { return x.label === label && (S.EMPLOYED_ROLES || []).indexOf(x.id) >= 0; }); }
  function brandCell(r) {
    if (blank(r.brand)) return '<span class="blank">—</span>';
    return isEmployedLabel(r.role) ? '<span class="org"><span class="org-k">任職</span>' + esc(r.brand) + '</span>' : esc(r.brand);

  var COLS = [
    { key: 'name', label: '本名／學員帳號' },
    { key: 'role', label: '身分' },

    { key: 'brand', label: '品牌／任職公司' },
    { key: 'submittedAt', label: '送出時間', r: true },
    { key: 'durationMin', label: '填寫耗時／開始時間', r: true },
    { key: 'gaps', label: '缺口數', r: true },
    { key: 'fileCount', label: '檔案數', r: true },
    { key: 'status', label: '狀態' },

  function renderList() {
    if (!$('#view-list').dataset.built || $('#view-list').hidden) return;
    var body = $('#list-body');
    if (state.error && !state.loaded) {
      $('#ledger').innerHTML = '';
      $('#result-count').textContent = '';
      body.innerHTML = '<div class="card"><div class="empty" role="alert">' + icon('alert') + '<h2>名單載入失敗</h2><p>' + esc(state.error.message || '資料中心回應異常') + '</p><button class="btn btn-secondary has-icon" type="button" data-act="refresh">' + icon('refresh') + '重新載入名單</button></div></div>';
      return;

    fillIndustry();
    renderLedger();
    var rows = filteredRows();
    var hasFilter = Object.keys(state.f).some(function (k) { return state.f[k]; });
    $('#clear-filters').hidden = !hasFilter;

    btn.setAttribute('aria-busy', st === 'busy' ? 'true' : 'false');

    if (el) {
      if (st === 'busy') el.innerHTML = pct != null ? esc(pct) : '<span class="dots"><i></i><i></i><i></i></span>';
      else if (st === 'done') el.innerHTML = icon('check') + (btn.classList.contains('dlb') ? '完成' : '');
      else if (st === 'error') el.textContent = '重試';
      else el.textContent = btn.dataset.fmt || '';
    }
    var pg = $('.dl-prog', btn);
    if (pg && pct == null) pg.classList.add('is-indet');
  }
  function setDlRatio(btn, n, total) {
    if (!btn) return;
    setDl(btn, 'busy', n + '／' + total);
    var pg = $('.dl-prog', btn); if (pg) { pg.classList.remove('is-indet'); pg.style.setProperty('--p', String(total ? n / total : 0)); }

  /** 內建瀏覽器提示：LINE 一鍵外開、Android 改用 Chrome、iOS 的 IG／FB 以複製網址為後備 */

  /** 結構缺口：依身分應出現的類別逐格呈現 */
  function renderGaps(g, sections) {
    var up = sectionData(sections, 'uploads');
    var cats = (up && up.categories) || [];
    var n = { yes: 0, no: 0, none: 0 };
    var tiles = cats.map(function (c, i) {
      var st = c.status === 'yes' ? 'yes' : c.status === 'no' ? 'no' : 'none';

        mk = '<span class="mk">' + icon('check') + '有</span>';
        ct = (fc || lc) ? (fc ? '<span>檔案 ' + fc + '</span>' : '') + (lc ? '<span>連結 ' + lc + '</span>' : '') : '<span style="font-family:var(--font-sans)">文字說明</span>';
        aria = '已具備，檔案 ' + fc + '、連結 ' + lc;
      } else if (st === 'no') {
        mk = '<span class="mk">' + icon('close') + '缺口</span>'; ct = '<span>尚無資料</span>'; aria = '缺口，尚無此類資料';
      } else {
        mk = '<span class="mk">未答</span>'; ct = '<span>未填寫狀態</span>'; aria = '未答';
      }
      return '<li><button type="button" class="slot is-' + st + '" style="--i:' + i + '" data-jump="cat-' + esc(c.id) + '" aria-label="' + esc(c.label) + '：' + aria + '">' +
        '<span class="ic">' + icon(c.icon || 'inbox') + mk + '</span><span class="nm">' + esc(c.label) + '</span><span class="ct" aria-hidden="true">' + ct + '</span></button></li>';
    }).join('');

    // 客戶管理重點項目
    var k = g.crmKey, keyHtml;
    if (!k) keyHtml = '<p class="keynote">此身分無客戶管理類別。</p>';
    else {
      var items = '<span class="items">' + (k.items || []).map(function (x) { return '<span class="chip key">' + esc(x) + '</span>'; }).join('') + '</span>';
      var v;
      if (k.attached) v = '<span class="verdict ok">' + icon('check') + '已附上</span><span class="keynote">檔案 <span class="num">' + k.fileCount + '</span>、連結 <span class="num">' + k.linkCount + '</span></span>';
      else if (k.status === 'yes') v = '<span class="verdict miss">' + icon('alert') + '未附檔案</span><span class="keynote">狀態為「有」，僅文字說明</span>';
      else if (k.status === 'no') v = '<span class="verdict miss">' + icon('close') + '尚無</span><span class="keynote">客戶名單與消費紀錄皆未建立</span>';
      else v = '<span class="verdict miss">' + icon('minus') + '未答</span>';
      keyHtml = '<div class="keyrow">' + items + v + '</div>';
    }

    var miss = g.uploadsMissing.length, noneN = g.noneStages.length, total = g.gapCount;
    var flowSecs = sections.filter(function (s) { return s.kind === 'flow'; });
    return '<section class="gaps sec enter" id="sec-gaps" aria-labelledby="gaps-title">' +
      '<div class="gaps-head"><div><p class="eyebrow">' + icon('grid') + '<span class="t">依身分應具備 <span class="num">' + cats.length + '</span> 類資料、<span class="num">' + flowSecs.length + '</span> 個流程</span></p><h2 id="gaps-title">結構缺口</h2></div>' +
        '<p class="tally' + (total ? '' : ' is-zero') + '" aria-label="缺口 ' + total + ' 項：資料類別 ' + miss + ' 類、尚無做法 ' + noneN + ' 步"><span class="n">' + total + '</span><span class="of">項缺口／類別 ' + miss + '＋步驟 ' + noneN + '</span></p>' +
        '<p class="sum">已具備 <b class="num">' + n.yes + '</b> 類　缺口 <b class="num">' + n.no + '</b> 類' + (n.none ? '　未答 <b class="num">' + n.none + '</b> 類' : '') + '</p></div>' +
      '<ul class="bay enter-tiles" aria-label="資料類別結構">' + tiles + '</ul>' +
      '<div class="gaps-foot"><div class="gf"><h3>客戶管理重點</h3>' + keyHtml + '</div><div class="gf"><h3>流程統計</h3>' + flowTotals(g, flowSecs) + '</div></div>' +
      renderFlowGaps(g, flowSecs) +
      '</section>';
  }

  /** 各流程計數合計（缺口摘要 flows；舊摘要無此欄時由區塊 summary 補） */
  function flowTotals(g, flowSecs) {
    var t = { total: 0, doing: 0, none: 0, na: 0, unanswered: 0, manual: 0, partial: 0, auto: 0 };
    flowSecs.forEach(function (s) {
      var m = flowModel(s); var sm = m.summary;
      t.total += sm.total; ['doing', 'none', 'na', 'unanswered'].forEach(function (k) { t[k] += sm.status[k] || 0; });
      ['manual', 'partial', 'auto'].forEach(function (k) { t[k] += sm.handling[k] || 0; });
    });
    function it(sw, label, v, alarm) { return '<span class="it' + (alarm && v ? ' alarm' : '') + (v ? '' : ' zero') + '">' + (sw ? '<span class="sw ' + sw + '" aria-hidden="true"></span>' : '') + label + ' <b>' + v + '</b></span>'; }
    return '<div class="fsum is-compact">' +
      '<span class="grp">' + it('', '步驟', t.total) + it('', '有做法', t.doing) + it('s-none', '尚無做法', t.none, true) + it('s-na', '不適用', t.na) + (t.unanswered ? it('s-unans', '未填寫', t.unanswered) : '') + '</span>' +
      '<span class="grp">' + it('h-manual', '人工處理', t.manual) + it('h-partial', '部分自動', t.partial) + it('h-auto', '系統自動', t.auto) + '</span></div>';
  }

  /** 流程缺口：各流程尚無做法（缺口）與人工處理（可優化）步驟，點擊跳到該步驟 */
  function renderFlowGaps(g, flowSecs) {
    function chip(x, cls, mk) {
      var target = 'stg-' + x.flowId + '-' + x.stageId;
      return '<button type="button" class="gchip ' + cls + '" data-jump="' + esc(target) + '" aria-label="' + esc(x.flow + ' 第 ' + x.order + ' 步 ' + x.stage + (mk ? '，' + mk : '')) + '">' +
        '<span class="o" aria-hidden="true">' + (x.order < 10 ? '0' : '') + x.order + '</span><span class="t">' + esc(x.stage) + '</span>' + (mk ? '<span class="mk" aria-hidden="true">' + esc(mk) + '</span>' : '') + '</button>';
    }
    function lane(sw, label, list, cls, mk, always) {
      if (!list.length && !always) return '';
      return '<div class="lane"><span class="lk"><span class="sw ' + sw + '" aria-hidden="true"></span>' + label + ' <span class="num">' + list.length + '</span></span>' +
        (list.length ? list.map(function (x) { return chip(x, cls, mk); }).join('') : '<span class="ok">無</span>') + '</div>';
    }
    function by(list, id) { return list.filter(function (x) { return x.flowId === id; }); }
    var rows = flowSecs.map(function (s) {
      var none = by(g.noneStages, s.id), manual = by(g.manualStages, s.id);
      var unans = by(g.unansweredStages, s.id), inc = by(g.incompleteStages, s.id);
      return '<li class="fgap-row" data-flow="' + esc(s.id) + '"><span class="fl">' + icon(s.icon || 'route') + esc(secLabel(s)) + '</span><div class="lanes">' +
        lane('s-none', '尚無做法', none, 'g-none', '缺口', true) +
        lane('h-manual', '人工處理', manual, 'g-manual', '可優化', true) +
        lane('s-unans', '未填寫', unans, 'g-muted g-unans', '') +
        lane('h-unset', '處理方式未選', inc, 'g-muted', '') +
        '</div></li>';
    }).join('');
    var head = '<div class="fgap-head"><h3 id="fgap-title">流程缺口</h3><p class="meta">' +
      '<span class="' + (g.noneStages.length ? 'alarm' : '') + '"><span class="sw s-none" aria-hidden="true"></span>尚無做法 <b>' + g.noneStages.length + '</b> 步（計入缺口）</span>' +
      '<span><span class="sw h-manual" aria-hidden="true"></span>人工處理 <b>' + g.manualStages.length + '</b> 步（可優化）</span></p></div>';
    var body = flowSecs.length ? '<ul class="fgap-rows" aria-labelledby="fgap-title">' + rows + '</ul>' : '<p class="keynote">此身分無流程區塊。</p>';
    if (g.legacy) body = '<p class="keynote">此份作業為 2.1 版格式，無尚無做法與處理方式資料；步驟狀態見各流程。</p>';
    return '<div class="fgap" id="flow-gaps">' + head + body + '</div>';
  }

      '<table class="links-tbl"><caption class="sr-only">雲端連結總表</caption><thead><tr><th scope="col">類別</th><th scope="col">說明</th><th scope="col">網址</th></tr></thead><tbody>' +

  function secHead(sec, aside, ico) {

  function fieldOut(f, d) {

  /** 資料上傳逐類 */
  function renderUploads(sec, d) {
    var cats = sec.categories || [];
    var yes = cats.filter(function (c) { return c.status === 'yes'; }).length;
    var body = cats.map(function (c) {
      var st = c.status === 'yes' ? 'yes' : c.status === 'no' ? 'no' : 'none';
      var fc = (c.files || []).length, lc = (c.links || []).length;
      var badge = st === 'yes' ? '<span class="ust yes">' + icon('check') + '有</span>' : st === 'no' ? '<span class="ust no">' + icon('close') + '無</span>' : '<span class="ust none">未答</span>';
      // 舉例標籤：primary 為重點；「其他相關資料」（key=other）另以虛線樣式區隔；2.1 舊 JSON 的 key 為布林重點旗標
      var refs = (c.refs || []).length ? '<div class="refs" aria-label="舉例">' + '<span class="lb">舉例</span>' + c.refs.map(function (r) {
        var other = r.key === 'other' || (S.REF_OTHER && r.label === S.REF_OTHER.label);
        var primary = r.primary != null ? !!r.primary : r.key === true;
        if (other) return '<span class="ref other">' + icon('plus') + esc(r.label) + '</span>';
        return '<span class="ref' + (primary ? ' key' : '') + '">' + (primary ? '<span class="k">重點</span>' : '') + esc(r.label) + '</span>';
      }).join('') + '</div>' : '';
      var inner = refs;
      if (st === 'yes') {
        if (c.note) inner += '<p class="cat-note">' + esc(c.note) + '</p>';
        if (lc) inner += '<ul class="cat-links">' + c.links.map(function (l) { var h = safeHref(l.url); return '<li>' + (l.note ? '<span class="nt">' + esc(l.note) + '</span>' : '') + (h ? '<a class="ext-link" href="' + esc(h) + '" target="_blank" rel="noopener noreferrer">' + icon('ext') + '<span>' + esc(l.url) + '</span><span class="sr-only">（開新分頁）</span></a>' : '<span class="mono muted">' + esc(l.url) + '</span>') + '</li>'; }).join('') + '</ul>';
        inner += thumbs(d, c.files);
        if (!c.note && !lc && !fc) inner += '<p class="blank">無附件與補充說明</p>';

  /* ---------------- 流程 ---------------- */
  function splitTools(t) { return String(t || '').split(/[、,，;；／/]+/).map(function (x) { return x.trim(); }).filter(Boolean); }

  /**
   * 流程顯示模型：{ stages:[{ order,id,template,custom,name,templateName,renamed,icon,desc,status,statusLabel,handling,handlingLabel,incomplete,steps,toolList,toolsOther,tools,files }], nodes, summary }
