  function dlFile(id, btn) {
    busy(btn, true); setDl(btn, 'busy');
    return API.downloadFile(id, true).then(function (f) { toast('已下載 ' + f.name, 'ok'); return f; }, function (e) { onError(e, '下載失敗'); throw e; })
      .then(function (f) { busy(btn, false); setDl(btn, 'done'); markRowDone(btn); return f; }, function (e) { busy(btn, false); setDl(btn, 'error'); throw e; });
  }
  function baseName(d) {
    var pdf = findSpecial(d, /_作業內容\.pdf$/);
    if (pdf) return pdf.name.replace(/_作業內容\.pdf$/, '');
    var date = fmtTime(d.index.submittedAt).slice(0, 10);
    return String(d.index.name || '未命名').replace(/[\\\/:*?"<>|\u0000-\u001f]/g, '＿') + '_' + date;
  }
  function dlJson(btn) {
    var d = state.detail; if (!d) return;
    var jf = findSpecial(d, /_作業資料\.json$/);
    if (jf && jf.fileId) return dlFile(jf.fileId, btn).catch(function () {});
    // 資料夾中無 JSON 檔時（舊資料或檔案被移動）以畫面已載入的資料產生
    var name = baseName(d) + '_作業資料.json';
    API.saveBlob(new Blob([JSON.stringify(d.data, null, 2)], { type: 'application/json' }), name);
    setDl(btn, 'done');
    toast('已下載 ' + name, 'ok');
  }
  function dlPdf(btn) {
    var d = state.detail; if (!d) return;
    var pf = findSpecial(d, /_作業內容\.pdf$/);
    if (pf) dlFile(pf.fileId, btn).catch(function () {});
  }
  function dlZip(btn) {
    var d = state.detail; if (!d) return;
    zipFor(d.index.receiptId, btn);
  }
  /** 整份下載（作業閱讀與名單共用）：可壓縮時直接存 ZIP；超量或離線示範時開逐檔清單 */
  function zipFor(rid, btn) {
    busy(btn, true); setDl(btn, 'busy');
    return API.downloadAll(rid, true).then(function (r) {
      busy(btn, false);
      if (r.zipped) { setDl(btn, 'done'); toast('已下載 ' + r.name, 'ok'); }
      else { setDl(btn, 'idle'); openZipDialog(r, btn); }
    }, function (e) { busy(btn, false); setDl(btn, 'error'); onError(e, '整份下載失敗'); });
  }

  var zipCtx = null;
  function openZipDialog(r, opener) {
    var dlg = $('#zip-dlg');
    zipCtx = { r: r, opener: opener, done: {} };
    var total = r.files.reduce(function (s, f) { return s + (Number(f.size) || 0); }, 0);
    $('#zip-title').textContent = '逐檔下載｜' + r.name.replace(/\.zip$/, '');
    $('#zip-body').innerHTML = inAppBanner() + '<div class="alert info">' + icon('info') + '<div><b>未產生壓縮檔</b><p>' + esc(r.reason || '改為逐檔下載') + '</p></div></div>' +
      (ENV.ios ? '<p class="muted" style="font-size:var(--fs-caption)" data-ios-note>iPhone 下載檔案存於「檔案」App 的「下載項目」。</p>' : '') +
      '<p class="muted" style="font-size:var(--fs-small)">共 <span class="num">' + r.files.length + '</span> 個檔案，合計 <span class="num">' + fmtSize(total) + '</span></p>' +
      '<div class="progress" role="progressbar" aria-label="逐檔下載進度" aria-valuemin="0" aria-valuemax="' + r.files.length + '" aria-valuenow="0" id="zip-prog" hidden><i></i></div>' +
      '<ul class="dl-files">' + r.files.map(function (f) {
        return '<li data-fid="' + esc(f.fileId) + '"><span class="fn">' + esc(f.name) + '</span><span class="sz">' + fmtSize(f.size) + '</span>' +
          '<button type="button" class="btn btn-ghost btn-icon" data-zdl="' + esc(f.fileId) + '" aria-label="下載 ' + esc(f.name) + '">' + icon('download') + '</button></li>';
      }).join('') + '</ul>';
    $('#zip-all').disabled = false;
    $('#zip-all').lastChild.textContent = '依序全部下載';
    dlg.showModal();
    var first = $('[data-zdl]', dlg); if (first) first.focus();
  }
  function markZipDone(fid) {
    if (!zipCtx) return;
    zipCtx.done[fid] = true;
    var li = $('#zip-body li[data-fid="' + CSS.escape(fid) + '"]');
    if (li) { var b = $('button', li); b.outerHTML = '<span class="ok btn-icon" style="display:inline-grid;place-items:center;width:40px;height:40px" aria-label="已下載">' + icon('check') + '</span>'; }
    var n = Object.keys(zipCtx.done).length, p = $('#zip-prog');
    if (p) { p.hidden = false; p.setAttribute('aria-valuenow', n); $('i', p).style.scale = (n / zipCtx.r.files.length) + ' 1'; }
    var o = zipCtx.opener;
    if (o && document.contains(o)) { if (n >= zipCtx.r.files.length) setDl(o, 'done'); else setDlRatio(o, n, zipCtx.r.files.length); }
  }
  function zipAll() {
    if (!zipCtx) return;
    var btn = $('#zip-all'), files = zipCtx.r.files.filter(function (f) { return !zipCtx.done[f.fileId]; });
    busy(btn, true);
    var i = 0, ctx = zipCtx;
    function step() {
      if (ctx !== zipCtx) return Promise.resolve();
      if (i >= files.length) return Promise.resolve();
      var f = files[i++];
      btn.lastChild.textContent = '下載中 ' + i + '／' + files.length;
      return API.downloadFile(f.fileId, true).then(function () { markZipDone(f.fileId); return sleep(350); }).then(step);
    }
    step().then(function () {
      busy(btn, false);
      btn.lastChild.textContent = '已全部下載';
      btn.disabled = true;
      toast('已依序下載 ' + files.length + ' 個檔案', 'ok');
    }, function (e) { busy(btn, false); btn.lastChild.textContent = '繼續下載其餘檔案'; onError(e, '逐檔下載中斷'); });
  }
  function closeDialog(dlg) {
    if (!dlg.open) return;
    dlg.classList.add('is-closing');
    setTimeout(function () { dlg.classList.remove('is-closing'); dlg.close(); }, 160);
  }

  function exportAll(btn) {
    busy(btn, true);
    API.exportAll(false).then(function (r) {
      // mime 與副檔名由 api／資料中心決定（連線版 xlsx、離線版 csv）
      API.saveBlob(API.base64ToBlob(r.base64, r.mime || API.mimeForName(r.name)), r.name);
      toast('已匯出 ' + (r.count != null ? r.count + ' 份作業：' : '') + r.name, 'ok');
    }, function (e) { onError(e, '匯出失敗'); }).then(function () { busy(btn, false); });
  }

  function copyUrl(btn) {
    var url = location.href;
    function done() { toast('網址已複製，可貼到 Safari 或 Chrome 開啟', 'ok'); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('無法自動複製，網址：' + url, 'info');
    }
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, fallback); return; } } catch (e) { /* ignore */ }
    fallback();
  }

  /* 頁內跳轉：hash 用於路由，區塊錨點改以捲動處理 */
  function jumpTo(id) {
    var el = document.getElementById(id); if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
    el.focus({ preventScroll: true });
  }

  /* ---------------- 事件委派 ---------------- */
  document.addEventListener('click', function (ev) {
    var home = ev.target.closest('#brand-home');
    if (home && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && ev.button === 0) {
      ev.preventDefault();
      var h = listHash();
      if (location.hash === h) { if ($('#view-list').hidden) route(); else window.scrollTo({ top: 0, behavior: 'auto' }); }
      else location.hash = h;
      return;
    }
    var t = ev.target.closest('[data-act],[data-dl],[data-zdl],[data-close],[data-jump],tr[data-href]');
    if (!t) return;
    if (t.matches('tr[data-href]')) { if (!ev.target.closest('a,button')) location.hash = t.dataset.href; return; }
    if (t.dataset.jump) { ev.preventDefault(); jumpTo(t.dataset.jump); return; }
    if (t.dataset.dl) { dlFile(t.dataset.dl, t).catch(function () {}); return; }
    if (t.dataset.zdl) { var fid = t.dataset.zdl; busy(t, true); API.downloadFile(fid, true).then(function () { markZipDone(fid); }, function (e) { busy(t, false); onError(e, '下載失敗'); }); return; }
    if (t.hasAttribute('data-close')) { closeDialog(t.closest('dialog')); return; }
    switch (t.dataset.act) {
      case 'logout': logout(); break;
      case 'enter': if (API.isLoggedIn()) { if (/^#\/login$/.test(location.hash)) history.replaceState(null, '', '#/'); enterApp(); } else goLogin(expiredMsg() || '登入已失效，需重新登入。'); break;
      case 'forget': API.logout(); goLogin(); toast('已清除此裝置的登入狀態', 'info'); break;
      case 'export': exportAll(t); break;
      case 'refresh': busy(t, true); loadRows(true).then(function () { renderList(); toast('名單已更新', 'ok'); }, onError).then(function () { busy(t, false); }); break;
      case 'clear-filters': $('#clear-filters').click(); break;
      case 'zip': dlZip(t); break;
      case 'row-zip': zipFor(t.dataset.rid, t); break;
      case 'open-external': location.href = lineExternalUrl(); break;
      case 'open-chrome': location.href = chromeIntentUrl(); break;
      case 'copy-url': copyUrl(t); break;
      case 'json': dlJson(t); break;
      case 'pdf': dlPdf(t); break;
      case 'retry-detail': route(); break;
      case 'prog-refresh': busy(t, true); loadProgress().then(function () { renderProgress(); if (!prog.error) toast('填寫進度已更新', 'ok'); }, onError).then(function () { busy(t, false); }); break;
      case 'psort': sortProgress(t.dataset.key); break;
      case 'reveal': toggleReveal(t.dataset.key); break;
      case 'roster-refresh': busy(t, true); roster.error = null; loadRosterStatus().then(function () { busy(t, false); }); break;
      case 'bm': ev.preventDefault(); toast('書籤需拖曳到書籤列，於官網後台頁面點選才會執行', 'info'); break;
      case 'copy-bm': copyText(bmHref(), '書籤程式已複製，新增書籤後貼到網址欄'); break;
      case 'sync-retry': runSync(); break;
      case 'sync-close': closeSyncWindow(); break;
    }
  });
  $('#zip-all').addEventListener('click', zipAll);
  $('#zip-dlg').addEventListener('close', function () { var o = zipCtx && zipCtx.opener; zipCtx = null; if (o && document.contains(o)) o.focus(); });
  $('#zip-dlg').addEventListener('cancel', function (ev) { ev.preventDefault(); closeDialog(this); });
  $('#zip-dlg').addEventListener('click', function (ev) { if (ev.target === this) closeDialog(this); });

  $('#auto-read').checked = state.autoRead;
  $('#auto-read').addEventListener('change', function () { state.autoRead = this.checked; store('consult_admin_autoread', this.checked ? '1' : '0'); toast(this.checked ? '開啟作業時將自動標記為已讀' : '已停用自動標記已讀', 'info'); });

  window.addEventListener('hashchange', route);
  var cfg = window.CONSULT_CONFIG || {};
  $$('[data-export-fmt]').forEach(function (el) { el.textContent = exportFmt(); });
  $$('.side-foot [data-act="export"]').forEach(function (el) { el.setAttribute('aria-label', '匯出全部回答（' + exportFmt() + '）'); });
  $('#build-meta').textContent = (API.useMock() ? '離線示範資料' : '資料中心連線') + (cfg.BUILD ? '｜版本 ' + cfg.BUILD : '');

  $$('img[data-logo]').forEach(function (im) { im.src = LOGO; });
  initLogin();
  if (API.isLoggedIn()) enterApp(); else goLogin(expiredMsg());
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkSession(); });
  window.addEventListener('focus', checkSession);
  setInterval(checkSession, 60000);
})();
</script>
</body>
</html>
