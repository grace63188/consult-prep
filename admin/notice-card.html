<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>LINE 通知圖卡</title>
<!-- 字型：線上環境載入 Google Fonts；離線或被擋時改用系統已安裝的 Noto CJK TC -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
:root{
  --ink-0:#0C0A0B;--ink-1:#110E0F;--ink-2:#191516;--ink-3:#211C1D;--ink-5:#352E2F;
  --text-1:#F6EFEA;--text-2:#CDC2BC;--text-3:#A0948F;
  --rose-500:#FF2E8B;--rose-300:#FF77B2;
  --rose-tint-2:rgba(255,46,139,.14);--rose-tint-3:rgba(255,46,139,.22);--rose-line-1:rgba(255,46,139,.32);--rose-line-2:rgba(255,46,139,.64);
  --gold:#D9B877;--gold-line:rgba(217,184,119,.42);--gold-soft:rgba(217,184,119,.16);
  --ivory-line:rgba(233,211,203,.22);--line-1:rgba(246,239,234,.08);--line-2:rgba(246,239,234,.14);
  --serif:'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono','DejaVu Sans Mono',ui-monospace,'SFMono-Regular',monospace;
  --stub-w:520px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink-0)}
body{font-family:var(--sans);color:var(--text-1);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.stage{position:relative;width:1920px;height:1080px;padding:60px 64px;
  background:radial-gradient(56% 46% at 30% -6%,rgba(255,46,139,.10),rgba(255,46,139,0) 70%),
             radial-gradient(40% 40% at 100% 110%,rgba(217,184,119,.06),rgba(217,184,119,0) 70%),var(--ink-0)}

/* 票體：主票面＋右側票根 */
.tk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--stub-w);height:100%;background:var(--ink-1);border-radius:24px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line-1),0 60px 120px -40px rgba(0,0,0,.8)}
.notch{position:absolute;z-index:3;right:calc(var(--stub-w) - 22px);width:44px;height:44px;border-radius:50%;background:var(--ink-0)}
.notch.t{top:-22px}.notch.b{bottom:-22px}

.main{position:relative;isolation:isolate;padding:76px 92px 64px;display:flex;flex-direction:column}
/* 防偽紋：桃紅同心圓，主票面右半 */
.main::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:repeating-radial-gradient(circle at 112% 50%,rgba(255,46,139,.065) 0 1.5px,transparent 1.5px 12px);
  -webkit-mask:linear-gradient(90deg,transparent 34%,#000 100%);mask:linear-gradient(90deg,transparent 34%,#000 100%)}
/* 雙線框：米白細線＋金色內線 */
.main::after{content:"";position:absolute;inset:24px;z-index:-1;border:1.5px solid var(--line-2);border-radius:12px;pointer-events:none;
  box-shadow:inset 0 0 0 6px var(--ink-1),inset 0 0 0 7.5px var(--gold-line)}
.corner{position:absolute;width:22px;height:22px;border-color:var(--gold);border-style:solid;opacity:.9}
.corner.tl{top:40px;left:40px;border-width:2px 0 0 2px}.corner.tr{top:40px;right:40px;border-width:2px 2px 0 0}
.corner.bl{bottom:40px;left:40px;border-width:0 0 2px 2px}.corner.br{bottom:40px;right:40px;border-width:0 2px 2px 0}

.head{display:flex;align-items:flex-start;justify-content:space-between}
.logo{width:236px;height:auto;display:block}
.ed{font-family:var(--mono);font-size:22px;letter-spacing:.32em;color:var(--text-3);text-align:right;line-height:1.7;padding-top:8px}
.ed b{display:block;color:var(--gold);font-weight:500}

.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:48px;align-items:center;margin:28px 0 22px;min-height:0}
body[data-type=resend] .ttl{font-size:124px;margin:18px 0 18px}
body[data-type=resend] .who .nm{font-size:84px}body[data-type=resend] .who .sf{font-size:50px}
body[data-type=resend] .rule{margin:22px 0 20px}
body[data-type=resend] .msg{font-size:40px}
body[data-type=resend] .body{gap:40px}
.tag{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:999px;background:var(--rose-tint-2);color:var(--rose-300);
  font-size:30px;font-weight:700;letter-spacing:.1em}
.ttl{font-family:var(--serif);font-weight:900;font-size:156px;line-height:1.08;letter-spacing:.06em;margin:18px 0 18px;color:var(--text-1)}
.who{display:flex;align-items:baseline;gap:18px;font-family:var(--serif)}
.who .nm{font-size:92px;font-weight:700;letter-spacing:.03em;color:var(--text-1);position:relative;max-width:820px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sf{font-size:56px;font-weight:600;color:var(--text-2)}
.rule{width:180px;height:3px;background:var(--rose-500);margin:22px 0 20px;border-radius:2px}
.msg{font-size:44px;line-height:1.5;color:var(--text-2);letter-spacing:.03em;max-width:860px}
.msg em{font-style:normal;color:var(--text-1);font-weight:700}

/* 右欄：印章或補件項目 */
.aside{justify-self:end;align-self:center}
.stamp{position:relative;width:300px;height:300px;rotate:-10deg;color:var(--rose-500);opacity:.94}
.stamp.gold{color:var(--gold)}
.stamp svg{display:block;width:100%;height:100%;overflow:visible}
.stamp .r1{fill:none;stroke:currentColor;stroke-width:5}
.stamp .r2{fill:none;stroke:currentColor;stroke-width:1.8}
.stamp .tx{fill:currentColor;font-family:var(--serif);font-weight:900;font-size:62px;letter-spacing:.06em}
.stamp .arc{fill:currentColor;font-family:var(--mono);font-size:15px;letter-spacing:.2em}
.stamp .sm{fill:currentColor;font-family:var(--mono);font-size:19px;letter-spacing:.12em}

.items{width:520px;padding:28px 34px 22px;border-radius:16px;background:rgba(17,14,15,.88);border:1.5px solid var(--rose-line-1);
  box-shadow:inset 0 0 0 6px var(--ink-1),inset 0 0 0 7px rgba(255,46,139,.12)}
.items h3{display:flex;justify-content:space-between;align-items:baseline;font-size:28px;font-weight:500;letter-spacing:.18em;color:var(--rose-300);margin-bottom:14px}
.items h3 span{font-family:var(--mono);font-size:24px;letter-spacing:.08em;color:var(--text-3)}
.items ol{list-style:none;display:grid}
.items li{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;min-height:72px;border-top:1px solid var(--line-1);font-size:40px;font-weight:500;color:var(--text-1)}
.items li:first-child{border-top:0}
.items li i{font-style:normal;font-family:var(--mono);font-size:24px;color:var(--gold)}
.items li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items li.more span{color:var(--rose-300);font-weight:700}

.link{display:flex;align-items:center;gap:22px;padding-top:30px;border-top:1px solid var(--line-1);font-size:34px;color:var(--text-2);letter-spacing:.03em}
.link .k{flex:none;font-size:26px;font-weight:500;letter-spacing:.2em;color:var(--gold);padding:6px 16px;border:1.5px solid var(--gold-line);border-radius:8px}
.link .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 票根 */
.stub{position:relative;background:var(--ink-2);padding:84px 64px 64px;display:flex;flex-direction:column}
.stub::before{content:"";position:absolute;top:24px;bottom:24px;left:-2px;width:4px;background:radial-gradient(circle,var(--ink-0) 3.5px,transparent 4px) 50% 0/4px 20px repeat-y}
.sk{font-size:28px;letter-spacing:.24em;color:var(--text-3);font-weight:500}
.dl-d{font-family:var(--mono);font-size:52px;font-weight:500;letter-spacing:.04em;color:var(--text-1);margin-top:14px}
.dl-t{font-family:var(--mono);font-size:104px;font-weight:500;line-height:1.05;letter-spacing:.02em;color:var(--rose-300)}
.remain{display:inline-flex;align-items:center;gap:12px;margin-top:18px;height:56px;padding:0 22px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:32px;font-weight:700;letter-spacing:.06em;align-self:flex-start}
.remain[hidden]{display:none}
.remain::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}
.pts{display:flex;gap:16px;margin-top:34px}
.pts i{width:12px;height:12px;border-radius:50%;background:var(--ink-5)}
.pts i.on{background:var(--text-1);box-shadow:0 0 0 7px var(--rose-tint-3)}
.reply{margin-top:auto;border-radius:16px;background:var(--rose-500);color:#1A0911;padding:26px 28px 24px;text-align:center;box-shadow:0 18px 40px -18px rgba(255,46,139,.7)}
.reply small{display:block;font-size:26px;font-weight:500;letter-spacing:.16em;opacity:.78}
.reply b{display:block;font-family:var(--serif);font-size:58px;font-weight:900;letter-spacing:.06em;line-height:1.25;margin-top:2px}
.code{display:flex;height:44px;opacity:.42;margin-top:30px;overflow:hidden}
.code i{flex:none;display:block;background:var(--text-2)}
.admit{display:flex;justify-content:space-between;margin-top:auto;padding:18px 0;border-top:1.5px solid var(--gold-line);border-bottom:1.5px solid var(--gold-line);font-family:var(--mono);font-size:20px;letter-spacing:.3em;color:var(--gold)}
.admit+.reply{margin-top:34px}
.brand{margin-top:16px;font-family:var(--mono);font-size:19px;letter-spacing:.3em;color:var(--text-3);white-space:nowrap}

/* ── 3.2 確認稿：諮詢教材（下單／交付／解壓縮教學）──────────────────── */
.slip{width:500px;padding:30px 36px 26px;border-radius:16px;background:rgba(17,14,15,.88);border:1.5px solid var(--gold-line);
  box-shadow:inset 0 0 0 6px var(--ink-1),inset 0 0 0 7px rgba(217,184,119,.14)}
.slip h3{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;font-weight:500;letter-spacing:.2em;color:var(--gold);margin-bottom:10px}
.slip h3 span{font-family:var(--mono);font-size:22px;letter-spacing:.08em;color:var(--text-3)}
.slip dl{display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:0}
.slip dt,.slip dd{min-height:76px;display:flex;align-items:center;border-top:1px solid var(--line-1)}
.slip dt:first-of-type,.slip dd:first-of-type{border-top:0}
.slip dt{font-size:26px;letter-spacing:.14em;color:var(--text-3)}
.slip dd{font-size:36px;font-weight:700;color:var(--text-1);line-height:1.25;padding:10px 0}
.slip dd.mat{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.02em}
.slip dd.amt{font-family:var(--mono);font-weight:500;font-size:44px;color:var(--rose-300)}
.slip dd.amt small{font-family:var(--sans);font-size:24px;color:var(--text-3);margin-left:10px;font-weight:500}
.file{width:500px;padding:34px 36px 30px;border-radius:16px;background:rgba(17,14,15,.88);border:1.5px solid var(--rose-line-1);
  box-shadow:inset 0 0 0 6px var(--ink-1),inset 0 0 0 7px rgba(255,46,139,.12);display:flex;flex-direction:column;gap:22px}
.file .fx{display:flex;align-items:center;gap:26px}
.file .ico{flex:none;position:relative;width:104px;height:128px;border-radius:12px;background:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line-2)}
.file .ico::before{content:"";position:absolute;right:0;top:0;width:32px;height:32px;background:linear-gradient(225deg,var(--ink-0) 50%,var(--ink-5) 50%);border-radius:0 12px 0 6px}
.file .ico::after{content:"";position:absolute;left:46px;top:14px;width:12px;height:66px;background:repeating-linear-gradient(180deg,var(--gold) 0 8px,transparent 8px 14px)}
.file .ico b{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:.08em;color:var(--rose-300)}
.file .fn{font-size:29px;font-weight:700;line-height:1.3;color:var(--text-1);word-break:break-all}
.file .fm{font-family:var(--mono);font-size:24px;color:var(--text-3);margin-top:8px;letter-spacing:.04em}
.file .ok{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--line-1)}
.file .ok span{display:block;position:relative;padding-left:42px;font-size:26px;line-height:1.4;color:var(--text-2)}
 .file .ok span::before{content:"";position:absolute;left:0;top:3px;width:28px;height:28px;border-radius:50%;background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.file .ok span.warn::before{background:var(--rose-tint-2);box-shadow:inset 0 0 0 2px var(--rose-500)}
.file .ok span em{font-style:normal;color:var(--text-1);font-weight:700}
.big-word{font-family:var(--serif);font-size:96px;font-weight:900;line-height:1.1;color:var(--rose-300);margin-top:10px;letter-spacing:.06em}
.dl-d.sm{font-size:40px}
/* 解壓縮教學：主票面改為三欄步驟 */
body[data-type=unzip] .body{display:flex;flex-direction:column;align-items:stretch;gap:26px;margin:22px 0 18px}
body[data-type=unzip] .ttl{font-size:108px;margin:14px 0 4px}
body[data-type=unzip] .who,body[data-type=unzip] .rule,body[data-type=unzip] .msg{display:none}
body[data-type=unzip] .aside{justify-self:stretch;align-self:stretch;width:100%}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.os{position:relative;padding:28px 30px 26px;border-radius:16px;background:rgba(25,21,22,.92);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.os.m{box-shadow:inset 0 0 0 1.5px var(--rose-line-1);background:linear-gradient(180deg,rgba(255,46,139,.08),rgba(255,46,139,0) 70%),rgba(25,21,22,.92)}
.os h4{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700;letter-spacing:.06em;color:var(--text-1);margin-bottom:16px}
.os h4 .k{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.2em;color:var(--gold);padding:4px 10px;border:1.5px solid var(--gold-line);border-radius:6px}
.os.m h4 .k{color:var(--rose-300);border-color:var(--rose-line-1)}
.os ol{list-style:none;display:grid;gap:12px;counter-reset:s}
.os li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start;font-size:29px;line-height:1.42;color:var(--text-2)}
.os li::before{content:counter(s);display:grid;place-content:center;width:34px;height:34px;margin-top:4px;border-radius:50%;background:var(--ink-0);box-shadow:inset 0 0 0 1.5px var(--gold);font-family:var(--mono);font-size:20px;color:var(--gold)}
.os li b{color:var(--text-1);font-weight:700}
.os li kbd{font-family:var(--sans);font-size:25px;font-weight:700;color:var(--text-1);padding:1px 10px;border-radius:6px;background:var(--ink-3);box-shadow:inset 0 -2px 0 var(--ink-0),inset 0 0 0 1.5px var(--line-2);white-space:nowrap}
.os.m li::before{content:"!";box-shadow:inset 0 0 0 1.5px var(--rose-500);color:var(--rose-300)}
.os .tip{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2);font-size:24px;line-height:1.45;color:var(--text-3)}
.os .tip b{color:var(--gold);font-weight:500}

body[data-type=matorder] .ttl,body[data-type=matdeliver] .ttl{font-size:112px;white-space:nowrap;margin:16px 0 10px}
body[data-type=matorder] .who .nm,body[data-type=matdeliver] .who .nm{font-size:76px}
body[data-type=matorder] .who .sf,body[data-type=matdeliver] .who .sf{font-size:46px}
body[data-type=matorder] .rule,body[data-type=matdeliver] .rule{margin:18px 0 16px}
body[data-type=matorder] .msg,body[data-type=matdeliver] .msg{font-size:34px;max-width:520px}
body[data-type=matorder] .body,body[data-type=matdeliver] .body{gap:36px;margin:18px 0 16px}
body[data-type=unzip] .ttl{font-size:92px!important;margin:12px 0 0!important}
body[data-type=unzip] .main{padding:68px 92px 60px}
body[data-type=unzip] .link{display:none}
body[data-type=unzip] .tag{height:46px;font-size:26px}
body[data-type=unzip] .body{margin:8px 0 0!important;gap:22px!important}
body[data-type=unzip] .reply b{font-size:46px}
body[data-type=matorder] .reply b,body[data-type=matdeliver] .reply b{font-size:40px;letter-spacing:.02em}
.os{padding:24px 26px 22px}
.os h4{font-size:30px;margin-bottom:14px}
.os li{font-size:26px;grid-template-columns:42px minmax(0,1fr)}
.os li kbd{font-size:23px}
.os .tip{font-size:22px;margin-top:14px;padding-top:12px}

</style>
</head>
<body>
<div class="stage">
  <article class="tk" id="card" aria-label="通知圖卡">
    <i class="notch t"></i><i class="notch b"></i>
    <section class="main">

  }
  function stampSVG(st, date) {
    var arc = 'G.R.A.C.E ACADEMY', out = '', span = 1.9, a0 = -Math.PI / 2 - span / 2;
    for (var q = 0; q < arc.length; q++) {
      var ang = a0 + span * (q + 0.5) / arc.length, deg = (ang + Math.PI / 2) * 180 / Math.PI;
      out += '<text class="arc" text-anchor="middle" transform="rotate(' + deg.toFixed(2) + ' 150 150)" x="150" y="44">' + esc(arc[q]) + '</text>';
    }
    return '<div class="stamp ' + (st.tone === 'gold' ? 'gold' : '') + '"><svg viewBox="0 0 300 300" aria-hidden="true">' +
      '<circle class="r1" cx="150" cy="150" r="138"/><circle class="r2" cx="150" cy="150" r="122"/>' + out +
      '<text class="tx" text-anchor="middle" x="150" y="140">' + esc(st.text[0]) + '</text>' +
      '<text class="tx" text-anchor="middle" x="150" y="206">' + esc(st.text[1]) + '</text>' +
      '<text class="sm" text-anchor="middle" x="150" y="248">' + esc(date) + '</text></svg></div>';
  }

  function render(input) {
    var d = Object.assign({}, DEFAULTS, input || {});
    var T = TYPES[d.type] || TYPES.notice;
    document.body.removeAttribute('data-ready');
    document.body.dataset.type = d.type;

    $('ed-en').textContent = T.en; $('ed-no').textContent = T.no;
    $('tag').textContent = d.tag || T.tag;
    $('ttl').textContent = d.title || T.title;
    $('nm').textContent = d.name || ''; $('sf').textContent = d.suffix;
    $('msg').innerHTML = d.msg ? esc(d.msg) : T.msg;
    $('link-k').textContent = d.linkKey; $('link-v').textContent = d.link;
    $('reply-k').textContent = d.replyKey; $('reply-v').textContent = d.reply;

    var dl = parseDT(d.deadline);
    $('dl-k').textContent = T.dlKey;
    $('dl-d').textContent = dl ? fmtDate(dl) : String(d.deadline || '');
    $('dl-t').textContent = dl ? fmtTime(dl) : '';

    var rm = $('remain');
    if (T.remain && dl) {
      var now = parseDT(d.now) || new Date();
      rm.textContent = d.remain || remainText(dl, now); rm.hidden = false;
    } else rm.hidden = true;

    var pts = ''; for (var i = 1; i <= 3; i++) pts += '<i class="' + (i <= T.pts ? 'on' : '') + '"></i>';
    $('pts').innerHTML = pts;
    $('admit-y').textContent = dl ? 'No. ' + String(dl.getFullYear()) + pad(dl.getMonth() + 1) + pad(dl.getDate()) : '';
    $('code').innerHTML = seedCode((d.name || '') + (d.deadline || '') + d.type);

    var aside = $('aside');
    if (T.noDate) {
      $('dl-d').textContent = ''; $('dl-t').innerHTML = '<span class="big-word">電腦</span>';
      $('dl-d').classList.add('sm'); $('dl-d').textContent = 'Windows／Mac';
      $('admit-y').textContent = 'STEP GUIDE';
    }
    if (T.aside === 'slip') {
      aside.innerHTML = '<div class="slip"><h3>下單明細<span>' + esc(d.orderNo || 'ORDER') + '</span></h3><dl>' +
        '<dt>教材</dt><dd class="mat">' + esc(d.material || '') + '</dd>' +
        '<dt>下單項目</dt><dd>' + esc(d.product || '') + '</dd>' +
        '<dt>金額</dt><dd class="amt">' + esc(d.amount || '') + '<small>課費</small></dd></dl></div>';
    } else if (T.aside === 'file') {
      aside.innerHTML = '<div class="file"><div class="fx"><div class="ico"><b>ZIP</b></div><div><div class="fn">' + esc(d.fileName || '') + '</div><div class="fm">' + esc(d.fileMeta || '') + '</div></div></div>' +
        '<div class="ok"><span>先<em>下載到電腦</em>，再解壓縮開啟</span><span>同步備份到自己的雲端</span><span class="warn">一次性交付，遺失不補發</span></div></div>';
    } else if (T.aside === 'steps') {
      aside.innerHTML = '<div class="steps">' +
        '<div class="os"><h4><span class="k">WIN</span>Windows</h4><ol><li><span>在 ZIP 檔按<b>右鍵</b></span></li><li><span>選 <kbd>全部解壓縮</kbd></span></li><li><span>選擇保存位置 → 按 <kbd>解壓縮</kbd></span></li><li><span>打開資料夾，雙擊 <b>index.html</b></span></li></ol>' +
        '<p class="tip"><b>無法解壓縮？</b>安裝 7-Zip → 右鍵 → 7-Zip → 解壓縮到「檔名」</p></div>' +
        '<div class="os"><h4><span class="k">MAC</span>Mac</h4><ol><li><span><b>雙擊</b> ZIP 檔</span></li><li><span>同位置會出現同名<b>資料夾</b></span></li><li><span>在 <b>index</b> 按右鍵 → <kbd>打開檔案的應用程式</kbd> → Chrome</span></li></ol>' +
        '<p class="tip"><b>提醒</b>資料夾內的檔案不要移動或刪除</p></div>' +
        '<div class="os m"><h4><span class="k">注意</span>手機</h4><ol><li><span>手機只能<b>預覽或轉存</b>，無法正常使用</span></li><li><span>請改用<b>電腦</b>下載與開啟</span></li><li><span>不要在 ZIP 裡直接點開，<b>先完整解壓縮</b></span></li></ol>' +
        '<p class="tip"><b>卡住了？</b>截圖目前畫面回傳官方 LINE</p></div></div>';
    } else if (T.items) {
      var list = (Array.isArray(d.items) ? d.items : String(d.items || '').split('|')).map(function (s) { return String(s).trim(); }).filter(Boolean);
      var max = Math.max(1, d.maxItems || 5), shown = list, more = 0;
      if (list.length > max) { shown = list.slice(0, max - 1); more = list.length; }
      var li = shown.map(function (s, k) { return '<li><i>' + pad(k + 1) + '</i><span>' + esc(s) + '</span></li>'; }).join('');
      if (more) li += '<li class="more"><i>…</i><span>等 ' + more + ' 項</span></li>';
      aside.innerHTML = '<div class="items"><h3>補件項目<span>' + pad(list.length) + '</span></h3><ol>' + li + '</ol></div>';
    } else {
      aside.innerHTML = stampSVG(T.stamp, dl ? fmtDate(dl) : '');
    }

    var text = document.body.innerText;
    var fontChecks = [
      '900 168px "Noto Serif TC"', '900 168px "Noto Serif CJK TC"',
      '500 40px "Noto Sans TC"', '500 40px "Noto Sans CJK TC"'
    ];
    var img = $('logo');
    var imgReady = img.complete ? Promise.resolve() : new Promise(function (r) { img.onload = img.onerror = r; });
    var fontLoads = fontChecks.map(function (f) { return document.fonts.load(f, text).catch(function () { return []; }); });
    return Promise.all([imgReady, document.fonts.ready].concat(fontLoads)).then(function () {
      var ok = fontChecks.some(function (f) { return document.fonts.check(f, '學姊'); });
      document.body.dataset.fontOk = ok ? '1' : '0';
      document.body.dataset.ready = '1';
      return { fontOk: ok };
    });
  }

  window.renderCard = render;
  window.NOTICE_TYPES = TYPES;
  render(Object.assign({}, window.CARD_DATA || {}, fromQuery()));
})();
</script>
</body>
</html>
