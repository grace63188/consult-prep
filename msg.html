<style>

</main>

      var mn = el('div'); mn.style.minWidth = '0'; mn.appendChild(el('div', 'nm', f.name));
      if (it.off && !it.done) { var pb = el('div', 'pb'), bar = el('i'); bar.style.width = Math.round(it.off / f.size * 100) + '%'; pb.appendChild(bar); mn.appendChild(pb); }
      mn.appendChild(el('div', 's' + (it.done ? ' ok' : it.err ? ' err' : ''), it.done ? '已上傳・' + size(f.size) : it.err ? it.err : it.off ? '上傳中 ' + Math.round(it.off / f.size * 100) + '%・' + size(it.off) + '／' + size(f.size) : '待送出・' + size(f.size)));
      w.appendChild(tn); w.appendChild(mn);
      if (it.err) { var rt = el('button', 'rt', '重試'); rt.type = 'button'; rt.onclick = function () { $('send').click(); }; w.appendChild(rt); }
      else if (!busy) { var x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', '移除 ' + f.name); x.onclick = function () { if (it.url) URL.revokeObjectURL(it.url); files.splice(i, 1); drawFiles(); }; w.appendChild(x); }
      else w.appendChild(el('span'));
      box.appendChild(w);
    });
  }
  function st(m, err) { $('st').textContent = m || ''; $('st').className = 'st' + (err ? ' err' : ''); }
  function addFiles(list) {
    Array.prototype.forEach.call(list || [], function (f) {
      if (files.length >= (r ? 10 : 5)) { st('最多附 ' + (r ? 10 : 5) + ' 個檔案', true); return; }
      if (f.size > 50 * 1024 * 1024) { st('「' + f.name + '」超過 50 MB', true); return; }
      if (!EXT.test(f.name)) { st('「' + f.name + '」格式不支援', true); return; }
      var it = { file: f, off: 0 }; try { if (IMG.test(f.name) && window.URL) it.url = URL.createObjectURL(f); } catch (e) { /* 無預覽 */ }
      files.push(it);
    });
    drawFiles();
  }
  function upload(it, done, onErr) {
    var f = it.file;
    var go = function () {
      if (it.off >= f.size) { call('lms_msg_up_finish', { uploadId: it.uploadId }, function (r) { it.done = true; it.ref = r.file; drawFiles(); done(); }, function (e) { it.err = e; onErr(e); }); return; }
      var end = Math.min(f.size, it.off + it.step), rd = new FileReader();
      rd.onload = function () { var data = String(rd.result).replace(/^data:[^,]*,/, ''); call('lms_msg_up_chunk', { uploadId: it.uploadId, offset: it.off, end: end, total: f.size, data: data }, function () { it.off = end; drawFiles(); go(); }, function (e) { if (/失效|重新上傳/.test(e)) { it.uploadId = ''; it.off = 0; } it.err = e; onErr(e); }); };
      rd.onerror = function () { it.err = '讀取檔案失敗'; onErr(it.err); };
      rd.readAsDataURL(f.slice(it.off, end));
    };
    it.err = '';
    if (it.uploadId) { go(); return; }
    call('lms_msg_up_begin', { name: f.name, size: f.size }, function (b) { it.uploadId = b.uploadId; it.step = b.chunkBytes || 2 * 1024 * 1024; it.off = 0; go(); }, function (e) { it.err = e; onErr(e); });
  }
  if (r) { upMode(); return; }
  if (!t) { fail('連結不完整，請回到 LINE 重新點「諮詢前準備」'); return; }
  if (!C.GAS_URL) { fail('預覽模式：正式網站會讀取學姐的留言'); return; }
  call('lms_msg_get', {}, function (d) {
    D = d; $('sp').style.display = 'none'; $('app').hidden = false;
    $('ttl').textContent = (d.name ? d.name + '學姐，' : '') + '諮詢前準備';
    $('sub').textContent = d.counsel && d.counsel.at ? '諮詢：' + fmt(d.counsel.at) + '　' + (d.counsel.type || '') : '尚未預約諮詢；預約後這裡的內容會自動帶到該場諮詢';
    F = flat(d.form); A = F.map(function (x, k) { var v = (d.answers || [])[k]; return x.type === 'multi' ? (Array.isArray(v) ? v.slice() : []) : (v == null ? '' : String(v)); });
    drawQs(); draw(d);
  }, function (e) { fail(e); });
  /* 拍照只在觸控裝置顯示（桌機沒有相機選單） */
  try { if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) { document.querySelector('.pick .cam').hidden = true; document.querySelector('.pick').classList.add('two'); } } catch (e) { /* ignore */ }
  ['file', 'fileImg', 'fileCam'].forEach(function (id) { $(id).addEventListener('change', function () { addFiles(this.files); this.value = ''; }); });
  $('send').addEventListener('click', function () {
    if (busy) return; var text = $('txt').value.trim();
    var hasAns = F.length && A.some(function (v) { return Array.isArray(v) ? v.length : String(v || '').trim(); });
    var miss = F.filter(function (x, k) { return x.req && !(Array.isArray(A[k]) ? A[k].length : String(A[k] || '').trim()); });
    if (miss.length) { st('「' + miss[0].t + '」為必填', true); return; }
    if (!text && !files.length && !hasAns) { st('請先寫下近況、回答問題或附上檔案', true); return; }
    busy = true; $('send').disabled = true; st('送出中…');
    var errF = function (e) { busy = false; $('send').disabled = false; drawFiles(); st(/保留/.test(e) ? e : e + '（按「重試」接續，已上傳的部分會保留）', true); };
    ansDirty = ansDirty || !!hasAns;
    saveAns(function (e) {
      if (e) { busy = false; $('send').disabled = false; return; }
      var i = 0;
      (function nextFile() {
        while (i < files.length && files[i].done) i++;
        if (i >= files.length) {
          if (!text && !files.length) { busy = false; $('send').disabled = false; st('已送出回答，校長諮詢前會先看過🤍'); return; }
          st('送出中…');
          call('lms_msg_post', { text: text, files: files.map(function (it) { return it.ref; }) }, function () { files.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); }); files = []; drawFiles(); $('txt').value = ''; st('已送出，校長諮詢前會先看過🤍'); call('lms_msg_get', {}, function (d) { draw(d); }, function () {}); busy = false; $('send').disabled = false; }, errF);
          return;
        }
        st('上傳「' + files[i].file.name + '」…'); drawFiles();
        upload(files[i], function () { i++; nextFile(); }, errF);
      })();
    });
  });
})();
</script>
