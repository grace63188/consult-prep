  --ink-3:   #211C1D;  /* 卡片內層、展開區、表格表頭 */
  --ink-4:   #2B2526;  /* 浮層：下拉選單、對話框、toast */
  --ink-5:   #352E2F;  /* 浮層 hover 列 */
  --scrim:   rgba(8, 6, 7, 0.72); /* 對話框遮罩 */

  /* ── 文字（暖白三層＋停用） ─────────────────────────────────────── */
  --text-1:  #F6EFEA;  /* 主要文字　對 ink-1 16.9:1 */
  --text-2:  #CDC2BC;  /* 次要文字　對 ink-1 11.0:1 */
  --text-3:  #A0948F;  /* 輔助說明　對 ink-1 6.5:1、對 ink-4 5.1:1 */
  --text-disabled: #6E6461; /* 僅限停用狀態，不承載必要資訊 3.4:1 */

  /* ── 桃紅主色（只用於按鈕、進度、選取、完成標記） ───────────────── */
  --rose-500: #FF2E8B;  /* 主色　對 ink-1 5.5:1、對 ink-2 5.2:1 */
  --rose-400: #FF4C9C;  /* hover（暗底上 hover 變亮） */
  --rose-600: #E8247E;  /* pressed　桃紅底深字 4.6:1 */
  --rose-300: #FF77B2;  /* 桃紅文字、連結、選取標籤　對 ink-2 7.4:1 */
  --rose-ink: #1A0911;  /* 桃紅底上的文字　對 rose-500 5.5:1（白字僅 3.5:1，不採用） */
  --rose-tint-1: rgba(255, 46, 139, 0.08);  /* 選取卡片底 */
  --rose-tint-2: rgba(255, 46, 139, 0.14);  /* 選取 hover、部分完成底 */
  --rose-tint-3: rgba(255, 46, 139, 0.22);  /* 強調徽章底 */
  --rose-line-1: rgba(255, 46, 139, 0.32);  /* 選取邊框（淡） */
  --rose-line-2: rgba(255, 46, 139, 0.64);  /* 選取邊框（明確） */
  --rose-glow:   0 0 0 4px rgba(255, 46, 139, 0.18); /* 選取外光，僅用於主按鈕 focus 與勾選完成 */

  /* ── 語意色（降飽和，與桃紅錯開色相） ───────────────────────────── */
  --success-500: #5CCFA3;  /* 玉石綠　對 ink-1 10.0:1 */
  --success-tint: rgba(92, 207, 163, 0.12);
  --success-line: rgba(92, 207, 163, 0.40);
  --warning-500: #E8B85C;  /* 香檳金　對 ink-1 10.5:1 */
  --warning-tint: rgba(232, 184, 92, 0.12);
  --warning-line: rgba(232, 184, 92, 0.40);
  --error-500:   #FF7A5C;  /* 珊瑚橘紅（刻意偏橘，與桃紅區隔）　對 ink-1 7.5:1 */
  --error-tint:  rgba(255, 122, 92, 0.12);
  --error-line:  rgba(255, 122, 92, 0.55);
  --info-500:    #9DB8E8;  /* 霧藍　對 ink-1 9.6:1 */
  --info-tint:   rgba(157, 184, 232, 0.10);

  /* ── 邊線（低透明暖白，看得到但不搶眼） ─────────────────────────── */
  --line-1: rgba(246, 239, 234, 0.07);  /* 區隔線、卡片描邊 */
  --line-2: rgba(246, 239, 234, 0.12);  /* 一般邊框 */
  --line-3: rgba(246, 239, 234, 0.40);  /* 輸入框、勾選框邊框　對 ink-2 3.2:1（非文字 3:1） */
  --line-4: rgba(246, 239, 234, 0.52);  /* 輸入框 hover　4.7:1 */
  --focus-ring: 0 0 0 2px var(--ink-1), 0 0 0 4px var(--rose-300); /* 2px 間隔＋2px 環 */

  /* ── 字體 ──────────────────────────────────────────────────────── */
  --font-serif: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;   /* 標題、大數字 */
  --font-sans:  'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; /* 內文、介面 */
  --font-mono:  'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace; /* 日期、編號、表格數字 */

  /* ── 字級（手機優先，比例約 1.25；桌機 ≥768px 放大標題） ─────────── */
  --fs-caption: 0.8125rem; /* 13px 標籤、徽章、輔助說明 */
  --fs-small:   0.875rem;  /* 14px 次要文字 */
  --fs-body:    1rem;      /* 16px 內文、輸入框（防 iOS 自動縮放） */
  --fs-lead:    1.125rem;  /* 18px 引言、卡片標題 */
  --fs-h3:      1.25rem;   /* 20px */
  --fs-h2:      1.5rem;    /* 24px */
  --fs-h1:      1.875rem;  /* 30px */
  --fs-display: 2.375rem;  /* 38px 大數字（進度百分比） */
  --lh-tight: 1.3;
  --lh-body:  1.7;   /* 中文內文需較寬行高 */
  --tracking-title: 0.02em;  /* 中文襯線標題微放字距 */
  --tracking-label: 0.08em;  /* 小標籤 */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --measure: 34em; /* 中文行長上限約 34 字 */

  /* ── 間距（4px 基準） ──────────────────────────────────────────── */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;   /* 手機左右留白 */
  --sp-5: 20px;
  --sp-6: 24px;   /* 卡片內距 */
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;  /* 區塊間距 */
  --sp-16: 64px;
  --gutter: var(--sp-4);
  --container: 720px;   /* 前台表單欄寬 */
  --container-wide: 1200px; /* 後台 */

  /* ── 圓角（同心原則：外 = 內 + 內距） ─────────────────────────── */
  --r-xs: 6px;    /* 徽章、勾選框 */
  --r-sm: 10px;   /* 按鈕、輸入框 */
  --r-md: 14px;   /* 單選卡、上傳區 */
  --r-lg: 20px;   /* 卡片 */
  --r-xl: 28px;   /* 對話框 */
  --r-pill: 999px;

  /* ── 陰影（暗底以描邊環為主，深度陰影只給浮層） ─────────────────── */
  --shadow-ring:    0 0 0 1px var(--line-1);
  --shadow-ring-hi: 0 0 0 1px var(--line-2);
  --shadow-float:   0 0 0 1px var(--line-2), 0 12px 32px -8px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-dialog:  0 0 0 1px var(--line-2), 0 24px 64px -12px rgba(0, 0, 0, 0.75);
  --highlight-top:  inset 0 1px 0 rgba(246, 239, 234, 0.04); /* 卡片頂緣微光，精品感細節 */

  /* ── 動態 ──────────────────────────────────────────────────────── */
  --dur-instant: 100ms;  /* hover、列 hover、tab 切換 */
  --dur-fast:    150ms;  /* 按壓、勾選、切換 */
  --dur-base:    200ms;  /* 下拉、toast、tooltip */
  --dur-slow:    280ms;  /* 對話框、展開卡片進場 */
  --dur-exit:    160ms;  /* 離場（約進場 60%） */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);      /* 進場、互動 */
  --ease-in:     cubic-bezier(0.55, 0, 1, 0.45);      /* 離場 */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);     /* 畫面內位移 */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);        /* 顏色、圖示交叉淡入 */
  --press-scale: 0.97;
  --stagger: 40ms;

  /* ── 層級 ──────────────────────────────────────────────────────── */
  --z-sticky: 10;
  --z-dropdown: 20;
  --z-toast: 40;
  --z-dialog: 100;

  /* ── 尺寸 ──────────────────────────────────────────────────────── */
  --hit-min: 44px;
  --control-h: 48px;  /* 按鈕、輸入框高 */
  --icon-sm: 16px;
  --icon-md: 20px;
}

@media (min-width: 768px) {
  :root {
    --fs-h2: 1.75rem;   /* 28px */
    --fs-h1: 2.25rem;   /* 36px */
    --fs-display: 3rem; /* 48px */
    --gutter: var(--sp-8);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-slow: 150ms;
    --press-scale: 1;
    --stagger: 0ms;
  }
}

/* ── 基底 ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ink-1);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-title);
  text-wrap: balance;
  margin: 0;
}
p { text-wrap: pretty; }
.num, time, .date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
::selection { background: var(--rose-tint-3); color: var(--text-1); }

/* ── 前台版面 ───────────────────────────────────────────────────── */
[hidden]{display:none!important}
html{scroll-padding-top:120px}
body{min-height:100dvh}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;background:var(--rose-500);color:var(--rose-ink);padding:10px 16px;border-radius:var(--r-sm);z-index:200;font-weight:600;text-decoration:none}
.skip:focus{left:16px}
a{color:var(--rose-300)}
button{font:inherit;color:inherit}

/* 頁首 */
.bar{position:sticky;top:0;z-index:var(--z-sticky);background:var(--ink-1);border-bottom:1px solid var(--line-1)}
.bar-in{max-width:calc(var(--container) + var(--gutter)*2);margin:0 auto;padding:var(--sp-2) var(--gutter);display:flex;align-items:center;gap:var(--sp-3);min-height:60px}
.bar-mark{flex:none;width:44px;height:25px;opacity:.9}
.bar-cur{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.bar-cur .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-cur .meta .saved-warn{color:var(--warning-500)}
.bar-cur b{font-family:var(--font-serif);font-weight:600;font-size:var(--fs-body);letter-spacing:var(--tracking-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-btn{flex:none;display:inline-flex;align-items:center;gap:var(--sp-2);min-height:44px;padding:0 var(--sp-3) 0 var(--sp-2);border-radius:var(--r-pill);background:var(--ink-2);border:1px solid transparent;box-shadow:var(--shadow-ring-hi);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition-property:background-color,scale;transition-duration:var(--dur-instant),var(--dur-fast);transition-timing-function:var(--ease-out)}
.toc-btn:active{scale:var(--btn-press)}
@media (hover:hover){.toc-btn:hover{background:var(--ink-3)}}
.toc-btn .mini{width:30px;height:30px;rotate:-90deg}
.toc-btn .mini circle{fill:none;stroke-width:3}
.toc-btn .mini .trk{stroke:var(--ink-0)}
.toc-btn .mini .val{stroke:var(--rose-500);stroke-linecap:round;transition:stroke-dashoffset 400ms linear}
.toc-btn .pct{font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--text-1);min-width:2.6em;text-align:right}
.toc-btn .lbl{font-size:var(--fs-caption);color:var(--text-2)}
.bar .track{height:3px;border-radius:0;box-shadow:none;background:transparent}
.bar .fill{border-radius:0 2px 2px 0}

.shell{max-width:calc(var(--container) + var(--gutter)*2);margin:0 auto;padding:0 var(--gutter)}
.side{display:none}
@media (min-width:1080px){
  .bar-in,.shell{max-width:calc(240px + var(--sp-10) + var(--container) + var(--gutter)*2)}
  .shell{display:grid;grid-template-columns:240px minmax(0,var(--container));gap:var(--sp-10)}
  .side{display:block;position:sticky;top:84px;align-self:start;padding-top:var(--sp-10);max-height:calc(100dvh - 84px);overflow:auto;overscroll-behavior:contain}
  .toc-btn .lbl{display:none}
}
main{min-width:0;padding:var(--sp-8) 0 calc(var(--sp-16) + env(safe-area-inset-bottom))}
@media (min-width:768px){main{padding-top:var(--sp-12)}}
.view{display:flex;flex-direction:column;gap:var(--sp-8)}
@media (prefers-reduced-motion:no-preference){.view.enter{animation:viewin var(--dur-base) var(--ease-out) both}}
@keyframes viewin{from{opacity:0}}

/* 標題區 */
.eyebrow{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-caption);letter-spacing:var(--tracking-label);color:var(--text-3);font-weight:500}
.eyebrow .num{color:var(--text-2)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--rose-tint-2);color:var(--rose-300);font-size:12px;font-weight:600;letter-spacing:.08em}
.head{display:flex;flex-direction:column;gap:var(--sp-3)}
.head h1{font-size:var(--fs-h1);font-weight:700}
.head .desc{margin:0;color:var(--text-2);max-width:var(--measure)}
h1:focus{outline:none;box-shadow:none}

/* 入口頁：橫式典藏票（方向 B）；頁首、目錄、進度於入口不顯示 */
body.is-intro .bar,body.is-intro .side{display:none}
@media (min-width:768px){body.is-intro .shell{display:block;max-width:calc(1040px + var(--gutter)*2)}}
body.is-intro main{padding-top:0}
.intro-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 40% at 50% -8%,rgba(255,46,139,.07),rgba(255,46,139,0) 70%),var(--ink-0)}
.intro{display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - 120px);padding:var(--sp-8) 0 var(--sp-4)}
/* 票體：手機＝左側票根欄＋主票面；桌機＝主票面＋右側票根 */
.tk{--stub-w:clamp(224px,24vw,280px);position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);width:100%;background:var(--ink-1);border-radius:var(--r-md);overflow:hidden;
  box-shadow:0 0 0 1px var(--line-1),0 30px 60px -24px rgba(0,0,0,.7)}
.tk-side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-5) 0;background:var(--ink-2)}
.tk-side::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:2px;background:radial-gradient(circle,var(--ink-0) 1.5px,transparent 2px) 50% 0/2px 8px repeat-y}
.tk-side .v{writing-mode:vertical-rl;font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--text-3);white-space:nowrap}
.tk-side .v.no{color:var(--rose-300)}
.tk-dot{width:6px;height:6px;border-radius:50%;background:var(--rose-500);transition:background-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out)}
.tk.validated .tk-dot{background:var(--text-1);box-shadow:0 0 0 4px var(--rose-tint-3)}
.tk-main{position:relative;isolation:isolate;padding:var(--sp-6) var(--sp-5) var(--sp-5)}
/* 防偽紋：桃紅 5% 同心圓，僅主票面右半 */
.tk-main::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:repeating-radial-gradient(circle at 112% 50%,rgba(255,46,139,.05) 0 1px,transparent 1px 7px);
  -webkit-mask:linear-gradient(90deg,transparent 30%,#000 100%);mask:linear-gradient(90deg,transparent 30%,#000 100%)}
/* 雙線框 */
.tk-main::after{content:"";position:absolute;inset:10px;z-index:-1;border:1px solid var(--line-2);border-radius:6px;pointer-events:none;
  box-shadow:inset 0 0 0 3px var(--ink-1),inset 0 0 0 4px rgba(233,211,203,.2)}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.tk .in-logo-btn{all:unset;flex:none;cursor:pointer;border-radius:var(--r-xs)}
.tk .in-logo-btn:focus-visible{box-shadow:var(--focus-ring)}
.tk .in-logo{width:96px;height:auto;display:block}
.tk-ed{font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;color:var(--text-3);text-align:right}
.tk h1{font-size:clamp(1.5rem,7.4vw,1.875rem);font-weight:700;line-height:1.25;letter-spacing:.02em;margin:var(--sp-3) 0 var(--sp-5)}
.tk h1 .bk{color:var(--text-3);font-weight:500}
.tk-secs{display:grid;gap:var(--sp-4)}
.tk-sec .in-k{display:block;font-size:var(--fs-caption);font-weight:500;letter-spacing:var(--tracking-label);color:var(--rose-300);margin-bottom:2px}
.tk-sec p{margin:0;color:var(--text-2);font-size:.9375rem;line-height:1.72;max-width:30em}
.tk-mact{margin-top:var(--sp-6)}
.in-act{display:flex;flex-direction:column;align-items:stretch;gap:var(--sp-2)}
.in-meta{margin:0;font-size:var(--fs-caption);color:var(--text-3);text-align:center}
.in-meta time{color:var(--text-2)}
.in-meta .nb{display:inline-block;white-space:nowrap}
.in-alt{align-self:center}
.tk-stub{display:contents}
.tk-foot{display:none}
.tk-foot dl{margin:0}
/* 掃光：窄暖白斜光帶，僅儀式時由 JS 驅動一次 */
.tk-sheen{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;border-radius:inherit}
.tk-sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:var(--bw,96px);opacity:0;transform:translateX(-100%) skewX(-14deg);mix-blend-mode:screen;
  background:linear-gradient(90deg,rgba(255,244,238,0) 0%,rgba(233,211,203,.04) 30%,rgba(255,240,236,.12) 50%,rgba(231,179,198,.04) 70%,rgba(255,244,238,0) 100%)}
@media (max-width:359.98px){.tk-ed{display:none}.tk-main{padding-inline:var(--sp-4)}}
@media (min-width:768px){
  .intro{padding-top:var(--sp-12)}
  .tk{grid-template-columns:minmax(0,1fr) var(--stub-w);min-height:440px}
  .tk::before,.tk::after{content:"";position:absolute;z-index:2;right:calc(var(--stub-w) - 12px);width:24px;height:24px;border-radius:50%;background:var(--ink-0)}
  .tk::before{top:-12px}.tk::after{bottom:-12px}
  .tk-side{display:none}
  .tk-main{padding:var(--sp-10) var(--sp-10) var(--sp-8)}
  .tk-main::after{inset:14px}
  .tk .in-logo{width:120px}
  .tk h1{font-size:2.5rem;margin:var(--sp-4) 0 var(--sp-8)}
  .tk-sec p{font-size:var(--fs-body)}
  .tk-mact{display:none}
  .tk-stub{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp-8);padding:var(--sp-10) var(--sp-6);background:var(--ink-2)}
  .tk-stub::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:radial-gradient(circle,var(--ink-0) 2px,transparent 2.5px) 50% 0/2px 10px repeat-y}
  .tk-foot{display:block}
  .tk-foot dl{display:grid;gap:var(--sp-4)}
  .tk-foot dt{font-size:11px;letter-spacing:.2em;color:var(--text-3)}
  .tk-foot dd{margin:2px 0 0;font-family:var(--font-mono);font-size:1.125rem;letter-spacing:.06em;color:var(--text-1)}
  .tk-foot dd.no{color:var(--rose-300);font-size:1.5rem}
  .tk-code{display:flex;height:36px;opacity:.5;margin-top:var(--sp-5);overflow:hidden}
  .tk-code i{flex:none;display:block;width:var(--w);margin-right:var(--g);background:var(--text-2)}
}
@media (min-width:1024px){
  .tk-main{padding:var(--sp-12) var(--sp-12) var(--sp-10)}
  .tk .in-logo{width:128px}
  .tk h1{font-size:2.75rem}
  .tk-secs{grid-template-columns:1fr 1fr;gap:var(--sp-8)}
  .tk-stub{padding:var(--sp-10) var(--sp-8)}
}
@media (prefers-reduced-motion:no-preference){.tk.enter{animation:rise 320ms var(--ease-out) both}}

.legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);font-size:var(--fs-caption);color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
.legend .lk{background:var(--rose-500)}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media (max-width:339px){.tiles{grid-template-columns:1fr}}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tiles>li{min-width:0}
.tiles>li.open{grid-column:1/-1}
.tile{position:relative;background:var(--ink-2);border:1px solid transparent;box-shadow:var(--shadow-ring),var(--highlight-top);border-radius:var(--r-lg);transition:box-shadow var(--dur-instant) var(--ease-out)}
.tile.st-yes{box-shadow:0 0 0 1px var(--rose-line-1),var(--highlight-top)}
.tile.st-no{background:var(--ink-1);box-shadow:0 0 0 1px var(--line-2)}
li.open>.tile{box-shadow:0 0 0 1px var(--rose-line-2),var(--highlight-top)}
.tile-face{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-2);width:100%;min-height:172px;padding:var(--sp-4) var(--sp-3) var(--sp-4) var(--sp-4);background:transparent;border:0;border-radius:inherit;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition-property:background-color,scale;transition-duration:var(--dur-instant),var(--dur-fast);transition-timing-function:var(--ease-out)}
.tile-face:active{scale:var(--press-scale)}
@media (hover:hover){.tile-face:hover{background:rgba(246,239,234,.025)}}
.tile-face:focus-visible{box-shadow:var(--focus-ring)}
li.open .tile-face{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:var(--sp-3);padding:var(--sp-4) var(--sp-4) var(--sp-3)}
li.open .tile-face .tl{flex:1;min-width:0}
li.open .tile-face .refs{flex-basis:100%}
.tile-face .row1{display:flex;align-items:flex-start;justify-content:space-between;width:100%;gap:var(--sp-2)}
li.open .tile-face .row1{width:auto}
.tile-face .tl{display:block;font-family:var(--font-serif);font-size:var(--fs-lead);font-weight:600;letter-spacing:var(--tracking-title);line-height:1.35}
.tile-face .td{display:block;font-size:var(--fs-caption);color:var(--text-3);line-height:1.5}
li:not(.open) .tile-face .td{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:720px){li:not(.open) .tile-face .td{-webkit-line-clamp:1}}
.tile .ic{background:var(--ink-3)}
.tile.st-yes .ic{background:var(--rose-tint-2);color:var(--rose-300);box-shadow:inset 0 0 0 1px var(--rose-line-1)}
.tile.st-no .ic{color:var(--text-3);background:transparent}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:var(--sp-1)}
.ref{display:inline-flex;align-items:center;gap:3px;min-height:24px;padding:1px 8px;border-radius:var(--r-xs);background:var(--ink-3);font-size:12px;line-height:1.4;color:var(--text-2)}
.ref.key{background:var(--rose-tint-3);color:var(--rose-300);font-weight:600}
.ref.key::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose-500)}
.ref small{font-size:11px;color:var(--text-3);font-weight:400}
.ref.more{background:transparent;color:var(--text-3);padding-inline:4px}
.stat{display:inline-flex;align-items:center;gap:4px;flex:none;height:24px;padding:0 8px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;font-family:var(--font-sans)}
.stat svg{width:12px;height:12px}
.stat.s-none{background:rgba(246,239,234,.06);color:var(--text-3);font-weight:500}
.stat.s-yes{background:var(--rose-500);color:var(--rose-ink)}
.stat.s-no{background:var(--ink-3);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.stat .num{font-size:12px}
.tile-body{display:flex;flex-direction:column;gap:var(--sp-5);padding:var(--sp-2) var(--sp-4) var(--sp-5);border-top:1px solid var(--line-1);margin-top:var(--sp-1);padding-top:var(--sp-5)}
@media (min-width:768px){.tile-body{padding-inline:var(--sp-6)}}
@media (prefers-reduced-motion:no-preference){.tile-body{animation:rise var(--dur-slow) var(--ease-out) both}}
.tile-body .hint{margin:0;font-size:var(--fs-small);color:var(--text-2)}
.tile-close{align-self:flex-start}
.qlabel{font-size:var(--fs-small);font-weight:500;color:var(--text-2);margin:0 0 var(--sp-2)}
.yn .bc{min-height:72px;flex-direction:row;gap:var(--sp-2);font-size:var(--fs-lead)}
.yn .bc svg{width:22px;height:22px}
.sub-k{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-small);font-weight:600;color:var(--text-1)}
.sub-k svg{width:18px;height:18px;color:var(--rose-300)}
.sub-k small{font-weight:400;color:var(--text-3);font-size:var(--fs-caption)}
.group{display:flex;flex-direction:column;gap:var(--sp-3)}

/* 上傳區（精簡版） */
.drop.compact{min-height:96px;flex-direction:row;gap:var(--sp-3);text-align:left;justify-content:flex-start;padding:var(--sp-4)}
.drop.compact svg{width:28px;height:28px;margin:0;flex:none;color:var(--rose-300)}
.drop .tx{display:flex;flex-direction:column;align-items:inherit;gap:2px;min-width:0}
.drop.compact .tx{align-items:flex-start}
.vid{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--warning-tint);box-shadow:inset 0 0 0 1px var(--warning-line);font-size:var(--fs-small)}
.vid>svg{flex:none;width:20px;height:20px;color:var(--warning-500);margin-top:2px}
.vid b{display:block;font-weight:600}
.vid p{margin:2px 0 0;color:var(--text-2)}
.vid .btn{margin-top:var(--sp-2);min-height:44px}

/* 雲端連結 */
.links{display:flex;flex-direction:column;gap:var(--sp-3)}
.lk-row{display:grid;grid-template-columns:1fr 44px;gap:var(--sp-2) var(--sp-2);padding:var(--sp-3);border-radius:var(--r-md);background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-1)}
.lk-row .lk-in{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.lk-row .url-wrap{position:relative}
.lk-row .url-wrap .input{padding-left:40px;font-family:var(--font-mono);font-size:14px}
.lk-row .url-wrap>svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--text-3);pointer-events:none}
.lk-row.ok .url-wrap>svg{color:var(--success-500)}
.lk-row.bad .url-wrap>svg{color:var(--error-500)}
.lk-row .input{min-height:44px}
.lk-row .lk-st{grid-column:1/-1;margin:0}
.lk-row .okmsg{display:flex;gap:6px;align-items:center;font-size:var(--fs-caption);color:var(--success-500)}
.lk-row .okmsg svg{width:14px;height:14px}
.share{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:var(--fs-caption);color:var(--text-3)}
.share code{font-family:var(--font-mono);font-size:13px;color:var(--text-1);background:var(--ink-0);padding:2px 8px;border-radius:var(--r-xs);overflow-wrap:anywhere}
.share .copy{min-height:44px;padding:0 10px;font-size:var(--fs-caption)}

/* 雲端連結教學 */
.howto{border-radius:var(--r-md);background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden}
.howto-btn{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;padding:var(--sp-2) var(--sp-4);border:0;background:transparent;color:var(--text-1);font:inherit;font-size:var(--fs-small);font-weight:600;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.howto-btn>svg:first-child{width:20px;height:20px;color:var(--info-500);flex:none}
.howto-btn span{flex:1}
.howto-btn small{display:block;font-weight:400;color:var(--text-3);font-size:var(--fs-caption)}
.howto-btn .chev{width:18px;height:18px;color:var(--text-3);transition:rotate var(--dur-slow) var(--ease-out)}
.howto-btn[aria-expanded="true"] .chev{rotate:180deg}
.howto-btn:focus-visible{box-shadow:inset 0 0 0 2px var(--rose-300)}
@media (hover:hover){.howto-btn:hover{background:var(--ink-2)}}
.steps-ill{list-style:none;margin:0;padding:var(--sp-2) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);counter-reset:s}
.steps-ill li{display:grid;grid-template-columns:104px 1fr;gap:var(--sp-3);align-items:center}
.steps-ill .t{font-size:var(--fs-small);color:var(--text-2);line-height:1.55}
.steps-ill .t b{display:flex;align-items:center;gap:6px;color:var(--text-1);font-weight:600}
.steps-ill .t b .n{font-family:var(--font-mono);font-size:12px;color:var(--rose-300)}
.steps-ill .t code{font-family:var(--font-mono);font-size:12px;color:var(--text-1);overflow-wrap:anywhere}
.steps-ill .alt{margin:var(--sp-1) 0 0;font-size:var(--fs-caption);color:var(--text-3)}
.apps{margin:0 var(--sp-4) var(--sp-4);display:flex;flex-wrap:wrap;gap:6px;font-size:var(--fs-caption);color:var(--text-3);align-items:center}
.apps span{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:var(--r-xs);background:var(--ink-3);color:var(--text-2)}
/* 示意圖：簡化的雲端硬碟畫面 */
.scr{position:relative;height:72px;border-radius:8px;background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden;padding:8px}
.scr .tb{position:absolute;left:0;right:0;top:0;height:12px;background:var(--ink-4)}
.scr .tb::before{content:"";position:absolute;left:6px;top:4px;width:4px;height:4px;border-radius:50%;background:var(--line-3);box-shadow:7px 0 0 var(--line-3),14px 0 0 var(--line-3)}
.scr svg{position:absolute;color:var(--text-2)}
.scr .hl{color:var(--rose-300)}
.scr .pill{position:absolute;height:14px;border-radius:7px;background:var(--rose-500)}
.scr .ln{position:absolute;height:4px;border-radius:2px;background:var(--line-3)}
.scr .fld{position:absolute;left:10px;right:10px;height:16px;border-radius:4px;background:var(--ink-0);box-shadow:inset 0 0 0 1px var(--rose-line-2);font-family:var(--font-mono);font-size:7px;line-height:16px;padding-left:4px;color:var(--text-1);white-space:nowrap;overflow:hidden}
.scr .cur{position:absolute;width:10px;height:10px;color:var(--text-1)}

/* 流程：步驟鏈（狀態＝節點填色；目前步驟＝外環） */
.target{display:flex;flex-direction:column;gap:var(--sp-3)}
.chain-wrap{position:relative;margin:0 calc(var(--gutter) * -1)}
.chain{display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:var(--sp-2) var(--gutter) var(--sp-3);scrollbar-width:thin;scrollbar-color:var(--ink-4) transparent;list-style:none;margin:0}
.chain::-webkit-scrollbar{height:4px}
.chain::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:2px}
.chain li{position:relative;flex:none;scroll-snap-align:center}
.chain li+li::before{content:"";position:absolute;top:31px;left:-14px;width:28px;height:2px;border-radius:1px;background:var(--line-2)}
.chain button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;min-height:88px;padding:6px 2px;margin:0 6px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-3);font:inherit;font-size:12px;line-height:1.3;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:color var(--dur-instant) var(--ease-out)}
.chain .nm{max-width:72px;overflow-wrap:anywhere}
.chain .no{font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:.04em}
.chain button:focus-visible{box-shadow:var(--focus-ring)}
@media (hover:hover){.chain button:hover{color:var(--text-1)}}
.chain li.cur button{color:var(--text-1);font-weight:600}
.chain button:active .dot{scale:var(--press-scale)}
.chain-count{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);font-size:var(--fs-caption);color:var(--text-3)}
.chain-count b{font-family:var(--font-mono);font-weight:500;color:var(--text-1)}
.chain-count .swipe{flex:1;min-width:8em}
.chain .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 節點（階段鏈、清單、預覽共用） */
.dot{position:relative;display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--ink-2);border:1.5px solid var(--line-2);color:var(--text-3);transition-property:background-color,color,border-color,scale;transition-duration:var(--dur-fast);transition-timing-function:var(--ease-out)}
.dot svg{width:22px;height:22px}
.dot .b{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ink-4);color:var(--text-1);box-shadow:0 0 0 2px var(--ink-1)}
.dot .b svg{width:11px;height:11px}
.n-un .dot{border-color:var(--line-1);background:transparent;color:var(--text-3)}
.n-none .dot{border-style:dashed;border-color:var(--line-4);background:transparent;color:var(--text-2)}
.n-na .dot{border-color:var(--line-1);background:transparent;color:var(--text-disabled)}
.n-na .nm{text-decoration:line-through;text-decoration-color:var(--text-disabled);color:var(--text-disabled)}
.n-doing .dot{border-color:var(--text-2);background:var(--ink-3);color:var(--text-1)}
.h-manual .dot{background:var(--text-1);border-color:var(--text-1);color:var(--ink-1)}
.h-partial .dot{background:linear-gradient(135deg,var(--rose-500) 50%,var(--ink-3) 50%);border-color:var(--rose-500);color:var(--text-1)}
.h-auto .dot{background:var(--rose-500);border-color:var(--rose-500);color:var(--rose-ink)}
.chain li.cur .dot{outline:2px solid var(--rose-300);outline-offset:3px}

/* 步驟卡 */
.stage{display:flex;flex-direction:column;gap:var(--sp-5)}
.stage-h{display:flex;align-items:center;gap:var(--sp-4)}
.stage-h .dot{width:56px;height:56px}
.stage-h .dot svg{width:26px;height:26px}
.stage-h .tt{flex:1;min-width:0}
.stage-h .k{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--text-3);letter-spacing:.04em}
.stage-h h2{font-size:var(--fs-h2);overflow-wrap:anywhere}
.stage-h .orig{display:block;font-size:var(--fs-caption);color:var(--text-3);margin-top:2px}
.tg{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-xs);font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.04em;background:var(--ink-3);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.stage .sd{margin:-8px 0 0;color:var(--text-2);font-size:var(--fs-small)}
.st-tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);padding:var(--sp-2);border-radius:var(--r-md);background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-1)}
.st-tools .btn{min-height:44px;padding-inline:var(--sp-3);font-size:var(--fs-small)}
.st-tools .btn svg{width:18px;height:18px}
.st-tools .ib{width:44px;padding:0}
.st-tools .tip{flex-basis:100%;margin:0 var(--sp-1);font-size:var(--fs-caption);color:var(--text-3);line-height:1.5}
.btn-del{color:var(--error-500)}
@media (hover:hover){.btn-del:not(:disabled):hover{background:var(--error-tint)}}

/* 狀態、處理方式分段按鈕 */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.seg label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:var(--sp-2);border-radius:var(--r-md);background:var(--ink-0);border:1px solid var(--line-2);color:var(--text-2);font-size:var(--fs-small);font-weight:600;text-align:center;line-height:1.3;cursor:pointer;-webkit-tap-highlight-color:transparent;transition-property:background-color,border-color,color,scale;transition-duration:var(--dur-instant),var(--dur-instant),var(--dur-instant),var(--dur-fast);transition-timing-function:var(--ease-out)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label>svg{width:24px;height:24px;color:var(--text-3)}
.seg label:active{scale:var(--btn-press)}
@media (hover:hover){.seg label:hover{border-color:var(--line-4);color:var(--text-1)}}
.seg label:has(input:focus-visible){box-shadow:var(--focus-ring)}
.seg label:has(input:checked){background:var(--rose-tint-1);border-color:var(--rose-line-2);color:var(--rose-300)}
.seg label:has(input:checked)>svg{color:var(--rose-300)}
.seg .v-none:has(input:checked){border-style:dashed;background:var(--ink-3);border-color:var(--line-4);color:var(--text-1)}
.seg .v-none:has(input:checked)>svg{color:var(--text-1)}
.seg .v-na:has(input:checked){background:var(--ink-3);border-color:var(--line-3);color:var(--text-2)}
.seg .v-na:has(input:checked)>svg{color:var(--text-2)}
.seg .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:2px;vertical-align:-1px}
.sw.h-manual{background:var(--text-1)}
.sw.h-partial{background:linear-gradient(135deg,var(--rose-500) 50%,var(--ink-4) 50%);box-shadow:inset 0 0 0 1px var(--rose-500)}
.sw.h-auto{background:var(--rose-500)}
.seg .cap{display:flex;align-items:center;gap:4px}
.doing-box{display:flex;flex-direction:column;gap:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--line-1)}
.state-msg{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-4);border-radius:var(--r-md);background:var(--ink-3);font-size:var(--fs-small);color:var(--text-2)}
.state-msg svg{width:20px;height:20px;color:var(--text-3);flex:none}
.stage-nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-3)}
.stage-nav .btn{padding-inline:var(--sp-3);font-size:var(--fs-small);min-width:0;max-width:100%}
.stage-nav .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-nav .only{grid-column:2}

/* 編排步驟（清單） */
.mode-btn{min-height:44px;padding-inline:var(--sp-3);font-size:var(--fs-small)}
.mode-btn[aria-pressed="true"]{background:var(--rose-tint-1);border-color:var(--rose-line-2);color:var(--rose-300)}
.ed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-2)}
.ed-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--sp-2) var(--sp-3);align-items:center;padding:var(--sp-3);border-radius:var(--r-md);background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-1)}
.ed-row .dot{width:40px;height:40px;font-family:var(--font-mono);font-size:13px;font-weight:500}
.ed-row .input{min-height:44px}
.ed-row .meta2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-2)}
.ed-row .bdg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.ed-row .acts{display:flex;gap:2px;margin-left:auto}
.ed-row .acts .icon-btn{color:var(--text-2)}
.ed-row .acts .icon-btn:disabled{opacity:.35;cursor:not-allowed}
.ed-row .acts .del{color:var(--error-500)}
.ed-row .acts .gap{width:44px;height:44px;flex:none}
@media (min-width:560px){.ed-row{grid-template-columns:40px minmax(0,1fr) auto}.ed-row .meta2{grid-column:auto;flex-wrap:nowrap}}
@media (prefers-reduced-motion:no-preference){.ed-row.new{animation:rise var(--dur-base) var(--ease-out) both}}
.ed-foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);justify-content:space-between}
.ed-foot .help{flex:1;min-width:12em}
.sbadge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;background:rgba(246,239,234,.06);color:var(--text-3)}
.sbadge .sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin:0}
.sbadge.s-doing{background:var(--rose-tint-1);color:var(--rose-300)}

(function () {
  try {
    if (!/\bLine\//i.test(navigator.userAgent || '') || /[?&]openExternalBrowser=1(&|$)/.test(location.search)) return;
    if (window.sessionStorage.getItem('consult_line_ext') === '1') return;

    location.replace(u.toString());
  } catch (e) { /* 儲存不可用時不導向，避免循環 */ }
})();

  /* ------------------------------------------------------------------ */
  /* 工具函式                                                            */
  /* ------------------------------------------------------------------ */
  function getPath(obj, path) {
    if (!obj || !path) return undefined;
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function isEmpty(v) {
    if (v == null) return true;
    if (Array.isArray(v)) return !v.some(function (x) { return !isEmpty(x); });
    if (typeof v === 'object') return false;
    return String(v).trim() === '';
  }

  /** 判斷 showIf／condition 是否成立；ctx 為整份答案（或類別資料） */
  function evalCondition(cond, ctx, roleId) {
    if (!cond) return true;
    if (cond.onlyForRole && roleId !== cond.onlyForRole) return true;
    var v = getPath(ctx, cond.field);
    if (Object.prototype.hasOwnProperty.call(cond, 'equals')) return v === cond.equals;
    if (cond.in) return cond.in.indexOf(v) >= 0;
    if (cond.notIn) return cond.notIn.indexOf(v) < 0;
    if (cond.includes) return Array.isArray(v) && v.indexOf(cond.includes) >= 0;
    return true;
  }

  function roleById(id) {
    for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
    return null;
  }

  /** 身分是否帶人（經銷合作依「下線夥伴」判斷） */
  function roleLeads(roleId, answers) {
    var r = roleById(roleId);
    if (!r) return false;
    if (r.leads === 'conditional') return getPath(answers || {}, 'role.hasDownline') === 'yes';
    return !!r.leads;
  }

  function sectionById(id) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
    return null;
  }

  function categoryById(id) {
    for (var i = 0; i < UPLOAD_CATEGORIES.length; i++) if (UPLOAD_CATEGORIES[i].id === id) return UPLOAD_CATEGORIES[i];
    return null;
  }

  function visibleFor(item, roleId, answers) {
    if (item.roles && item.roles.indexOf(roleId) < 0) return false;
    if (item.condition && !evalCondition(item.condition, answers || {}, roleId)) return false;
    return true;
  }

  /** 依身分（與答案中的條件）回傳可見區塊 */
  function sectionsForRole(roleId, answers) {
    return SECTIONS.filter(function (s) { return visibleFor(s, roleId, answers); });
  }

  /** 依身分回傳資料上傳可見類別 */
  function categoriesForRole(roleId, answers) {
    return UPLOAD_CATEGORIES.filter(function (c) { return visibleFor(c, roleId, answers); });
  }

  /** 區塊內依身分與 showIf 可見的欄位（section 可傳物件或 id） */
  function fieldsForRole(section, roleId, answers) {
    var sec = typeof section === 'string' ? sectionById(section) : section;
    if (!sec || !sec.fields) return [];
    return sec.fields.filter(function (f) {
      if (f.roles && f.roles.indexOf(roleId) < 0) return false;
      if (f.showIf && !evalCondition(f.showIf, answers || {}, roleId)) return false;
      return true;
    });
  }

  /** 區塊說明文字：身分提示 → 區塊 hint（較完整的說明，例：資料上傳）→ desc */
  function sectionHint(section, roleId) {
    return (section.roleHints && section.roleHints[roleId]) || section.hint || section.desc || '';
  }

  /** 身分專屬提示（例：經銷合作的協作流程），無則空字串 */
