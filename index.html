  /**
   * sessionStart({ account, name, role? }) → { account, name, startedAt, lastSeen, resumed, elapsedMin }
   *   學員資料頁完成帳號與本名後呼叫一次；伺服器記錄開始時間（已存在且未送出不覆蓋）。失敗不影響填寫（呼叫端可忽略錯誤）。
   */
  function sessionStart(o) {
    o = o || {};
    var params = { account: o.account, name: o.name, clientKey: clientKey() };
    if (o.role) params.role = o.role;
    return call('session_start', params, { retries: 1 });
  }

  /**
   * progressPing({ account, name, role, sectionId, sectionLabel, sectionIndex, sectionTotal, percent })
   *   即時填寫進度（免 token）：fetch keepalive、不等待回應、失敗靜默。account 以名冊鍵（正規化）送出。
   */
  function progressPing(o) {
    o = o || {};
    var S = root.CONSULT_SCHEMA;
    var acc = S && S.rosterKey ? S.rosterKey(o.account) : String(o.account || '').trim().toLowerCase();
    if (!acc || !o.name || !o.sectionId) return false;
    return fire('progress_ping', { account: acc, name: String(o.name).slice(0, 60), role: o.role || '', sectionId: o.sectionId, sectionLabel: o.sectionLabel || '', sectionIndex: o.sectionIndex, sectionTotal: o.sectionTotal, percent: o.percent, clientKey: clientKey() });
  }

  /* ------------------------------------------------------------------ */
  /* 後台                                                                */
  /* ------------------------------------------------------------------ */
  /*
   * 登入狀態：{ token, expiresAt, remember } 以 JSON 存於
   *   勾選記住此裝置 → localStorage（30 天）；未勾選 → sessionStorage（分頁關閉即失效，最長 12 小時）
   * 儲存不可用（隱私模式、封鎖網站資料）時改存記憶體。讀取時逾期即清除並記錄 expired 旗標，供畫面提示。
   */
  var TOKEN_KEY = 'consult_admin_token';
  var REMEMBER_MAX_MS = 30 * 24 * 60 * 60 * 1000;
  var mem = null;
  var expiredFlag = '';

  function storageOf(kind) {
    try { var s = root[kind]; return s && typeof s.getItem === 'function' ? s : null; } catch (e) { return null; }
  }
  var storageErr = false;
  /** 讀取登入狀態；getItem 例外時重試一次，仍失敗則記錄 storageErr（供畫面判斷暫時無法存取，不視為登出） */
  function readFrom(kind) {
    var st = storageOf(kind); if (!st) return null;
    var raw = null, ok = false;
    for (var i = 0; i < 2 && !ok; i++) { try { raw = st.getItem(TOKEN_KEY); ok = true; } catch (e) { raw = null; } }
    if (!ok) { storageErr = true; return null; }
    try {
      if (!raw) return null;
      var o = raw.charAt(0) === '{' ? JSON.parse(raw) : { token: raw, expiresAt: 0, remember: false };
      return o && typeof o.token === 'string' && o.token ? o : null;
    } catch (e) { return null; }
  }
  function writeTo(kind, o) {
    var st = storageOf(kind); if (!st) return false;
    try { if (o) st.setItem(TOKEN_KEY, JSON.stringify(o)); else st.removeItem(TOKEN_KEY); return true; } catch (e) { return false; }
  }
  function clearSession() {
    mem = null;
    writeTo('localStorage', null);
    writeTo('sessionStorage', null);
  }
  /** 目前有效的登入狀態或 null；逾期者清除並記錄 expired（'remember'／'session'） */
  function session() {
    var o = readFrom('localStorage') || readFrom('sessionStorage') || mem;
    if (!o) return null;
    var now = Date.now(), exp = Number(o.expiresAt) || 0;
    // 舊版只存 token 字串（無效期）：保留至分頁關閉，由資料中心判定
    if (exp && (now >= exp || exp - now > REMEMBER_MAX_MS + 60000)) {
      expiredFlag = o.remember ? 'remember' : 'session';
      clearSession();
      return null;
    }
    return { token: o.token, expiresAt: exp, remember: !!o.remember };
  }
  function getToken() { var s = session(); return s ? s.token : ''; }
  function setSession(d, remember) {
    clearSession();
    if (!d || !d.token) return;
    var o = { token: d.token, expiresAt: Number(d.expiresAt) || 0, remember: !!remember };
    if (!writeTo(remember ? 'localStorage' : 'sessionStorage', o)) mem = o;
  }
  /** 取出並清除儲存讀取例外旗標 */
  function storageError() { var f = storageErr; storageErr = false; return f; }
  /** 取出並清除逾期旗標：'remember'（30 天效期已過）、'session'（12 小時效期已過）或 '' */
  function takeExpired() { var f = expiredFlag; expiredFlag = ''; return f; }

  /**
   * login(password, remember) → { token, expiresAt, remember }
   *   remember=true：資料中心簽發 30 天效期 token，存 localStorage；否則 12 小時，存 sessionStorage
   */
  function login(password, remember) {
    remember = !!remember;
    return call('login', { password: password, remember: remember }, { retries: 0 }).then(function (d) {
      setSession(d, remember);
      d.remember = remember;
      return d;
    });
  }
  /** 登出：清除兩種儲存與記憶體中的 token */
  function logout() { clearSession(); expiredFlag = ''; }

  function authed(action, params, opts) {
    var token = getToken();
    if (!token) return Promise.reject(new ApiError('尚未登入', 'ERR_AUTH'));
    return call(action, Object.assign({ token: token }, params || {}), opts).catch(function (err) {
      if (err.code === 'ERR_AUTH') clearSession();
      throw err;
    });
  }

  /** list({ status, q }) → { rows: [...索引列], total } */
  function list(filter) { return authed('list', filter || {}); }

  /**
   * get(receiptId) → { index, data, files:[{fileId,name,size,mime,key?,label}], gaps }
   *   data 為作業資料 JSON（meta、student、role、sections、attachments、gaps、raw）；
   *   files 含學員附件與系統產生的作業資料 JSON、作業內容 PDF（label 分別為「作業資料 JSON」「作業內容 PDF」）。
   */
  function get(receiptId) { return authed('get', { receiptId: receiptId }); }

  /** setStatus(receiptId, status) → { receiptId, status } */
  function setStatus(receiptId, status) { return authed('set_status', { receiptId: receiptId, status: status }); }

  /** downloadFile(fileId) → { name, mime, size, base64 }；save=true 時直接觸發瀏覽器下載 */
  function downloadFile(fileId, save) {
    return authed('download_file', { fileId: fileId }).then(function (d) {
      if (save) saveBlob(base64ToBlob(d.base64, d.mime || mimeForName(d.name)), d.name);
      return d;
    });
  }

  /**
   * downloadAll(receiptId) → { zipped: true, name, size, base64 } 或 { zipped: false, reason, name, files:[{fileId,name,size}] }
   * zipped 時 save=true 直接下載 zip；非 zipped 時由畫面逐檔呼叫 downloadFile（files 內無直接連結）。
   */
  function downloadAll(receiptId, save) {
    return authed('download_zip', { receiptId: receiptId }).then(function (d) {
      if (save && d.zipped) saveBlob(base64ToBlob(d.base64, 'application/zip'), d.name);
      return d;
    });
  }

  /**
   * exportAll() → { name, mime, base64, count }
   *   連線模式為 xlsx；離線模擬為 csv。mime 由資料中心回傳，缺少時依副檔名推斷。save=true 直接下載。
   */
  function exportAll(save) {
    return authed('export_xlsx', {}).then(function (d) {
      d.mime = d.mime || mimeForName(d.name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (save) saveBlob(base64ToBlob(d.base64, d.mime), d.name);
      return d;
    });
  }

  /**
   * rosterSync(rows) → { count, keys, skipped, duplicates, shards, updatedAt }
   *   rows：[{ account, email, name }]（≤ 5000；由名冊同步書籤經 postMessage 送達後台頁面）；整份取代。
   */
  function rosterSync(rows) { return authed('roster_sync', { rows: rows || [] }); }
  /** rosterStatus() → { count, keys, shards, updatedAt, empty } */
  function rosterStatus() { return authed('roster_status', {}); }
  /**
   * progressList({ includeSubmitted }) → { rows:[{ account, name, role, sectionId, sectionLabel, sectionIndex, sectionTotal, percent,
   *   startedAt, lastSeen, elapsedMin, activeMin, status('active'|'idle'|'stalled'|'submitted') }], total, summary:{ active, idle, stalled, submitted } }
   */
  function progressList(o) { return authed('progress_list', { includeSubmitted: !!(o && o.includeSubmitted) }); }
  /** deleteSubmissions(receiptIds) → { deleted:[{ receiptId, name }], failed:[{ receiptId, reason }] }（資料夾移至雲端硬碟垃圾桶） */
  function deleteSubmissions(ids) { return authed('delete_submission', { receiptIds: (ids || []).slice(0, 50) }); }
  /** renderPdf(receiptId) → { ready, existed?, busy?, failed? }（後台手動產生作業內容 PDF；冪等） */
  function renderPdf(receiptId) { return authed('render_pdf', { receiptId: receiptId }); }
  /** rosterSearch(q) → { rows:[{ key, name, masked, batches:[{ id, title }] }], total, truncated }（後台；本名或稱呼部分比對，最多 30 筆；batches 為所在進行中批次） */
  function rosterSearch(q) { return authed('roster_search', { q: String(q == null ? '' : q) }); }
  /** rosterMatch(text) → { groups:[{ token, matches:[{ key, name, masked, batches }], total }], empty }（後台；以名冊本名比對貼上文字，matches 0 筆＝未找到） */
  function rosterMatch(text) { return authed('roster_match', { text: String(text == null ? '' : text) }); }
  /* ---- LINE 手動綁定（後台）：lineBindManual({ key, chatUrl|userId, preview? }) → { key, name, userIdTail, displayName|null, accountId, preview, bound, boundAt?, chatUrl }；404 非好友 → ERR_LINE_NOT_FRIEND ---- */
  function lineBindManual(o) { return authed('line_bind_manual', { key: o.key, chatUrl: o.chatUrl || '', userId: o.userId || '', preview: !!o.preview }); }
  /** lineUnbind(key) → { key, bound:false, removed } */
  function lineUnbind(key) { return authed('line_unbind', { key: key }); }
  /* ---- 發送通知（不限批次） ---- */
  /** notifyRecipients({ kind:'keys'|'bound'|'batch'|'batchOpen'|'stalled', keys?, batchId? }) → { rows:[{ key, name, masked, callName, lineBound, lineBlocked, lineName, chatUrl }], total } */
  function notifyRecipients(o) { return authed('notify_recipients', o || {}); }
  /** notifyPreview({ keys, templateId?, bodyOverride?, deadline?, callNames? }) → { template, lineConfigured, messages:[…], missing } */
  function notifyPreview(o) { return authed('notify_preview', o || {}); }
  /** notifyPush({ keys, templateId?, bodyOverride?, deadline?, callNames?, dryRun?, runId? })：dryRun 回預覽與額度；正式回 sent／failed／skipped／quota／logId */
  function notifyPush(o) { return authed('notify_push', o || {}); }
  /** notifyLog({ limit? }) → { rows:[{ id, at, source, title, template, summary, count, ok, fail, skipped, results:[{ name, state, note }] }] }（最近 50 筆） */
  function notifyLog(o) { return authed('notify_log', o || {}); }
  /* ---- LINE 對應（書籤比對後寫入） ---- */
  /** lineMapStatus() → { total, bound, pending:[{ key, name, masked }], chatAccountId }（啟用學姊＝名冊） */
  function lineMapStatus() { return authed('line_map_status', {}); }
  /** lineBindBulk(items, accountId?) → { bound, skipped:[{ key, reason }], invalid }；items=[{ key, userId, label? }]，已綁定者略過 */
  function lineBindBulk(items, accountId) { return authed('line_bind_bulk', { items: items || [], accountId: accountId || '' }); }
  /* ---- 優先批次 ---- */
  /** batchList({ includeArchived }) → { rows:[{ id, title, deadline, deadlineText, hint, count, archived, createdAt, updatedAt, overdue }], total } */
  function batchList(o) { return authed('batch_list', { includeArchived: !!(o && o.includeArchived) }); }
  /** batchSave({ id?, title, deadline, hint?, members:[{ key, name, masked?, callName? }], archived? }) → 批次（含 members、deadlineText）；無 id 為新增 */
  function batchSave(b) { b = b || {}; return authed('batch_save', { id: b.id || '', title: b.title, deadline: b.deadline, hint: b.hint || '', members: b.members || [], archived: b.archived === true }); }
  /** batchArchive(id, archived=true) → { id, archived } */
  function batchArchive(id, archived) { return authed('batch_archive', { id: id, archived: archived !== false }); }
  /** batchStatus(id) → { batch, members:[{ key, name, masked, callName, state:'none'|'filling'|'submitted', percent, sectionLabel, startedAt, lastSeen, receiptId, submittedAt, onTime, lineBound, lineBlocked, lastNotifiedAt, lastNotifyOk, lastNotifyError }], summary:{ none, filling, submitted, onTime, late, bound }, now } */
  function batchStatus(id) { return authed('batch_status', { id: id }); }
  /* ---- 通知範本 ---- */
  /** templateList() → { rows:[{ id, name, body, updatedAt, vars }], total, vars } */
  function templateList() { return authed('template_list', {}); }
  /** templateSave({ id?, name, body }) → { id, name, body, updatedAt, vars } */
  function templateSave(t) { t = t || {}; return authed('template_save', { id: t.id || '', name: t.name, body: t.body }); }
  /** templateDelete(id) → { id, deleted:true }（最後一份不可刪除） */
  function templateDelete(id) { return authed('template_delete', { id: id }); }
  /** messagePreview({ batchId, templateId, keys? }) → { batch, template, lineConfigured, messages:[{ key, name, masked, callName, lineBound, text, length }] }（供複製通知） */
  function messagePreview(o) { o = o || {}; return authed('message_preview', { batchId: o.batchId, templateId: o.templateId, keys: Array.isArray(o.keys) ? o.keys : undefined }); }
  /* ---- LINE 推播 ---- */
  /** lineSettingsSave({ channelId, channelSecret }) → { configured, channelId, secretTail, updatedAt, oaId, verified, error? }（secret 不回傳） */
  function lineSettingsSave(o) { o = o || {}; return authed('line_settings_save', { channelId: o.channelId, channelSecret: o.channelSecret }); }
  /** lineSettingsStatus() → { configured, channelId, secretTail, updatedAt, oaId, monthlyQuota, quota:{ limit, used, remaining }|null } */
  function lineSettingsStatus() { return authed('line_settings_status', {}); }
  /**
   * linePush({ batchId, templateId, keys?, dryRun?, runId? })
   *   dryRun → { dryRun:true, quota, toSend, messages:[…], skipped:[{ key, name, masked, reason }] }
   *   正式 → { sent:[{ key, name, at, duplicate? }], failed:[{ key, name, error }], skipped, quota, runId }
   *   ERR_LINE_NOT_CONFIGURED（改用 messagePreview 複製通知）、ERR_LINE_QUOTA（剩餘則數不足）
   */
  function linePush(o) { o = o || {}; return authed('line_push', { batchId: o.batchId, templateId: o.templateId, keys: Array.isArray(o.keys) ? o.keys : undefined, dryRun: !!o.dryRun, runId: o.runId || '' }, { retries: 0 }); }

  /* ------------------------------------------------------------------ */
  /* 3.0：雲端資料夾（學姊本人 Google 雲端硬碟）與補件需求                       */
  /* ------------------------------------------------------------------ */
  /**
   * googleConfig() → { clientId, apiKey, appId, scope, shareEmail, ready }
   *   build.py 以環境變數 GOOGLE_CLIENT_ID、GOOGLE_API_KEY、GOOGLE_APP_ID 注入前台 config；ready=false（無用戶端 ID）時前台只提供「貼上自己共用的資料夾連結」。
   */
  function googleConfig() {
    var c = (root && root.CONSULT_CONFIG) || {};
    var S3 = root.CONSULT_SCHEMA3 || (root.CONSULT_SCHEMA && root.CONSULT_SCHEMA.V3) || null;
    var clientId = String(c.GOOGLE_CLIENT_ID || '');
    return { clientId: clientId, apiKey: String(c.GOOGLE_API_KEY || ''), appId: String(c.GOOGLE_APP_ID || ''), scope: S3 ? S3.DRIVE.scope : 'https://www.googleapis.com/auth/drive.file', shareEmail: S3 ? S3.DRIVE.shareEmail : 'grace63188@gmail.com', ready: !!clientId };
  }
  /**
   * driveRegister({ account, name, rootFolderId, folders:{ itemId:folderId }, ownerEmail? })（免 token）
   *   前台以學姊帳號建立「本名_諮詢資料」與分類子資料夾並共用 grace63188 後回報；資料中心驗證可讀取與名稱後登錄（重複呼叫為合併，補建的子資料夾再送一次即可）。
   *   → { ok, rootFolderId, rootUrl, rootName, folders, ownerEmail, verified, missing:[itemId], status, shareEmail }；ERR_DRIVE_UNREADABLE：尚未共用。
   */
  function driveRegister(o) {
    o = o || {};
    return call('drive_register', { account: o.account, name: o.name, rootFolderId: o.rootFolderId, folders: o.folders || {}, ownerEmail: o.ownerEmail || '', clientKey: clientKey() }, { retries: 1 });
  }
  /**
   * driveStatus({ account, force? })（前台，免 token）或 driveStatus({ receiptId, force? })（後台，需登入）
   *   → { registered, rootFolderId, rootUrl, rootName, folders:{ itemId:{ count, files, shortcuts, updated, readable } }, root:{ ok, name }, readable, checkedAt, cached }
   *   計數快取 60 秒；force:true 略過快取（「重新整理」）。
   */
  function driveStatus(o) {
    o = o || {};
    if (o.receiptId) return authed('drive_status', { receiptId: o.receiptId, force: !!o.force });
    return call('drive_status', { account: o.account, name: String(o.name == null ? '' : o.name).slice(0, 60), force: !!o.force, clientKey: clientKey() }, { retries: 1 });   // name：本名不符的登錄不回傳
  }
  /** driveCheckLink(url) → { ok:true, kind:'folder'|'file', id, name, count? } ｜ { ok:false, reason, code? }（不授權者貼自己共用的連結） */
  function driveCheckLink(url) { return call('drive_check_link', { url: String(url == null ? '' : url), clientKey: clientKey() }, { retries: 1 }); }
  /**
   * supplementCreate({ receiptId, items:[{ type:'section'|'data'|'custom', ref?, title?, note?, due? }], due?, notify?, body? })（後台）
   *   → { request, notice, link, pushed:{ sent, failed, skipped }|null, lineConfigured }；notify:true 且 LINE 可送達時立即推播，否則以 notice 複製
   */
  function supplementCreate(o) { o = o || {}; return authed('supplement_create', { receiptId: o.receiptId, items: o.items || [], due: o.due || '', notify: !!o.notify, body: o.body || '' }, { retries: 0 }); }
  /** supplementList({ receiptId? }) → { rows:[request…], total }（後台；無 receiptId 列全部，供作業總覽、關注名單、填寫進度標示「待補件」） */
  function supplementList(o) { o = o || {}; return authed('supplement_list', o.receiptId ? { receiptId: o.receiptId } : {}); }
  /**
   * supplementGet({ account, lookupToken } | { account, receiptId, requestId, k })（前台，免 token）
   *   → { rows:[{ receiptId, submittedAt, workName, request }], open, total }；lookupToken 為 rosterLookup 同裝置回傳；k 為補件連結內憑證
   */
  function supplementGet(o) {
    o = o || {};
    var p = { account: o.account, clientKey: clientKey() };
    if (o.lookupToken) p.lookupToken = o.lookupToken;
    if (o.k) { p.receiptId = o.receiptId; p.requestId = o.requestId; p.k = o.k; }
    return call('supplement_get', p, { retries: 1 });
  }
  /**
   * supplementSubmit({ account, lookupToken|k, receiptId, requestId, items:[{ id, content:{ kind:'drive'|'link'|'text'|'section', … } }], finish? })（前台）
   *   → { request, status:'open'|'partial'|'done', statusLabel, finished }
   */
  function supplementSubmit(o) {
    o = o || {};
    var p = { account: o.account, receiptId: o.receiptId, requestId: o.requestId, items: o.items || [], finish: !!o.finish, clientKey: clientKey() };
    if (o.lookupToken) p.lookupToken = o.lookupToken;
    if (o.k) p.k = o.k;
    return call('supplement_submit', p, { retries: 0 });
  }

  /** submitStatus(receiptId, uploadToken) → { done, ... } */
  function submitStatus(receiptId, uploadToken) { return call('submit_status', { receiptId: receiptId, uploadToken: uploadToken }, { retries: 0 }); }

  /** ping() → { version, time } */
  function ping() { return call('ping', {}, { retries: 0 }); }

  return {
    ApiError: ApiError,
    config: config,
    useMock: useMock,
    call: call,
    checkFile: checkFile,
    checkFileIssue: checkFileIssue,
    extOf: extOf,
    mimeForName: mimeForName,
    blobToBase64: blobToBase64,
    base64ToBlob: base64ToBlob,
    saveBlob: saveBlob,
    isIOS: isIOS,
    submit: submit,
    clientKey: clientKey,
    rosterLookup: rosterLookup,
    bindCode: bindCode,
    sessionStart: sessionStart,
    rosterSync: rosterSync,
    rosterStatus: rosterStatus,
    rosterSearch: rosterSearch,
    rosterMatch: rosterMatch,
    lineBindManual: lineBindManual,
    lineUnbind: lineUnbind,
    notifyRecipients: notifyRecipients,
    notifyPreview: notifyPreview,
    notifyPush: notifyPush,
    notifyLog: notifyLog,
    lineMapStatus: lineMapStatus,
    lineBindBulk: lineBindBulk,
    batchList: batchList,
    batchSave: batchSave,
    batchArchive: batchArchive,
    batchStatus: batchStatus,
    templateList: templateList,
    templateSave: templateSave,
    templateDelete: templateDelete,
    messagePreview: messagePreview,
    lineSettingsSave: lineSettingsSave,
    lineSettingsStatus: lineSettingsStatus,
    linePush: linePush,
    progressList: progressList,
    progressPing: progressPing,
    deleteSubmissions: deleteSubmissions,
    renderPdf: renderPdf,
    submitStatus: submitStatus,
    googleConfig: googleConfig,
    driveRegister: driveRegister,
    driveStatus: driveStatus,
    driveCheckLink: driveCheckLink,
    supplementCreate: supplementCreate,
    supplementList: supplementList,
    supplementGet: supplementGet,
    supplementSubmit: supplementSubmit,
    fire: fire,
    login: login,
    logout: logout,
    getToken: getToken,
    session: session,
    takeExpired: takeExpired,
    storageError: storageError,
    isLoggedIn: function () { return !!getToken(); },
    list: list,
    get: get,
    setStatus: setStatus,
    downloadFile: downloadFile,
    downloadAll: downloadAll,
    exportAll: exportAll,
    ping: ping
  };
});

</script>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<!-- 介面 -->
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

        c.lineWidth = 2.4; c.beginPath(); c.arc(0, 0, 40, 0, Math.PI * 2); c.stroke();
        c.lineWidth = 1; c.beginPath(); c.arc(0, 0, 35, 0, Math.PI * 2); c.stroke();
        c.font = '700 17px ' + FONT_SERIF; c.fillText('準時', 0, -4); c.fillText('完成', 0, 16);
        c.restore(); c.textAlign = 'left';
      } else if (r.onTime === false) {
        c.font = '500 14px ' + FONT_SANS; c.fillStyle = '#E8B85C'; c.fillText('逾截止時間完成', L, Y + 336);
      }
      // 票根
      var SL = SX + 36;
      var stub = [['回執編號', r.receiptId, '#FF77B2', 22], ['送出日期', day, '#F6EFEA', 20]];
      stub.forEach(function (o, i) {
        var yy = Y + 74 + i * 82;
        c.font = '400 11px ' + FONT_SANS; c.fillStyle = '#A0948F'; spaced(c, 2); c.fillText(o[0], SL, yy); spaced(c, 0);
        c.font = '500 ' + o[3] + 'px ' + FONT_MONO; c.fillStyle = o[2]; c.fillText(o[1], SL, yy + 32);
      });
      c.font = '400 11px ' + FONT_SANS; c.fillStyle = '#A0948F'; spaced(c, 2); c.fillText('核對', SL, Y + 238); spaced(c, 0);
      ['內容', '資料', '回執'].forEach(function (t, i) {
        var dx = SL + i * 72;
        c.fillStyle = 'rgba(255,46,139,.22)'; c.beginPath(); c.arc(dx + 3, Y + 262, 7, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#F6EFEA'; c.beginPath(); c.arc(dx + 3, Y + 262, 3, 0, Math.PI * 2); c.fill();
        c.font = '400 12px ' + FONT_SANS; c.fillStyle = '#CDC2BC'; c.fillText(t, dx + 16, Y + 266);
      });
      // 序號紋樣（與畫面相同演算法）
      var seed = 0, id = r.receiptId || 'CP', bx = SL;
      for (var j = 0; j < id.length; j++) seed = (seed * 31 + id.charCodeAt(j)) >>> 0;
      c.fillStyle = 'rgba(205,194,188,.5)';
      for (var k = 0; k < 30; k++) {
        seed = (seed * 1664525 + 1013904223) >>> 0; var bw = Math.min(1 + (seed >>> 30), 3);
        seed = (seed * 1664525 + 1013904223) >>> 0; var gp = Math.min(1 + (seed >>> 30), 3);
        c.fillRect(bx, Y + TH - 120, bw * 1.4, 44); bx += (bw + gp) * 1.4;
      }
      c.font = '400 11px ' + FONT_MONO; c.fillStyle = '#A0948F'; spaced(c, 3); c.fillText('CONSULTATION ARCHIVE', SL, Y + TH - 48); spaced(c, 0);
      return new Promise(function (resolve, reject) {
        try { cv.toBlob(function (b) { if (b) resolve(b); else reject(new Error('toBlob')); }, 'image/png'); } catch (e) { reject(e); }
      });
    });
  }
  function printTicket() {
    document.body.classList.add('print-ticket');
    var off = function () { document.body.classList.remove('print-ticket'); window.removeEventListener('afterprint', off); };
    window.addEventListener('afterprint', off);
    try { window.print(); } catch (e) { /* ignore */ }
    setTimeout(off, 1000);
  }
  function saveTicket(btn, r) {
    setLoading(btn, true, '製作中');
    drawTicket(r).then(function (blob) {
      setLoading(btn, false);
      API.saveBlob(blob, ticketFileName(r));
      toast('票券已儲存為圖片');
    }, function () {
      setLoading(btn, false);
      toast('圖片製作未完成，改以列印方式保存票券', { icon: 'i-info', cls: 't-warn' });
      printTicket();
    });
  }

  /* ================================================================ */
  /* 啟動                                                              */
  /* ================================================================ */
  var LOGO = (document.querySelector('meta[name="cp-logo"]') || {}).content || '';
  loadDraft();
  buildShell();
  var startView = (location.hash || '').slice(1);
  if (startView && startView !== 'done' && startView !== 'intro' && stepIndex(startView) >= 0 && (startView === 'student' || hasContent())) {
    UI.view = startView;
    if (draftInfo && startView !== 'student') { draftInfo.dismissed = true; setTimeout(function () { toast('已載入上次填寫內容' + (draftInfo.savedAt ? '（' + fmtDT(draftInfo.savedAt) + ' 自動儲存）' : ''), { icon: 'i-info', cls: 't-rose' }); }, 0); }
  } else UI.view = 'intro';
  try { history.replaceState(null, '', '#' + UI.view); } catch (e) { /* ignore */ }
  render();
  if (!storageOk) toast('此瀏覽器不支援自動暫存；關閉頁面後內容無法保留', { icon: 'i-alert', cls: 't-warn' });
  window.CONSULT_FRONT = { state: function () { return { answers: A, view: UI.view, result: RESULT, ui: UI, sup: SUP, place: PLACE }; }, go: go, sound: SND.state, ticketFileName: ticketFileName, fx: BW.stats, countdown: countdown };
})();
