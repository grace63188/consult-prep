<style>
/* ==========================================================================
   G.R.A.C.E Academy｜諮詢前置作業  Design Tokens  v1.0  2026.10.29
   風格：深黑（微暖）＋桃紅，精品感。手機優先。
   對比值均以 WCAG 2.2 相對亮度公式計算（標註於各色旁）。
   ========================================================================== */


:root {
  color-scheme: dark;

  /* ── 底色與面層（同一暖黑色相，只升明度） ───────────────────────── */
  --ink-0:   #0C0A0B;  /* 嵌入面：輸入框、進度軌道（比卡片暗，示意「可填入」） */
  --ink-1:   #110E0F;  /* 頁面底 */
  --ink-2:   #191516;  /* 卡片 */
  --ink-3:   #211C1D;  /* 卡片內層、展開區、表格表頭 */
  --ink-4:   #2B2526;  /* 浮層：下拉選單、對話框、toast */
  --ink-5:   #352E2F;  /* 浮層 hover 列 */
  --scrim:   rgba(8, 6, 7, 0.72); /* 對話框遮罩 */

  /* ── 文字（暖白三層＋停用） ─────────────────────────────────────── */
  --text-1:  #F6EFEA;  /* 主要文字　對 ink-1 16.9:1 */
  --text-2:  #CDC2BC;  /* 次要文字　對 ink-1 11.0:1 */
  --text-3:  #A0948F;  /* 輔助說明　對 ink-1 6.5:1、對 ink-4 5.1:1 */
  --text-disabled: #6E6461; /* 僅限停用狀態，不承載必要資訊 3.4:1 */

  /* ── 桃紅主色（只用於按鈕、進度、選取、完成標記） ───────────────── */
  --rose-500: #FF2E8B;  /* 主色　對 ink-1 5.5:1、對 ink-2 5.2:1 */
  --rose-400: #FF4C9C;  /* hover（暗底上 hover 變亮） */
  --rose-600: #E8247E;  /* pressed　桃紅底深字 4.6:1 */
  --rose-300: #FF77B2;  /* 桃紅文字、連結、選取標籤　對 ink-2 7.4:1 */
  --rose-ink: #1A0911;  /* 桃紅底上的文字　對 rose-500 5.5:1（白字僅 3.5:1，不採用） */
  --rose-tint-1: rgba(255, 46, 139, 0.08);  /* 選取卡片底 */
  --rose-tint-2: rgba(255, 46, 139, 0.14);  /* 選取 hover、部分完成底 */
  --rose-tint-3: rgba(255, 46, 139, 0.22);  /* 強調徽章底 */
  --rose-line-1: rgba(255, 46, 139, 0.32);  /* 選取邊框（淡） */
  --rose-line-2: rgba(255, 46, 139, 0.64);  /* 選取邊框（明確） */
  --rose-glow:   0 0 0 4px rgba(255, 46, 139, 0.18); /* 選取外光，僅用於主按鈕 focus 與勾選完成 */

  /* ── 語意色（降飽和，與桃紅錯開色相） ───────────────────────────── */
  --success-500: #5CCFA3;  /* 玉石綠　對 ink-1 10.0:1 */
  --success-tint: rgba(92, 207, 163, 0.12);
  --success-line: rgba(92, 207, 163, 0.40);
  --warning-500: #E8B85C;  /* 香檳金　對 ink-1 10.5:1 */
  --warning-tint: rgba(232, 184, 92, 0.12);
  --warning-line: rgba(232, 184, 92, 0.40);
  --error-500:   #FF7A5C;  /* 珊瑚橘紅（刻意偏橘，與桃紅區隔）　對 ink-1 7.5:1 */
  --error-tint:  rgba(255, 122, 92, 0.12);
  --error-line:  rgba(255, 122, 92, 0.55);
  --info-500:    #9DB8E8;  /* 霧藍　對 ink-1 9.6:1 */
  --info-tint:   rgba(157, 184, 232, 0.10);

  /* ── 邊線（低透明暖白，看得到但不搶眼） ─────────────────────────── */
  --line-1: rgba(246, 239, 234, 0.07);  /* 區隔線、卡片描邊 */
  --line-2: rgba(246, 239, 234, 0.12);  /* 一般邊框 */
  --line-3: rgba(246, 239, 234, 0.40);  /* 輸入框、勾選框邊框　對 ink-2 3.2:1（非文字 3:1） */
  --line-4: rgba(246, 239, 234, 0.52);  /* 輸入框 hover　4.7:1 */
  --focus-ring: 0 0 0 2px var(--ink-1), 0 0 0 4px var(--rose-300); /* 2px 間隔＋2px 環 */

  /* ── 字體 ──────────────────────────────────────────────────────── */
  --font-serif: 'Noto Serif CJK TC','Noto Serif TC', 'Songti TC', 'PMingLiU', serif;   /* 標題、大數字 */
  --font-sans: 'Noto Sans CJK TC','Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; /* 內文、介面 */
  --font-mono: 'DejaVu Sans Mono','IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace; /* 日期、編號、表格數字 */

  /* ── 字級（手機優先，比例約 1.25；桌機 ≥768px 放大標題） ─────────── */
  --fs-caption: 0.8125rem; /* 13px 標籤、徽章、輔助說明 */
  --fs-small:   0.875rem;  /* 14px 次要文字 */
  --fs-body:    1rem;      /* 16px 內文、輸入框（防 iOS 自動縮放） */
  --fs-lead:    1.125rem;  /* 18px 引言、卡片標題 */
  --fs-h3:      1.25rem;   /* 20px */
  --fs-h2:      1.5rem;    /* 24px */
  --fs-h1:      1.875rem;  /* 30px */
  --fs-display: 2.375rem;  /* 38px 大數字（進度百分比） */
  --lh-tight: 1.3;
  --lh-body:  1.7;   /* 中文內文需較寬行高 */
  --tracking-title: 0.02em;  /* 中文襯線標題微放字距 */
  --tracking-label: 0.08em;  /* 小標籤 */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --measure: 34em; /* 中文行長上限約 34 字 */

  /* ── 間距（4px 基準） ──────────────────────────────────────────── */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;   /* 手機左右留白 */
  --sp-5: 20px;
  --sp-6: 24px;   /* 卡片內距 */
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;  /* 區塊間距 */
  --sp-16: 64px;
  --gutter: var(--sp-4);
  --container: 720px;   /* 前台表單欄寬 */
  --container-wide: 1200px; /* 後台 */

  /* ── 圓角（同心原則：外 = 內 + 內距） ─────────────────────────── */
  --r-xs: 6px;    /* 徽章、勾選框 */
  --r-sm: 10px;   /* 按鈕、輸入框 */
  --r-md: 14px;   /* 單選卡、上傳區 */
  --r-lg: 20px;   /* 卡片 */
  --r-xl: 28px;   /* 對話框 */
  --r-pill: 999px;

  /* ── 陰影（暗底以描邊環為主，深度陰影只給浮層） ─────────────────── */
  --shadow-ring:    0 0 0 1px var(--line-1);
  --shadow-ring-hi: 0 0 0 1px var(--line-2);
  --shadow-float:   0 0 0 1px var(--line-2), 0 12px 32px -8px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-dialog:  0 0 0 1px var(--line-2), 0 24px 64px -12px rgba(0, 0, 0, 0.75);
  --highlight-top:  inset 0 1px 0 rgba(246, 239, 234, 0.04); /* 卡片頂緣微光，精品感細節 */

  /* ── 動態 ──────────────────────────────────────────────────────── */
  --dur-instant: 100ms;  /* hover、列 hover、tab 切換 */
  --dur-fast:    150ms;  /* 按壓、勾選、切換 */
  --dur-base:    200ms;  /* 下拉、toast、tooltip */
  --dur-slow:    280ms;  /* 對話框、展開卡片進場 */
  --dur-exit:    160ms;  /* 離場（約進場 60%） */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);      /* 進場、互動 */
  --ease-in:     cubic-bezier(0.55, 0, 1, 0.45);      /* 離場 */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);     /* 畫面內位移 */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);        /* 顏色、圖示交叉淡入 */
  --press-scale: 0.97;
  --stagger: 40ms;

  /* ── 層級 ──────────────────────────────────────────────────────── */
  --z-sticky: 10;
  --z-dropdown: 20;
  --z-toast: 40;
  --z-dialog: 100;

  /* ── 尺寸 ──────────────────────────────────────────────────────── */
  --hit-min: 44px;
  --control-h: 48px;  /* 按鈕、輸入框高 */
  --icon-sm: 16px;
  --icon-md: 20px;
}

@media (min-width: 768px) {
  :root {
    --fs-h2: 1.75rem;   /* 28px */
    --fs-h1: 2.25rem;   /* 36px */
    --fs-display: 3rem; /* 48px */
    --gutter: var(--sp-8);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-slow: 150ms;
    --press-scale: 1;
    --stagger: 0ms;
  }
}

/* ── 基底 ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ink-1);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-title);
  text-wrap: balance;
  margin: 0;
}
p { text-wrap: pretty; }
.num, time, .date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
::selection { background: var(--rose-tint-3); color: var(--text-1); }

/* ── 確認稿 ui.css ── */
/* 諮詢前置作業｜確認稿共用元件（以 tokens.css 為基準） */
html,body{margin:0}
body{min-height:100dvh}
.hide{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ic{width:var(--icon-md);height:var(--icon-md);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:var(--icon-sm);height:var(--icon-sm)}

/* ── 頁首 ── */
.top{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:12px;padding:10px var(--gutter);background:rgba(17,14,15,.92);border-bottom:1px solid var(--line-1)}
.top img{height:28px;width:auto}
.top .t{flex:1;min-width:0;line-height:1.25}
.top .t b{display:block;font-family:var(--font-serif);font-size:var(--fs-lead);font-weight:600}
.top .t small{color:var(--text-3);font-size:var(--fs-caption)}
.top .t small .mono{color:var(--rose-300)}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-family:var(--font-mono)}
.rail{display:flex;gap:4px;padding:8px var(--gutter) 0}
.rail i{flex:1;height:3px;border-radius:var(--r-pill);background:var(--ink-3)}
.rail i.on{background:var(--rose-500)}
.rail i.cur{background:linear-gradient(90deg,var(--rose-500) 50%,var(--ink-3) 50%)}

/* ── 頁面 ── */
.page{max-width:var(--container);margin:0 auto;padding:20px var(--gutter) 40px}
.eyebrow{font-size:var(--fs-caption);letter-spacing:var(--tracking-label);color:var(--rose-300);font-weight:500}
h1.h{font-size:var(--fs-h1);margin:4px 0 10px}
.lead{color:var(--text-2);font-size:var(--fs-body);margin:0 0 18px;max-width:var(--measure)}
.lead b{color:var(--text-1);font-weight:600}

/* ── 頁頂流程圖 ── */
.flow{display:flex;align-items:flex-start;gap:0;padding:14px 10px 12px;background:var(--ink-2);border-radius:var(--r-lg);box-shadow:var(--shadow-ring),var(--highlight-top);margin-bottom:22px;position:relative}
.flow .fs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative}
.flow .fs + .fs::before{content:"";position:absolute;top:17px;right:calc(50% + 20px);width:calc(100% - 40px);height:0;border-top:1.5px dashed var(--line-3)}
.flow .fs.done + .fs::before{border-top:1.5px solid var(--rose-500)}
.flow .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink-0);box-shadow:inset 0 0 0 1.5px var(--line-3);color:var(--text-3);position:relative;z-index:1}
.flow .fs.done .dot{background:var(--rose-tint-3);box-shadow:inset 0 0 0 1.5px var(--rose-line-2);color:var(--rose-300)}
.flow .fs.cur .dot{background:var(--rose-500);box-shadow:var(--rose-glow);color:var(--rose-ink)}
.flow .fs b{font-size:12px;font-weight:500;color:var(--text-2);line-height:1.35;padding:0 2px}
.flow .fs.cur b{color:var(--text-1);font-weight:600}
.flow .fs small{font-size:11px;color:var(--text-3);line-height:1.3}
.flow-cap{position:absolute;top:-9px;left:14px;padding:0 8px;background:var(--ink-1);font-size:11px;color:var(--text-3);letter-spacing:var(--tracking-label)}

/* 縱向導覽流程圖（作業說明） */
.vflow{list-style:none;margin:0;padding:6px 0 0;counter-reset:v}
.vflow li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;min-height:44px;position:relative}
.vflow li::before{content:"";position:absolute;left:16px;top:-14px;height:28px;border-left:1.5px solid var(--line-2)}
.vflow li:first-child::before{display:none}
.vflow .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink-0);box-shadow:inset 0 0 0 1.5px var(--line-3);color:var(--text-2);position:relative;z-index:1}
.vflow li.first .n{background:var(--rose-500);color:var(--rose-ink);box-shadow:var(--rose-glow)}
.vflow li.last .n{background:var(--rose-tint-3);color:var(--rose-300);box-shadow:inset 0 0 0 1.5px var(--rose-line-2)}
.vflow b{font-weight:500;font-size:15px}
.vflow small{color:var(--text-3);font-size:12px;text-align:right}

/* ── 區塊 ── */
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.sec-h h2{font-size:var(--fs-lead);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-xs);font-size:12px;font-weight:500;background:var(--ink-3);color:var(--text-2);white-space:nowrap}
.badge.req{background:var(--rose-tint-3);color:var(--rose-300)}
.badge.ok{background:var(--success-tint);color:var(--success-500)}
.badge.warn{background:var(--warning-tint);color:var(--warning-500)}
.badge.err{background:var(--error-tint);color:var(--error-500)}
.hint{color:var(--text-3);font-size:var(--fs-small);margin:0 0 10px;line-height:1.6}
.card{background:var(--ink-2);border-radius:var(--r-lg);box-shadow:var(--shadow-ring),var(--highlight-top);padding:18px}

/* ── 輸入 ── */
.field{margin-bottom:16px}
.field label.l{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);font-weight:500;color:var(--text-2);margin-bottom:6px}
.inp{display:flex;align-items:center;gap:10px;height:var(--control-h);padding:0 14px;background:var(--ink-0);border:1px solid var(--line-3);border-radius:var(--r-sm);font-size:var(--fs-body);color:var(--text-1)}
.inp.ph{color:var(--text-disabled)}
.inp.focus{border-color:var(--rose-500);box-shadow:var(--rose-glow)}
.inp.err{border-color:var(--error-500)}
.inp.ok{border-color:var(--success-line)}
.inp.lock{background:var(--ink-3);border-color:var(--line-2)}
.inp .ic{color:var(--text-3)}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-small);margin-top:8px;line-height:1.55}
.msg.ok{color:var(--success-500)}
.msg.err{color:var(--error-500)}
.msg span{color:var(--text-2)}

/* ── 標籤（可點選） ── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--ink-0);box-shadow:inset 0 0 0 1px var(--line-3);color:var(--text-2);font-size:15px;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-2px}
.chip.on{background:var(--rose-tint-2);box-shadow:inset 0 0 0 1.5px var(--rose-line-2);color:var(--text-1);font-weight:500}
.chip.on .ic{color:var(--rose-300)}
.chip.add{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);border:0;color:var(--rose-300);outline:1px dashed var(--line-3);outline-offset:-1px}
.chip.dim{opacity:.4}
.chip.sm{min-height:32px;padding:0 10px;font-size:13px}
.chip .k{font-family:var(--font-mono);font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--rose-500);color:var(--rose-ink);font-weight:600}
.chip.star{background:var(--warning-tint);box-shadow:inset 0 0 0 1.5px var(--warning-line);color:var(--text-1)}
.chip.star .ic{color:var(--warning-500)}
/* 燈泡式點亮 */
.bulb{width:10px;height:10px;border-radius:50%;background:var(--ink-4);box-shadow:inset 0 0 0 1px var(--line-3);flex:none}
.on .bulb,.bulb.on{background:var(--rose-500);box-shadow:0 0 0 3px var(--rose-tint-3),0 0 10px 2px rgba(255,46,139,.55)}
.group-lbl{font-size:12px;color:var(--text-3);letter-spacing:var(--tracking-label);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.group-lbl::after{content:"";flex:1;border-top:1px solid var(--line-1)}

/* ── 開關列 ── */
.sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--ink-4);box-shadow:inset 0 0 0 1px var(--line-3);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-3)}
.sw.on{background:var(--rose-500);box-shadow:0 0 12px rgba(255,46,139,.45)}
.sw.on::after{left:21px;background:var(--rose-ink)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:var(--r-md);background:var(--ink-2);box-shadow:var(--shadow-ring)}
.row + .row{margin-top:6px}
.row .nm{flex:1;min-width:0;line-height:1.35}
.row .nm b{display:block;font-size:15px;font-weight:500}
.row .nm small{display:block;color:var(--text-3);font-size:12px}
.row.lit{background:linear-gradient(90deg,var(--rose-tint-1),transparent 70%),var(--ink-2);box-shadow:inset 0 0 0 1px var(--rose-line-1)}
.row .sub{flex-basis:100%}
.row.wrap{flex-wrap:wrap}
.src{display:flex;gap:6px;flex-basis:100%;padding-left:22px}
.seg{display:inline-flex;padding:3px;gap:3px;background:var(--ink-0);border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg>*{height:30px;padding:0 10px;white-space:nowrap;display:flex;align-items:center;border-radius:7px;font-size:13px;color:var(--text-3)}
.seg>.on{background:var(--rose-tint-3);color:var(--rose-300);font-weight:500}

/* ── 分頁 ── */
.tabs{display:flex;gap:4px;padding:4px;background:var(--ink-0);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line-2);margin-bottom:16px}
.tabs>*{flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);font-size:14px;color:var(--text-3)}
.tabs>.on{background:var(--ink-3);color:var(--text-1);font-weight:500;box-shadow:var(--shadow-ring-hi)}
.tabs .mono{font-size:11px;color:var(--rose-300)}

/* ── 按鈕 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 18px;border-radius:var(--r-sm);font-size:16px;font-weight:600;border:0;width:100%;font-family:inherit}
.btn.pri{background:var(--rose-500);color:var(--rose-ink);box-shadow:0 6px 20px -8px rgba(255,46,139,.7)}
.btn.sec{background:transparent;color:var(--text-1);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.txt{background:transparent;color:var(--rose-300);height:44px;font-weight:500}
.btn.dis{opacity:.4}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 12px}
.btn.lg{height:56px;font-size:17px}
.actions{display:grid;gap:10px;margin-top:24px}
.inline-link{color:var(--rose-300);text-decoration:underline;text-underline-offset:3px}

/* ── 提示框 ── */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:var(--fs-small);line-height:1.6;color:var(--text-2)}
.note .ic{margin-top:2px}
.note b{color:var(--text-1);display:block;font-weight:600}
.note.info{background:var(--info-tint)} .note.info .ic{color:var(--info-500)}
.note.warn{background:var(--warning-tint)} .note.warn .ic{color:var(--warning-500)}
.note.err{background:var(--error-tint);box-shadow:inset 0 0 0 1px var(--error-line)} .note.err .ic{color:var(--error-500)}
.note.ok{background:var(--success-tint)} .note.ok .ic{color:var(--success-500)}

/* ── 權限三欄 ── */
.perm{border-radius:var(--r-lg);background:var(--ink-2);box-shadow:var(--shadow-ring);overflow:hidden}
.perm .ph,.perm .pr{display:grid;grid-template-columns:1fr 64px 64px 64px;align-items:center}
.perm .ph{background:var(--ink-3);font-size:12px;color:var(--text-2);text-align:center;height:48px}
.perm .ph span:first-child{text-align:left;padding-left:14px;color:var(--text-3)}
.perm .ph span{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.perm .pr{min-height:52px;border-top:1px solid var(--line-1)}
.perm .pr > b{font-weight:500;font-size:15px;padding-left:14px}
.perm .pr > i{display:grid;place-items:center;height:52px}
.perm .pr > i::before{content:"";width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-2)}
.perm .pr > i.self::before{width:30px;height:30px;background:var(--rose-500);box-shadow:0 0 12px rgba(255,46,139,.5)}
.perm .pr > i.ask::before{width:30px;height:30px;background:var(--warning-500);box-shadow:0 0 12px rgba(232,184,92,.45)}
.perm .pr > i.none::before{width:30px;height:30px;background:var(--ink-5);box-shadow:inset 0 0 0 1.5px var(--text-3)}
.perm .pr > i.self,.perm .pr > i.ask,.perm .pr > i.none{position:relative}
.perm .pr > i .ic{position:absolute;color:var(--rose-ink);width:16px;height:16px}
.perm .pr > i.none .ic{color:var(--text-1)}
.perm .pr.blank > b{color:var(--text-3)}
.perm .pr.add > b{color:var(--rose-300);display:flex;gap:6px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin:10px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%}

/* ── 步驟線 ── */
.sline{list-style:none;margin:0;padding:0}
.sline li{display:grid;grid-template-columns:30px 1fr 28px;gap:10px;align-items:start;position:relative;padding-bottom:12px}
.sline li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;border-left:2px solid var(--rose-line-1)}
.sline li:last-child::before{display:none}
.sline .n{width:30px;height:30px;border-radius:50%;background:var(--rose-500);color:var(--rose-ink);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;position:relative;z-index:1}
.sline .b{background:var(--ink-3);border-radius:var(--r-md);padding:8px 10px 10px;box-shadow:var(--shadow-ring)}
.sline .b > b{font-size:15px;font-weight:500;display:block;margin-bottom:6px}
.sline .grip{color:var(--text-3);height:30px;display:grid;place-items:center}
.tool{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:var(--r-pill);font-size:12px;background:var(--info-tint);color:var(--info-500);margin:0 4px 4px 0}
.tool.add{background:transparent;color:var(--text-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.tool.miss{background:var(--warning-tint);color:var(--warning-500);box-shadow:inset 0 0 0 1px var(--warning-line)}
.case{border-radius:var(--r-lg);background:var(--ink-2);box-shadow:var(--shadow-ring),var(--highlight-top);margin-bottom:14px;overflow:hidden}
.case-h{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px}
.case-h .cic{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--rose-tint-2);color:var(--rose-300);flex:none}
.case-h .t{flex:1}
.case-h .t b{font-family:var(--font-serif);font-size:18px;font-weight:600;display:block}
.case-h .t small{color:var(--text-3);font-size:12px}
.case-b{padding:4px 16px 18px;border-top:1px solid var(--line-1)}
.case.closed .case-h .cic{background:var(--ink-3);color:var(--text-3)}
.none-toggle{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink-3);font-size:14px;color:var(--text-2);min-height:48px}
.none-toggle .sp{flex:1}
.case.closed .none-toggle{background:var(--ink-3);color:var(--text-1)}

/* ── 放入資料 ── */
.drop{background:var(--ink-2);border-radius:var(--r-md);box-shadow:var(--shadow-ring);padding:14px;margin-bottom:10px}
.drop.done{box-shadow:inset 0 0 0 1px var(--success-line)}
.drop.todo{box-shadow:inset 0 0 0 1px var(--rose-line-1)}
.drop.first{box-shadow:inset 0 0 0 1.5px var(--rose-line-2),var(--rose-glow)}
.drop-h{display:flex;align-items:flex-start;gap:10px}
.drop-h .fd{width:36px;height:36px;border-radius:var(--r-xs);display:grid;place-items:center;background:var(--warning-tint);color:var(--warning-500);flex:none}
.drop-h .t{flex:1;min-width:0}
.drop-h .t b{display:block;font-size:15px;font-weight:600}
.drop-h .t small{display:block;color:var(--text-3);font-size:12px;line-height:1.5}
.drop-btns{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:44px;gap:8px;margin-top:12px;align-items:start}
.drop-btns .btn{height:44px;font-size:13px;padding:0 8px;white-space:nowrap;gap:6px}
.drop-f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px}
.files{margin-top:10px;display:grid;gap:4px}
.files div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);background:var(--ink-3);border-radius:var(--r-xs);padding:6px 10px}
.files div .ic{color:var(--success-500)}
.prog{height:8px;border-radius:var(--r-pill);background:var(--ink-0);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--rose-500);border-radius:var(--r-pill)}
.prog.ok i{background:var(--success-500)}

/* ── 雲端硬碟示意 ── */
.drive{background:#F8F9FA;border-radius:var(--r-md);color:#202124;font-family:var(--font-sans);overflow:hidden;box-shadow:var(--shadow-float)}
.drive-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #E3E3E3;font-size:12px;color:#5F6368}
.drive-top b{color:#202124;font-weight:500}
.drive-list{padding:6px 8px 10px}
.drive-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:13px}
.drive-row:nth-child(odd){background:#fff}
.drive-row svg{width:20px;height:20px}
.drive-row .c{font-size:11px;color:#5F6368;font-family:var(--font-mono)}
.drive-row .map{grid-column:2/4;font-size:11px;color:#B0186B;display:flex;align-items:center;gap:4px}

/* ── 典藏票 ── */
.tk{display:grid;grid-template-columns:44px 1fr;background:var(--ink-2);border-radius:var(--r-lg);box-shadow:var(--shadow-ring),var(--highlight-top);overflow:hidden;position:relative}
.tk-stub{background:var(--ink-3);border-right:2px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0}
.tk-stub span{writing-mode:vertical-rl;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;color:var(--rose-300)}
.tk-stub span.d{color:var(--text-3)}
.tk-stub i{width:8px;height:8px;border-radius:50%;background:var(--rose-500)}
.tk-main{margin:10px;border:1px solid var(--line-2);border-radius:12px;padding:18px 16px;background:radial-gradient(circle at 100% 0%,rgba(255,46,139,.08),transparent 55%)}
.tk-top{display:flex;justify-content:space-between;align-items:flex-start}
.tk-top img{height:56px}
.tk-top small{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;color:var(--text-3);text-align:right;line-height:1.8}
.pill{display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:var(--r-pill);background:var(--rose-tint-3);color:var(--rose-300);font-size:13px;font-weight:600;margin-top:14px}
.tk h1{font-size:27px;margin:12px 0 14px;font-weight:700}
.tk .lbl{color:var(--rose-300);font-size:13px;margin:12px 0 2px}
.tk p{margin:0;color:var(--text-2);font-size:15px;line-height:1.75}
.tk dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.tk dt{font-size:11px;color:var(--text-3);letter-spacing:.15em}
.tk dd{margin:2px 0 0;font-size:15px}
.stamp{position:absolute;width:92px;height:92px;border-radius:50%;border:2.5px solid var(--warning-500);color:var(--warning-500);display:grid;place-items:center;text-align:center;font-family:var(--font-serif);font-weight:700;font-size:15px;line-height:1.3;transform:rotate(-12deg);box-shadow:inset 0 0 0 4px var(--ink-2),inset 0 0 0 5px rgba(232,184,92,.6)}
.stamp.rose{border-color:var(--rose-500);color:var(--rose-400);box-shadow:inset 0 0 0 4px var(--ink-2),inset 0 0 0 5px rgba(255,46,139,.6)}

/* ── 狀態列（檢查送出） ── */
.chk{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 14px;background:var(--ink-2);border-radius:var(--r-md);box-shadow:var(--shadow-ring)}
.chk + .chk{margin-top:6px}
.chk .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk .st.ok{background:var(--success-tint);color:var(--success-500)}
.chk .st.err{background:var(--error-tint);color:var(--error-500)}
.chk .t{flex:1;min-width:0}
.chk .t b{display:block;font-weight:500;font-size:15px}
.chk .t small{color:var(--text-3);font-size:12px}
.chk .go{color:var(--rose-300);font-size:13px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.chk.bad{box-shadow:inset 0 0 0 1px var(--error-line)}

.foot{border-top:1px solid var(--line-1);margin-top:28px;padding:16px var(--gutter) 24px;display:flex;justify-content:space-between;font-size:13px;color:var(--text-3)}
.foot a{color:var(--text-2)}
.bar{position:sticky;bottom:0;background:rgba(17,14,15,.95);border-top:1px solid var(--line-1);padding:12px var(--gutter);display:grid;gap:6px}

/* ── 確認稿 front.html（行業、收入、操作說明圖解） ── */

@media (min-width:1024px){
  .page.wide{max-width:1120px}
  .wide .cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  .wide .flow{max-width:720px}
  .wide .cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
  .wide .cols3 .case{margin:0}
  .page.wide .actions{max-width:420px}
}

.how{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;margin-bottom:22px;border:0;border-radius:var(--r-md);background:var(--info-tint);color:var(--info-500);font-family:inherit;text-align:left}
.how span{flex:1;display:flex;flex-direction:column}
.how b{color:var(--text-1);font-size:15px;font-weight:600}.how small{color:var(--text-2);font-size:12px}
.gl{list-style:none;margin:0;padding:0}
.gs{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:22px}
.gs::before{content:"";position:absolute;left:16px;top:36px;bottom:0;border-left:1.5px dashed var(--rose-line-1)}
.gs.last::before{display:none}
.gn{width:34px;height:34px;border-radius:50%;background:var(--rose-500);color:var(--rose-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700}
.gb > b{display:block;font-size:16px;font-weight:600;line-height:1.5;margin:4px 0 6px}
.gb p{margin:0 0 8px;color:var(--text-3);font-size:13px;line-height:1.6}
.gbr{background:var(--ink-2);border-radius:var(--r-md);box-shadow:var(--shadow-ring);padding:12px;margin-top:10px}
.gbr > b{font-size:15px;font-weight:600}
.gtag{display:inline-block;font-family:var(--font-mono);font-size:12px;background:var(--rose-tint-3);color:var(--rose-300);border-radius:var(--r-xs);padding:1px 7px;margin-right:6px}
.mseq{display:grid;grid-template-columns:1fr;gap:4px;max-width:250px;margin-top:4px}.mseq .marr{font-size:14px;line-height:1}.mseq .mf{padding:10px;font-size:11px}.mseq .mct b{font-size:11px}.mseq .mcb span{font-size:10px;padding:5px 0}.mseq .mbg{font-size:10px}.mseq .gpick,.mseq .gdrag,.mseq .mfile{font-size:11px}.mseq > *{min-width:0}.gb{min-width:0}
.marr{color:var(--rose-300);font-size:12px;text-align:center}
.mf{background:var(--ink-1);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-2);padding:10px;font-size:10px;color:var(--text-2);display:grid;gap:6px;align-content:start}
.gb > .mf{max-width:240px;padding:12px;font-size:11px;gap:7px}
.mtx{font-size:11px;color:var(--text-1);font-weight:600}
.mrose{color:var(--rose-300);font-weight:500}.mok2{color:var(--success-500)}
.mln{height:6px;border-radius:3px;background:var(--ink-3)}.mln.s{width:60%}
.mb{border-radius:7px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:600}
.mb.pri{background:var(--rose-500);color:var(--rose-ink)}
.mb.sec{box-shadow:inset 0 0 0 1px var(--line-3);color:var(--text-1)}
.hl{outline:2px solid var(--warning-500);outline-offset:2px;position:relative}
.mr{display:flex;align-items:center;gap:6px;background:var(--ink-3);border-radius:6px;padding:4px 6px;font-size:10px}
.mr span:nth-child(2){flex:1}
.mfd{width:10px;height:8px;border-radius:2px;background:var(--warning-500);flex:none}
.mok{font-style:normal;color:var(--success-500);font-weight:700}
.mrun{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rose-500);border-right-color:transparent}
.mpg{height:5px;border-radius:3px;background:var(--ink-0);overflow:hidden}.mpg i{display:block;height:100%;background:var(--rose-500)}.mpg.ok i{background:var(--success-500)}
.mc{background:var(--ink-2);border-radius:7px;box-shadow:inset 0 0 0 1px var(--rose-line-1);padding:6px}
.mc.ok{box-shadow:inset 0 0 0 1px var(--success-line)}
.mct{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.mct b{font-size:9px;font-weight:600;color:var(--text-1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbg{font-size:8px;background:var(--ink-3);border-radius:4px;padding:0 4px;color:var(--text-3)}.mbg.ok{background:var(--success-tint);color:var(--success-500)}
.mcb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}.mcb span{font-size:7.5px;text-align:center;border-radius:4px;padding:3px 0;box-shadow:inset 0 0 0 1px var(--line-3);white-space:nowrap}
.mcb span.p{background:var(--rose-500);color:var(--rose-ink);box-shadow:none}
.mfile{font-size:9px;color:var(--text-1)}
.mf.g{background:#fff;color:#202124;box-shadow:var(--shadow-float)}
.gb > .mf.g{max-width:260px}
.gg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500}
.glogo{display:grid;grid-template-columns:5px 5px;gap:1px}.glogo i{width:5px;height:5px;border-radius:50%}
.gacct{display:flex;align-items:center;gap:8px;border:1px solid #DADCE0;border-radius:8px;padding:6px 8px}
.gacct div{flex:1;line-height:1.3}.gacct b{font-size:11px;font-weight:500;display:block}.gacct small{font-size:10px;color:#5F6368}
.gav{width:22px;height:22px;border-radius:50%;background:#B0186B;color:#fff;display:grid;place-items:center;font-size:11px}
.gsel{color:#1A73E8;font-weight:700}
.gscope{font-size:10px;color:#3C4043;line-height:1.6;background:#F1F3F4;border-radius:6px;padding:6px 8px}
.gbtns{display:flex;justify-content:flex-end;gap:8px;font-size:10px;color:#1A73E8}.gbtns span{padding:4px 10px}
.gok{background:#1A73E8;color:#fff;border-radius:6px;outline-color:var(--warning-500)}
.gpick{font-size:9px;padding:3px 4px;border-radius:4px;color:#3C4043}.gpick.on{background:#E8F0FE;color:#1967D2}
.gdrag{font-size:9px;background:#E8F0FE;color:#1967D2;border-radius:4px;padding:3px 4px;transform:rotate(-3deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.mtk{border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);padding:8px;display:grid;gap:2px;background:radial-gradient(circle at 100% 0,rgba(255,46,139,.15),transparent 60%)}
.mtk span{font-size:10px;color:var(--rose-300)}.mtk b{font-family:var(--font-serif);font-size:14px;color:var(--text-1)}.mtk small{font-family:var(--font-mono);font-size:9px;color:var(--text-3)}
.isel{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:var(--r-md);background:var(--ink-0);box-shadow:inset 0 0 0 1.5px var(--rose-line-2)}
.isel.ph{box-shadow:inset 0 0 0 1px var(--line-3)}.isel.ph b{color:var(--text-disabled);font-weight:400}
.isel .nm,.ihit .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.isel .nm small{color:var(--text-3);font-size:12px}.isel .nm b{font-size:16px;font-weight:600}
.isel .chg{display:inline-flex;align-items:center;gap:2px;color:var(--rose-300);font-size:13px;white-space:nowrap}
.code{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--rose-tint-3);color:var(--rose-300);font-size:13px;font-weight:700}
.ipick{margin-top:10px;padding:14px;border-radius:var(--r-lg);background:var(--ink-2);box-shadow:var(--shadow-ring),var(--highlight-top)}
.ipick .group-lbl{margin:16px 0 8px}
.ihit{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--rose-tint-1),transparent 75%),var(--ink-0);box-shadow:inset 0 0 0 1px var(--rose-line-1);color:var(--text-3)}
.ihit .nm b{font-size:15px;font-weight:500;color:var(--text-1)}.ihit .nm small{font-size:12px;color:var(--text-3)}
.ihit mark{background:none;color:var(--rose-300);font-weight:700}
.icats{border-radius:var(--r-md);background:var(--ink-0);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden}
.icat + .icat{border-top:1px solid var(--line-1)}
.icat-h{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;color:var(--text-3)}
.icat-h .code{width:24px;height:24px;font-size:12px;background:var(--ink-3);color:var(--text-2)}
.icat-h b{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--text-1);line-height:1.4}
.icat-h small{font-size:12px}
.icat.open{background:var(--rose-tint-1)}.icat.open .icat-h .code{background:var(--rose-tint-3);color:var(--rose-300)}
.icat.open .chips{padding:0 12px 14px 46px;gap:6px}
.icat.other .icat-h b{color:var(--rose-300)}.icat.other .code{background:transparent;box-shadow:inset 0 0 0 1px var(--line-3);color:var(--rose-300)}
.incs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inc{display:flex;align-items:flex-start;gap:10px;min-height:64px;padding:12px;border-radius:var(--r-md);background:var(--ink-0);box-shadow:inset 0 0 0 1px var(--line-3)}
.inc .bulb{margin-top:5px}
.inc .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.inc .nm b{font-size:14px;font-weight:500;color:var(--text-2)}.inc .nm small{font-size:11.5px;color:var(--text-3);margin-top:2px}
.inc.on{background:var(--rose-tint-2);box-shadow:inset 0 0 0 1.5px var(--rose-line-2)}.inc.on .nm b{color:var(--text-1);font-weight:600}

/* ── 確認稿 extra-component.html（還有其他想補充） ── */

/* ── 觸發按鈕（次要文字按鈕） ── */
.xa-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px;margin:0 -6px;border:0;background:transparent;border-radius:var(--r-xs);font-family:inherit;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-3);text-underline-offset:4px}
.xa-btn:hover{color:var(--text-1)}
.xa-btn:focus-visible{outline:2px solid var(--rose-500);outline-offset:1px}
.xa-btn.pressed{background:var(--ink-3);color:var(--text-1)}
.xa-line{width:16px;height:16px;flex:none;display:block}
.sec-h .xa-btn{margin-left:auto;align-self:center}
.xa-row{display:flex;justify-content:flex-end;margin-top:4px}
.xa-row .xa-btn{min-height:32px}
.xa-row.div{border-top:1px dashed var(--line-2);margin-top:12px;padding-top:4px}

/* ── 遮罩與面板 ── */
.xa-scrim{position:fixed;inset:0;z-index:var(--z-dialog);background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.xa-scrim[hidden]{display:none}
.xa-panel{width:100%;max-height:92dvh;overflow:auto;background:var(--ink-4);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-float);padding:8px var(--gutter) calc(16px + env(safe-area-inset-bottom));color:var(--text-1)}
.xa-grab{width:40px;height:4px;border-radius:var(--r-pill);background:var(--line-3);margin:0 auto 14px}
.xa-hd{display:flex;align-items:flex-start;gap:12px}
.xa-hd .xa-t{flex:1;min-width:0}
.xa-hd h2{margin:0;font-family:var(--font-serif);font-size:var(--fs-h3);font-weight:600;line-height:1.35}
.xa-path{display:inline-block;margin-top:4px;font-size:12px;color:var(--text-3);letter-spacing:.02em}
.xa-x{width:40px;height:40px;margin:-6px -8px 0 0;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--text-3);cursor:pointer}
.xa-x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round}
.xa-desc{margin:12px 0 14px;font-size:var(--fs-small);color:var(--text-2);line-height:1.6}
.xa-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-small);font-weight:500;color:var(--text-2);margin-bottom:6px}
.xa-lbl .mono{font-size:11px;color:var(--text-3);font-weight:400}
.xa-inp{display:block;width:100%;box-sizing:border-box;min-height:84px;resize:vertical;padding:12px 14px;background:var(--ink-0);border:1px solid var(--line-3);border-radius:var(--r-sm);color:var(--text-1);font-family:inherit;font-size:var(--fs-body);line-height:1.6}
.xa-inp::placeholder{color:var(--text-disabled)}
.xa-inp:focus{outline:0;border-color:var(--rose-500);box-shadow:var(--rose-glow)}

/* ── 訊息預覽 ── */
.xa-pv{margin-top:16px}
.xa-pv-l{font-size:12px;color:var(--text-3);letter-spacing:var(--tracking-label);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.xa-pv-l::after{content:"";flex:1;border-top:1px solid var(--line-1)}
.xa-bub{position:relative;margin-left:auto;max-width:92%;padding:12px 14px;border-radius:16px 16px 4px 16px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;line-height:1.7;color:var(--text-2);word-break:break-word}
.xa-bub b{color:var(--rose-300);font-weight:600}
.xa-bub i{font-style:normal;color:var(--text-disabled)}
.xa-to{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--text-3)}

/* ── 按鈕 ── */
.xa-act{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.xa-act .btn{cursor:pointer;margin:0} /* ui.css 的 .sec 區塊間距會套到 .btn.sec，此處歸零 */
.xa-act .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.xa-act .btn .xa-line{width:20px;height:20px}
.xa-note{margin:2px 0 0;text-align:center;font-size:12px;color:var(--text-3)}

/* ── 電腦版：置中對話框 ── */
@media (min-width:768px){
  .xa-scrim{align-items:center;padding:24px}
  .xa-panel{max-width:480px;border-radius:var(--r-xl);padding:24px 24px 20px}
  .xa-grab{display:none}
  .xa-act{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"c s" "n n"}
  .xa-act .btn.sec{grid-area:c;width:auto;padding:0 22px}
  .xa-act .btn.pri{grid-area:s}
  .xa-note{grid-area:n}
}

/* ── 3.1 前台：互動元件（以確認稿 ui.css 為基準，改為可操作元素） ── */
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
input,textarea{font:inherit;color:inherit}
a{color:var(--rose-300)}
img{max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
#app{min-height:100dvh;display:flex;flex-direction:column}
#app>main{flex:1;width:100%}
.page{min-width:0}
.page>*{min-width:0}
@media (prefers-reduced-motion:no-preference){.page.enter{animation:pgin var(--dur-slow) var(--ease-out) both}}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes viewin{from{opacity:0}}

/* 頁首 */
.top .home{display:flex;border-radius:var(--r-xs)}
.top .t small{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.top .t small .ok{color:var(--success-500);display:inline-flex;align-items:center;gap:2px}
.ring circle{transition:stroke-dasharray var(--dur-slow) var(--ease-out)}
.rail i{transition:background-color var(--dur-base) var(--ease-standard)}
h1.h:focus{outline:0}

/* 輸入框（真實 input） */
.inp{position:relative;transition:border-color var(--dur-instant),box-shadow var(--dur-instant)}
.inp:hover{border-color:var(--line-4)}
.inp:focus-within{border-color:var(--rose-500);box-shadow:var(--rose-glow)}
.inp input,.inp textarea{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--text-1);font-size:var(--fs-body)}
.inp input::placeholder,.inp textarea::placeholder{color:var(--text-disabled);opacity:1}
.inp.err{border-color:var(--error-500)}
.inp.ok{border-color:var(--success-line)}
.inp.lock input{color:var(--text-1)}
.inp.sm{height:44px}
.inp .x{display:grid;place-items:center;width:32px;height:32px;margin-right:-8px;border-radius:50%;color:var(--text-3)}
.inp .x:hover{color:var(--text-1);background:var(--ink-3)}
.hint-u{color:var(--text-3);font-size:12px;margin:6px 0 0;line-height:1.6}
.err-t{display:flex;gap:6px;align-items:flex-start;color:var(--error-500);font-size:var(--fs-small);margin:8px 0 0;line-height:1.55}
.addrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.addrow .inp{flex:1;min-width:0;height:44px}
.inp input,.inp textarea{width:100%}
.addrow .btn{flex:none}

/* 區塊（ui.css 的 .sec 會誤套到 .btn.sec，改為只限 section） */
.sec{margin-bottom:0}
section.sec{margin-bottom:26px}
.sec-h{flex-wrap:wrap;row-gap:4px}
.sec-h .xa-btn{margin-left:auto}

/* 可點選標籤 */
.chip{cursor:pointer;transition:background-color var(--dur-instant),box-shadow var(--dur-instant),color var(--dur-instant),transform var(--dur-fast) var(--ease-out);max-width:100%}
.chip:hover{box-shadow:inset 0 0 0 1px var(--line-4)}
.chip.on:hover{box-shadow:inset 0 0 0 1.5px var(--rose-500)}
.chip:active{transform:scale(var(--press-scale))}
.chip span.tx{overflow:hidden;text-overflow:ellipsis}
.chip.add{border:0}
.chip.dim{opacity:.45}
.chip.dim:hover{opacity:.8}
.chip .rm{display:grid;place-items:center;width:20px;height:20px;margin-right:-6px;border-radius:50%;color:var(--text-3)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chips.sm .chip{min-height:36px;padding:0 12px;font-size:14px}

/* 開關、分段 */
.sw{cursor:pointer;transition:background-color var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast)}
.sw::after{transition:left var(--dur-fast) var(--ease-out),background-color var(--dur-fast)}
.sw.hit{position:relative}
.sw.hit::before{content:"";position:absolute;inset:-9px -4px}
.seg{max-width:100%;flex-wrap:wrap}
.seg>*{height:34px;padding:0 12px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:14px;color:var(--text-3);transition:background-color var(--dur-instant),color var(--dur-instant)}
.seg>*:hover{color:var(--text-1)}
.seg>.on{background:var(--rose-tint-3);color:var(--rose-300);font-weight:500}
.seg.full{display:flex}
.seg.full>*{flex:1;height:40px;padding:0 6px}
.kv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.kv>.k{color:var(--text-3);font-size:13px;width:56px;flex:none}
.kv.top{align-items:flex-start}.kv.top>.k{margin-top:8px}

/* 分頁 */
.tabs>*{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);font-size:14px;color:var(--text-3);transition:background-color var(--dur-instant),color var(--dur-instant)}
.tabs>.on{background:var(--ink-3);color:var(--text-1);font-weight:500;box-shadow:var(--shadow-ring-hi)}
.tabs .mono{font-size:11px;color:var(--rose-300)}

/* 按鈕 */
.btn{cursor:pointer;transition:background-color var(--dur-instant),box-shadow var(--dur-instant),transform var(--dur-fast) var(--ease-out),opacity var(--dur-fast)}
.btn:not(:disabled):active{transform:scale(var(--press-scale))}
.btn.pri:not(:disabled):hover{background:var(--rose-400)}
.btn.sec:not(:disabled):hover{box-shadow:inset 0 0 0 1px var(--line-4);background:var(--ink-3)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.txt:hover{color:var(--rose-400)}
.btn.quiet{color:var(--text-2)}
.btn.inl{width:auto}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.how{cursor:pointer}
.how .ic:last-child{transition:transform var(--dur-base) var(--ease-out)}
.how[aria-expanded="true"] .ic:last-child{transform:rotate(180deg)}
.actions .btn.txt{width:100%}

/* 卡片列 */
.row{width:100%;text-align:left}
.row .sw{margin-left:auto}
.row .src{padding-left:22px;flex-wrap:wrap}
.lit-sum{padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.lit-sum span.t{font-size:14px;color:var(--text-2)}
.lit-sum b{color:var(--rose-300)}

/* 行業 */
.isel{width:100%;text-align:left;cursor:pointer}
.ipick .inp{height:48px}
.ihit{width:100%;text-align:left;cursor:pointer;margin-bottom:6px}
.ihit:hover{box-shadow:inset 0 0 0 1px var(--rose-line-2)}
.icat-h{width:100%;text-align:left;cursor:pointer}
.icat-h:hover{background:var(--ink-3)}
.icat.open .chips{padding:0 12px 14px 46px}
.ind-empty{font-size:13px;color:var(--text-3);padding:4px 2px 8px}
.inc{width:100%;text-align:left;cursor:pointer;transition:background-color var(--dur-instant),box-shadow var(--dur-instant)}
.inc:hover{box-shadow:inset 0 0 0 1px var(--line-4)}
.inc.on:hover{box-shadow:inset 0 0 0 1.5px var(--rose-500)}
@media (max-width:359px){.incs{grid-template-columns:1fr}}

/* 權限 */
.perm .ph,.perm .pr{grid-template-columns:minmax(0,1fr) 60px 60px 60px}
.perm .pr>.pl{display:flex;align-items:center;gap:2px;padding-left:14px;min-width:0}
.perm .pr>.pl .plb{flex:1;min-width:0;text-align:left;font-weight:500;font-size:15px;min-height:52px;overflow-wrap:anywhere}
.perm .pr>.pl .rm{color:var(--text-3);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:none}
.perm .pc{display:grid;place-items:center;height:52px;position:relative}
.perm .pc::before{content:"";width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-3);transition:all var(--dur-fast) var(--ease-out)}
.perm .pc:hover::before{box-shadow:inset 0 0 0 1.5px var(--line-4);width:20px;height:20px}
.perm .pc.self::before{width:30px;height:30px;background:var(--rose-500);box-shadow:0 0 12px rgba(255,46,139,.5)}
.perm .pc.ask::before{width:30px;height:30px;background:var(--warning-500);box-shadow:0 0 12px rgba(232,184,92,.45)}
.perm .pc.none::before{width:30px;height:30px;background:var(--ink-5);box-shadow:inset 0 0 0 1.5px var(--text-3)}
.perm .pc .ic{position:absolute;width:16px;height:16px;color:var(--rose-ink)}
.perm .pc.none .ic{color:var(--text-1)}
.perm .pr.miss>.pl{color:var(--text-2)}
.perm .add{padding:10px 12px;border-top:1px solid var(--line-1)}
.perm .ph span{font-size:11px}
@media (max-width:374px){.perm .ph,.perm .pr{grid-template-columns:minmax(0,1fr) 52px 52px 52px}}

/* 步驟線、拖曳 */
.sline li{touch-action:pan-y}
.sline li.dragging{z-index:5}
.sline li.dragging .b{box-shadow:0 0 0 1.5px var(--rose-line-2),var(--shadow-float);background:var(--ink-4)}
.sline li:not(.dragging){transition:transform var(--dur-base) var(--ease-out)}
.sline .b{min-width:0}
.sline .bt{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
.sline .bt b{flex:1;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.sline .bt .rm{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--text-3);margin:-4px -4px 0 0;flex:none}
.sline .bt .rm:hover{color:var(--text-1);background:var(--ink-4)}
.sline .grip{width:28px;height:44px;margin-top:-7px;cursor:grab;touch-action:none;border-radius:var(--r-xs)}
.sline .grip:active{cursor:grabbing}
.tool{border:0;cursor:default}
button.tool{cursor:pointer}
.tool .rm{display:inline-grid;place-items:center;margin-right:-4px}
.tpanel{margin-top:8px;padding:10px;border-radius:var(--r-sm);background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.tpanel .chips{gap:6px}
.case-h{flex-wrap:wrap}
.case-h .t{min-width:0}
.none-toggle{width:100%;text-align:left;cursor:pointer}
.none-toggle:hover{color:var(--text-1)}
.case .xa-row{padding:0 16px 8px}
.case.closed .xa-row{padding-top:8px}

/* 資源清單 */
.site{padding:14px;margin-bottom:10px}
.site-h{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.site-h b{font-size:14px;color:var(--text-2);font-weight:500}
.site-h .rm{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--text-3)}
.site-h .rm:hover{color:var(--text-1);background:var(--ink-3)}
.plan{margin-top:12px;padding:12px;border-radius:var(--r-sm);background:var(--ink-3);display:grid;gap:10px}
.plan .field{margin:0}
.plan .k{font-size:13px;color:var(--text-2);margin-bottom:6px;display:block}
.tl{padding:12px 14px;margin-bottom:8px}
.tl-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tl-h b{flex:1;font-weight:500;font-size:15px}
.tl-h .badge{flex:none}

/* 放入資料 */
.drop-h .t b{overflow-wrap:anywhere}
.drop-btns .btn.wide{grid-column:1/-1}
.drop-f{gap:8px;flex-wrap:wrap}
.drop-f a,.drop-f button{font-size:13px}
.drop-f .none{color:var(--text-3);text-decoration:underline;text-underline-offset:3px;min-height:36px}
.drop-f .none:hover{color:var(--text-1)}
.files div{min-width:0}
.files div span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files div .rm{color:var(--text-3);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:none}
.files div.lk .ic{color:var(--info-500)}
.files div.cloud{color:var(--text-3)}
.files .upg{display:block;flex-basis:100%}
.files div.up{flex-wrap:wrap}
.lform{margin-top:10px;padding:12px;border-radius:var(--r-sm);background:var(--ink-3);display:grid;gap:8px}
.lform .row2{display:flex;gap:8px}
.lform .row2 .btn{flex:1}
.drive-row{min-width:0}
.drive-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkfold{display:grid;gap:6px}
.chk .go{background:none;cursor:pointer;min-height:44px}
.chk .t small{display:block;overflow-wrap:anywhere}
.sendbar{margin-top:20px;display:grid;gap:8px}
.sendbar .goto{display:flex;justify-content:center;align-items:center;gap:6px;min-height:40px;font-size:14px;color:var(--warning-500);flex-wrap:wrap;text-align:center}
.sendbar .goto .inline-link{color:var(--rose-300)}
.guide{margin:-8px 0 22px;padding:16px;border-radius:var(--r-lg);background:var(--ink-2);box-shadow:var(--shadow-ring)}
.prog i{transition:width var(--dur-slow) var(--ease-out)}

/* 小視窗、確認框、提示 */
dialog.dlg{padding:0;border:0;background:var(--ink-4);color:var(--text-1);border-radius:var(--r-xl);box-shadow:var(--shadow-dialog);width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px)}
dialog.dlg::backdrop{background:var(--scrim)}
dialog.dlg .in{padding:22px 20px 18px}
dialog.dlg h2{font-size:var(--fs-h3);margin:0 0 8px}
dialog.dlg h2:focus{outline:0}
dialog.dlg p{margin:0 0 12px;color:var(--text-2);font-size:var(--fs-small);line-height:1.7}
dialog.dlg .acts{display:grid;gap:8px;margin-top:14px}
@media (min-width:480px){dialog.dlg .acts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){dialog.dlg[open]{animation:dlgin var(--dur-slow) var(--ease-out) both}}
@keyframes dlgin{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:var(--z-toast);display:grid;justify-items:center;gap:8px;padding:0 16px;pointer-events:none}
body.has-dl .toasts{bottom:calc(var(--dl-h,64px) + 12px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:520px;width:100%;padding:10px 12px 10px 14px;border-radius:var(--r-md);background:var(--ink-4);box-shadow:var(--shadow-float);font-size:var(--fs-small);color:var(--text-1)}
.toast .ic{color:var(--rose-300)}
.toast.err .ic{color:var(--error-500)}
.toast.ok .ic{color:var(--success-500)}
.toast span{flex:1}
.toast .btn{height:36px;width:auto;font-size:14px;padding:0 10px}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise var(--dur-base) var(--ease-out) both}}

/* 寬版 */
